<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Word Memo</title>
        <style>
        * {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #f5f5f5;
    color: #222;
}
.container {
    width: min(700px, 90%);
    margin: 50px auto;
}
h1 {
    margin-bottom: 30px;
}
h2 {
    font-size: 18px;
}
/* 検索欄 */
#searchForm {
    display: flex;
    gap: 10px;
}
#wordInput {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #222;
    color: white;
    cursor: pointer;
}
button:hover {
    opacity: 0.8;
}
/* 検索結果 */
.search-result {
    margin-top: 30px;
    padding: 20px;
    background: white;
    border-radius: 10px;
}
#currentWord {
    font-size: 24px;
    font-weight: bold;
}
#weblioLink {
    display: inline-block;
    margin-top: 10px;
    color: #0066cc;
}
/* 履歴 */
.history {
    margin-top: 30px;
    padding: 20px;
    background: white;
    border-radius: 10px;
}
.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#clearHistory {
    background: #777;
}
#historyList {
    padding: 0;
    margin: 20px 0 0;
    list-style: none;
}
.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}
.word {
    font-weight: bold;
}
.date {
    color: #888;
    font-size: 12px;
}
.history-link {
    margin-left: 15px;
    color: #0066cc;
}

        </style>
</head>

<body>

    <main class="container">

        <h1>English Word Memo</h1>

        <form id="searchForm">

            <input
                type="text"
                id="wordInput"
                placeholder="英単語を入力"
                autocomplete="off"
            >

            <button type="submit">
                検索
            </button>

        </form>

        <section class="search-result">

            <h2>検索</h2>

            <p id="currentWord">
                ここに検索した単語が表示されます。
            </p>

            <a
                id="weblioLink"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Weblioで意味を見る
            </a>

        </section>

        <section class="history">

            <div class="history-header">
                <h2>検索履歴</h2>

                <button id="clearHistory">
                    履歴を削除
                </button>
            </div>

            <ul id="historyList"></ul>

        </section>

    </main>

    <script>
    const searchForm = document.querySelector("#searchForm");
const wordInput = document.querySelector("#wordInput");
const currentWord = document.querySelector("#currentWord");
const weblioLink = document.querySelector("#weblioLink");
const historyList = document.querySelector("#historyList");
const clearHistoryButton = document.querySelector("#clearHistory");
// ==============================
// 履歴の読み込み
// ==============================
let history = JSON.parse(
    localStorage.getItem("wordHistory")
) || [];
// ==============================
// 履歴を保存
// ==============================
function saveHistory() {
    localStorage.setItem(
        "wordHistory",
        JSON.stringify(history)
    );
}
// ==============================
// 履歴を画面に表示
// ==============================
function displayHistory() {
    historyList.innerHTML = "";
    history.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `
            <div>
                <div class="word">
                    ${item.word}
                </div>
                <div class="date">
                    ${item.date}
                </div>
            </div>
            <a
                class="history-link"
                href="${item.url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                Weblio
            </a>
        `;
        historyList.appendChild(li);
    });
}
// ==============================
// 単語を検索
// ==============================
searchForm.addEventListener("submit", function(event) {
    event.preventDefault();
    const word = wordInput.value.trim();
    // 空欄なら何もしない
    if (word === "") {
        return;
    }
    // Weblioの検索URL
    const url =
        "https://ejje.weblio.jp/content/" +
        encodeURIComponent(word);
    // 現在の単語を表示
    currentWord.textContent = word;
    // Weblioリンクを設定
    weblioLink.href = url;
    // 履歴に追加
    const newItem = {
        word: word,
        date: new Date().toLocaleString(
            "ja-JP"
        ),
        url: url
    };
    history.unshift(newItem);
    // 同じ単語が大量に並ぶのを防ぐ
    history = history.filter(
        (item, index, array) => {
            return index === array.findIndex(
                other =>
                    other.word.toLowerCase() ===
                    item.word.toLowerCase()
            );
        }
    );
    // 保存
    saveHistory();
    // 表示更新
    displayHistory();
    // 入力欄を空にする
    wordInput.value = "";
});
// ==============================
// 履歴を全削除
// ==============================
clearHistoryButton.addEventListener(
    "click",
    function() {
        if (history.length === 0) {
            return;
        }
        const result = confirm(
            "検索履歴をすべて削除しますか？"
        );
        if (!result) {
            return;
        }
        history = [];
        saveHistory();
        displayHistory();
    }
);
// ==============================
// 初期表示
// ==============================
displayHistory();

    </script>

</body>
</html>
