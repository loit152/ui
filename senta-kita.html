<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>English Word Memo</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f5f5;
            color: #222;
        }
        .container {
            width: min(700px, 90%);
            margin: 50px auto;
        }
        h1 {
            margin-bottom: 30px;
        }
        h2 {
            font-size: 18px;
        }
        /* =========================
           検索欄
        ========================= */
        #searchForm {
            display: flex;
            gap: 10px;
        }
        #wordInput {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.8;
        }
        /* =========================
           検索結果
        ========================= */
        .search-result {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        #currentWord {
            font-size: 24px;
            font-weight: bold;
        }
        .dictionary-links {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .dictionary-links a {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 6px;
            background: #eee;
            color: #222;
            text-decoration: none;
        }
        .dictionary-links a:hover {
            opacity: 0.7;
        }
        /* =========================
           履歴
        ========================= */
        .history {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #clearHistory {
            background: #777;
        }
        #historyList {
            padding: 0;
            margin: 20px 0 0;
            list-style: none;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }
        .word {
            font-weight: bold;
            font-size: 18px;
        }
        .date {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }
        .history-links {
            display: flex;
            gap: 8px;
        }
        .history-links a {
            padding: 7px 10px;
            background: #eee;
            border-radius: 5px;
            color: #222;
            text-decoration: none;
            font-size: 13px;
        }
        .history-links a:hover {
            opacity: 0.7;
        }
        /* =========================
           スマートフォン
        ========================= */
        @media (max-width: 600px) {
            .history-item {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }
            .dictionary-links {
                flex-direction: column;
            }
            .dictionary-links a {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>
            English Word Memo
        </h1>
        <!-- =====================
             検索フォーム
        ====================== -->
        <form id="searchForm">
            <input
                type="text"
                id="wordInput"
                placeholder="英単語を入力"
                autocomplete="off"
            >
            <button type="submit">
                検索
            </button>
        </form>
        <!-- =====================
             現在の単語
        ====================== -->
        <section class="search-result">
            <h2>
                検索
            </h2>
            <p id="currentWord">
                ここに検索した単語が表示されます。
            </p>
            <div class="dictionary-links">
                <!-- Weblio -->
                <a
                    id="weblioLink"
                    href="#"
                    target="_self"
                    rel="noopener noreferrer"
                >
                    Weblio
                </a>
                <!-- EnglishBattle -->
                <a
                    id="englishBattleLink"
                    href="#"
                    target="_self"
                    rel="noopener noreferrer"
                >
                    EnglishBattle
                </a>
            </div>
        </section>
        <!-- =====================
             履歴
        ====================== -->
        <section class="history">
            <div class="history-header">
                <h2>
                    検索履歴
                </h2>
                <button id="clearHistory">
                    履歴を削除
                </button>
            </div>
            <ul id="historyList"></ul>
        </section>
    </main>
    <script>
        // ========================================
        // HTML要素を取得
        // ========================================
        const searchForm =
            document.querySelector("#searchForm");
        const wordInput =
            document.querySelector("#wordInput");
        const currentWord =
            document.querySelector("#currentWord");
        const weblioLink =
            document.querySelector("#weblioLink");
        const englishBattleLink =
            document.querySelector("#englishBattleLink");
        const historyList =
            document.querySelector("#historyList");
        const clearHistoryButton =
            document.querySelector("#clearHistory");
        // ========================================
        // localStorageから履歴を読み込む
        // ========================================
        let history =
            JSON.parse(
                localStorage.getItem("wordHistory")
            ) || [];
        // ========================================
        // 履歴を保存
        // ========================================
        function saveHistory() {
            localStorage.setItem(
                "wordHistory",
                JSON.stringify(history)
            );
        }
        // ========================================
        // 辞書URLを作る
        // ========================================
        function createDictionaryURLs(word) {
            return {
                weblio:
                    "https://ejje.weblio.jp/content/" +
                    encodeURIComponent(word),
                englishBattle:
                    "https://english-battle.com/word/" +
                    encodeURIComponent(word)
            };
        }
        // ========================================
        // 履歴を表示
        // ========================================
        function displayHistory() {
            // 一度画面を空にする
            historyList.innerHTML = "";
            // 履歴を1件ずつ処理
            history.forEach(function(item) {
                const li =
                    document.createElement("li");
                li.className =
                    "history-item";
                li.innerHTML = `
                    <div>
                        <div class="word">
                            ${item.word}
                        </div>
                        <div class="date">
                            ${item.date}
                        </div>
                    </div>
                    <div class="history-links">
                        <a
                            href="${item.weblio}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Weblio
                        </a>
                        <a
                            href="${item.englishBattle}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            EnglishBattle
                        </a>
                    </div>
                `;
                historyList.appendChild(li);
            });
        }
        // ========================================
        // 検索
        // ========================================
        searchForm.addEventListener(
            "submit",
            function(event) {
                // フォームのページ遷移を止める
                event.preventDefault();
                // 入力された単語を取得
                const word =
                    wordInput.value.trim();
                // 空欄なら終了
                if (word === "") {
                    return;
                }
                // 辞書URLを作成
                const urls =
                    createDictionaryURLs(word);
                // ====================================
                // 現在の単語を表示
                // ====================================
                currentWord.textContent =
                    word;
                // Weblio
                weblioLink.href =
                    urls.weblio;
                // EnglishBattle
                englishBattleLink.href =
                    urls.englishBattle;
                // ====================================
                // 履歴に追加
                // ====================================
                const newItem = {
                    word: word,
                    date:
                        new Date().toLocaleString(
                            "ja-JP"
                        ),
                    weblio:
                        urls.weblio,
                    englishBattle:
                        urls.englishBattle
                };
                // 最新の検索を先頭に追加
                history.unshift(newItem);
                // ====================================
                // 同じ単語を削除
                // ====================================
                history =
                    history.filter(
                        function(item, index, array) {
                            return (
                                index ===
                                array.findIndex(
                                    function(other) {
                                        return (
                                            other.word
                                                .toLowerCase()
                                            ===
                                            item.word
                                                .toLowerCase()
                                        );
                                    }
                                )
                            );
                        }
                    );
                // ====================================
                // 保存
                // ====================================
                saveHistory();
                // ====================================
                // 画面更新
                // ====================================
                displayHistory();
                // ====================================
                // 入力欄を空にする
                // ====================================
                wordInput.value = "";
            }
        );
        // ========================================
        // 履歴を全削除
        // ========================================
        clearHistoryButton.addEventListener(
            "click",
            function() {
                // 履歴がなければ何もしない
                if (history.length === 0) {
                    return;
                }
                // 確認
                const result =
                    confirm(
                        "検索履歴をすべて削除しますか？"
                    );
                if (!result) {
                    return;
                }
                // 履歴を空にする
                history = [];
                // 保存
                saveHistory();
                // 表示更新
                displayHistory();
            }
        );
        // ========================================
        // ページを開いたときに履歴を表示
        // ========================================
        displayHistory();
    </script>
</body>
</html>
