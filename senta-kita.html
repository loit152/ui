<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>English Word Memo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(800px, 92%);
            margin: 50px auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            font-size: 18px;
        }


        /* =========================
           検索
        ========================= */

        #searchForm {
            display: flex;
            gap: 10px;
        }

        #wordInput {
            flex: 1;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 9px 14px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }


        /* =========================
           検索結果
        ========================= */

        .search-result {
            margin-top: 30px;
            padding: 20px;

            background: white;
            border-radius: 10px;
        }

        #currentWord {
            font-size: 24px;
            font-weight: bold;
        }

        .dictionary-links {
            display: flex;
            gap: 10px;

            margin-top: 15px;
        }

        .dictionary-links a {
            display: inline-block;

            padding: 10px 15px;

            border-radius: 6px;

            background: #eee;
            color: #222;

            text-decoration: none;
        }

        .dictionary-links a:hover {
            opacity: 0.7;
        }


        /* =========================
           履歴
        ========================= */

        .history {
            margin-top: 30px;
            padding: 20px;

            background: white;
            border-radius: 10px;
        }

        .history-header {
            display: flex;

            justify-content: space-between;
            align-items: center;
        }

        #clearHistory {
            background: #777;
        }

        #historyList {
            padding: 0;
            margin: 20px 0 0;

            list-style: none;
        }


        /* =========================
           単語カード
        ========================= */

        .history-item {
            padding: 18px 0;

            border-bottom: 1px solid #eee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .word-row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .word {
            font-weight: bold;
            font-size: 20px;
        }

        .date {
            color: #888;
            font-size: 12px;

            margin-top: 4px;
        }


        /* =========================
           辞書リンク
        ========================= */

        .history-links {
            display: flex;
            gap: 8px;

            margin-top: 12px;
        }

        .history-links a {
            padding: 7px 10px;

            background: #eee;

            border-radius: 5px;

            color: #222;

            text-decoration: none;

            font-size: 13px;
        }

        .history-links a:hover {
            opacity: 0.7;
        }


        /* =========================
           メモ
        ========================= */

        .memo-area {
            margin-top: 15px;
            padding: 15px;

            background: #f8f8f8;

            border-radius: 8px;
        }

        .memo-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;
        }

        .memo-title {
            font-weight: bold;
            font-size: 14px;
        }

        .memo-text {
            margin: 0;
            padding: 0;

            white-space: pre-wrap;

            line-height: 1.6;

            color: #444;

            text-align: left;
        }

        .memo-empty {
            color: #999;
            font-style: italic;
        }


        /* =========================
           メモ編集
        ========================= */

        .memo-editor {
            display: block;

            width: 100%;
            min-height: 120px;

            margin: 0;
            padding: 10px;

            resize: vertical;

            border: 1px solid #ccc;
            border-radius: 6px;

            background: white;

            font-family: inherit;
            font-size: 14px;

            line-height: 1.6;

            text-align: left;
        }

        .memo-buttons {
            display: flex;
            gap: 8px;

            margin-top: 10px;
        }

        .save-memo {
            background: #222;
        }

        .cancel-memo {
            background: #777;
        }


        /* =========================
           削除
        ========================= */

        .delete-word {
            margin-left: auto;

            background: #b33;
        }

        .delete-word:hover {
            background: #922;
        }


        /* =========================
           スマートフォン
        ========================= */

        @media (max-width: 600px) {

            .word-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .delete-word {
                margin-left: 0;
            }

            .dictionary-links {
                flex-direction: column;
            }

            .dictionary-links a {
                text-align: center;
            }

            .history-links {
                flex-wrap: wrap;
            }

        }

        /* =========================
        複数検索
        ========================= */

        .bulk-search-entry {
            margin-top: 12px;
        }

        .bulk-search-entry button {
            width: 100%;
        }

        .bulk-help {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
        }

        .bulk-word-input {
            display: block;
            width: 100%;
            min-height: 160px;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            background: white;
            font: inherit;
            font-size: 16px;
            line-height: 1.7;

            resize: vertical;
        }

        .bulk-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .bulk-buttons button {
            flex: 1;
        }

        .bulk-cancel {
            background: #777;
        }

        .bulk-result-item {
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .bulk-result-item:last-child {
            border-bottom: none;
        }

        .bulk-result-word {
            font-weight: bold;
            font-size: 18px;
        }

        .bulk-result-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .bulk-result-links a {
            padding: 7px 10px;
            border-radius: 5px;
            background: #eee;
            color: #222;
            text-decoration: none;
            font-size: 13px;
        }

        .bulk-result-links a:hover {
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .bulk-buttons {
                flex-direction: column;
            }
        }

    </style>
</head>


<body>

    <main class="container">

        <h1>
            English Word Memo
        </h1>


        <!-- =====================
             検索フォーム
        ====================== -->

        <form id="searchForm">

            <input
                type="text"
                id="wordInput"
                placeholder="英単語を入力"
                autocomplete="off"
            >

            <button type="submit">
                検索
            </button>

        </form>

<!-- 複数検索を開く -->
<div class="bulk-search-entry">
    <button id="openBulkSearch" type="button">
        複数検索
    </button>
</div>

<!-- 複数検索画面 -->
<section id="bulkSearchPanel" class="search-result" hidden>
    <h2>複数検索</h2>

    <p class="bulk-help">
        1行につき1単語を入力してください。
        改行で区切ってまとめて検索できます。
    </p>

    <textarea
        id="bulkWordInput"
        class="bulk-word-input"
        rows="8"
        placeholder="accomplish&#10;peculiar&#10;curious&#10;withdraw"
    ></textarea>

    <div class="bulk-buttons">
        <button id="bulkSearchButton" type="button">
            まとめて検索
        </button>

        <button
            id="closeBulkSearch"
            class="bulk-cancel"
            type="button"
        >
            戻る
        </button>
    </div>

    <p id="bulkSearchStatus" aria-live="polite"></p>

    <div id="bulkSearchResults"></div>
</section>


        <!-- =====================
             現在の検索結果
        ====================== -->

        <section class="search-result">

            <h2>
                検索
            </h2>

            <p id="currentWord">
                ここに検索した単語が表示されます。
            </p>

            <div class="dictionary-links">

                <a
                    id="weblioLink"
                    href="#"
                    target="_self"
                >
                    Weblio
                </a>

                <a
                    id="englishBattleLink"
                    href="#"
                    target="_self"
                >
                    EnglishBattle
                </a>

            </div>

        </section>


        <!-- =====================
             検索履歴
        ====================== -->

        <section class="history">

            <div class="history-header">

                <h2>
                    検索履歴
                </h2>

                <button
                    id="clearHistory"
                    type="button"
                >
                    履歴を削除
                </button>

            </div>

            <ul id="historyList"></ul>

        </section>

    </main>
    <footer><a href="Memorize/Ellis.html">Ellis</a></footer>

    <script>

        // ========================================
        // HTML要素
        // ========================================

        const searchForm =
            document.querySelector("#searchForm");

        const wordInput =
            document.querySelector("#wordInput");

        const currentWord =
            document.querySelector("#currentWord");

        const weblioLink =
            document.querySelector("#weblioLink");

        const englishBattleLink =
            document.querySelector("#englishBattleLink");

        const historyList =
            document.querySelector("#historyList");

        const clearHistoryButton =
                document.querySelector("#clearHistory");
    const openBulkSearch =
        document.querySelector("#openBulkSearch");

    const bulkSearchPanel =
        document.querySelector("#bulkSearchPanel");

    const bulkWordInput =
        document.querySelector("#bulkWordInput");

    const bulkSearchButton =
        document.querySelector("#bulkSearchButton");

    const closeBulkSearch =
        document.querySelector("#closeBulkSearch");

    const bulkSearchStatus =
        document.querySelector("#bulkSearchStatus");

    const bulkSearchResults =
        document.querySelector("#bulkSearchResults");


        // ========================================
        // 履歴を読み込む
        // ========================================

        let history =
            JSON.parse(
                localStorage.getItem("wordHistory")
            ) || [];


        // ========================================
        // 古いデータにmemoがない場合
        // ========================================

        history = history.map(function(item) {

            return {
                ...item,
                memo: item.memo || ""
            };

        });


        // ========================================
        // 保存
        // ========================================

        function saveHistory() {

            localStorage.setItem(
                "wordHistory",
                JSON.stringify(history)
            );

        }


        // ========================================
        // 辞書URL
        // ========================================

        function createDictionaryURLs(word) {

            return {

                weblio:
                    "https://ejje.weblio.jp/content/" +
                    encodeURIComponent(word),

                englishBattle:
                    "https://english-battle.com/word/" +
                    encodeURIComponent(word)

            };

        }


        // ========================================
        // HTMLエスケープ
        // ========================================

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // ========================================
        // 履歴を表示
        // ========================================

        function displayHistory() {

            historyList.innerHTML = "";


            history.forEach(function(item, index) {

                const li =
                    document.createElement("li");

                li.className =
                    "history-item";


                li.innerHTML = `

                    <div class="word-row">

                        <div>

                            <div class="word">
                                ${escapeHTML(item.word)}
                            </div>

                            <div class="date">
                                ${escapeHTML(item.date)}
                            </div>

                        </div>


                        <button
                            type="button"
                            class="delete-word"
                            data-index="${index}"
                        >
                            削除
                        </button>

                    </div>


                    <div class="history-links">

                        <a
                            href="${item.weblio}"
                            target="_self"
                            rel="noreferrer"
                        >
                            Weblio
                        </a>

                        <a
                            href="${item.englishBattle}"
                            target="_self"
                            rel="noreferrer"
                        >
                            EnglishBattle
                        </a>

                    </div>


                    <div class="memo-area">

                        <div class="memo-header">

                            <span class="memo-title">
                                Memo
                            </span>

                            <button
                                type="button"
                                class="edit-memo"
                                data-index="${index}"
                            >
                                Edit
                            </button>

                        </div>


                        <div class="memo-view">

                            ${
                                item.memo
                                ? `
                                    <div class="memo-text">
                                        ${escapeHTML(item.memo)}
                                    </div>
                                `
                                : `
                                    <div class="memo-text memo-empty">
                                        メモはありません。
                                    </div>
                                `
                            }

                        </div>

                    </div>

                `;


                historyList.appendChild(li);

            });

        }


        // ========================================
        // 検索
        // ========================================

        searchForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const word =
                    wordInput.value.trim();


                if (word === "") {
                    return;
                }


                const urls =
                    createDictionaryURLs(word);


                // 現在の単語

                currentWord.textContent =
                    word;


                // Weblio

                weblioLink.href =
                    urls.weblio;

                // EnglishBattle

                englishBattleLink.href =
                    urls.englishBattle;


                // ====================================
                // 同じ単語があるか
                // ====================================

                const existingIndex =
                    history.findIndex(
                        function(item) {

                            return (
                                item.word.toLowerCase()
                                ===
                                word.toLowerCase()
                            );

                        }
                    );


                // ====================================
                // 既存単語
                // ====================================

                if (existingIndex !== -1) {

                    const existing =
                        history.splice(
                            existingIndex,
                            1
                        )[0];


                    existing.word =
                        word;

                    existing.date =
                        new Date().toLocaleString(
                            "ja-JP"
                        );

                    existing.weblio =
                        urls.weblio;

                    existing.englishBattle =
                        urls.englishBattle;


                    history.unshift(existing);

                }


                // ====================================
                // 新しい単語
                // ====================================

                else {

                    history.unshift({

                        word: word,

                        date:
                            new Date().toLocaleString(
                                "ja-JP"
                            ),

                        weblio:
                            urls.weblio,

                        englishBattle:
                            urls.englishBattle,

                        memo: ""

                    });

                }


                saveHistory();

                displayHistory();

                wordInput.value = "";

            }
        );
                
        /* ========================================
        複数検索画面を開く
        ======================================== */

        openBulkSearch.addEventListener("click", function() {
            bulkSearchPanel.hidden = false;
            bulkSearchStatus.textContent = "";
            bulkSearchResults.replaceChildren();
            bulkWordInput.focus();
        });


        /* ========================================
        複数検索画面を閉じる
        ======================================== */

        closeBulkSearch.addEventListener("click", function() {
            bulkSearchPanel.hidden = true;
        });


        /* ========================================
        複数検索
        ======================================== */

        bulkSearchButton.addEventListener("click", function() {

            // 改行で分割し、空行を除去
            const words = bulkWordInput.value
                .split(/\r?\n/)
                .map(word => word.trim())
                .filter(Boolean);

            if (words.length === 0) {
                bulkSearchStatus.textContent =
                    "英単語を1つ以上入力してください。";
                return;
            }

            // 大文字・小文字を区別せず重複を除去
            const uniqueWords = [
                ...new Map(
                    words.map(word => [
                        word.toLowerCase(),
                        word
                    ])
                ).values()
            ];

            const now = new Date().toLocaleString("ja-JP");

            // 結果表示領域を初期化
            bulkSearchResults.replaceChildren();

            // 入力された各単語を履歴に登録
            uniqueWords.forEach(function(word) {

                const urls = createDictionaryURLs(word);

                const existingIndex = history.findIndex(
                    item =>
                        item.word.toLowerCase() ===
                        word.toLowerCase()
                );

                let item;

                if (existingIndex !== -1) {
                    // 既存データを再利用してメモを維持
                    item = history.splice(existingIndex, 1)[0];

                    item.word = word;
                    item.date = now;
                    item.weblio = urls.weblio;
                    item.englishBattle = urls.englishBattle;
                    item.memo = item.memo || "";
                } else {
                    item = {
                        word: word,
                        date: now,
                        weblio: urls.weblio,
                        englishBattle: urls.englishBattle,
                        memo: ""
                    };
                }

                // 履歴の先頭に追加
                history.unshift(item);

                // 辞書リンクを結果欄に表示
                const row = document.createElement("div");
                row.className = "bulk-result-item";

                const wordLabel = document.createElement("div");
                wordLabel.className = "bulk-result-word";
                wordLabel.textContent = word;

                const links = document.createElement("div");
                links.className = "bulk-result-links";

                const weblio = document.createElement("a");
                weblio.href = urls.weblio;
                weblio.textContent = "Weblio";

                const englishBattle = document.createElement("a");
                englishBattle.href = urls.englishBattle;
                englishBattle.textContent = "EnglishBattle";

                links.append(weblio, englishBattle);
                row.append(wordLabel, links);
                bulkSearchResults.appendChild(row);
            });

            saveHistory();
            displayHistory();

            bulkSearchStatus.textContent =
                `${uniqueWords.length}語を検索履歴に登録しました。`;

        });


        // ========================================
        // 履歴内部のボタン
        // ========================================

        historyList.addEventListener(
            "click",
            function(event) {

                const target =
                    event.target;


                // ====================================
                // 削除
                // ====================================

                if (
                    target.classList.contains(
                        "delete-word"
                    )
                ) {

                    const index =
                        Number(
                            target.dataset.index
                        );


                    const word =
                        history[index].word;


                    const result =
                        confirm(
                            `"${word}" を削除しますか？`
                        );


                    if (!result) {
                        return;
                    }


                    history.splice(
                        index,
                        1
                    );


                    saveHistory();

                    displayHistory();

                    return;

                }


                // ====================================
                // Edit
                // ====================================

                if (
                    target.classList.contains(
                        "edit-memo"
                    )
                ) {

                    const index =
                        Number(
                            target.dataset.index
                        );


                    const item =
                        history[index];


                    const memoArea =
                        target.closest(
                            ".memo-area"
                        );


                    /*
                     * ここが今回の重要な修正部分。
                     *
                     * textareaの中に
                     * ${item.memo}
                     * を直接書かない。
                     *
                     * そうするとHTMLの改行・
                     * インデントまでメモに入る。
                     */

                    memoArea.innerHTML = `

                        <div class="memo-header">

                            <span class="memo-title">
                                Memo
                            </span>

                        </div>


                        <textarea
                            class="memo-editor"
                            placeholder="この単語についてメモを書く..."
                        ></textarea>


                        <div class="memo-buttons">

                            <button
                                type="button"
                                class="save-memo"
                                data-index="${index}"
                            >
                                Save
                            </button>

                            <button
                                type="button"
                                class="cancel-memo"
                                data-index="${index}"
                            >
                                Cancel
                            </button>

                        </div>

                    `;


                    // ====================================
                    // textareaへ値を直接セット
                    // ====================================

                    const textarea =
                        memoArea.querySelector(
                            ".memo-editor"
                        );


                    textarea.value =
                        item.memo;


                    // カーソルを先頭へ

                    textarea.focus();

                    textarea.setSelectionRange(
                        0,
                        0
                    );


                    return;

                }


                // ====================================
                // Save
                // ====================================

                if (
                    target.classList.contains(
                        "save-memo"
                    )
                ) {

                    const index =
                        Number(
                            target.dataset.index
                        );


                    const memoArea =
                        target.closest(
                            ".memo-area"
                        );


                    const textarea =
                        memoArea.querySelector(
                            ".memo-editor"
                        );


                    history[index].memo =
                        textarea.value;


                    saveHistory();

                    displayHistory();

                    return;

                }


                // ====================================
                // Cancel
                // ====================================

                if (
                    target.classList.contains(
                        "cancel-memo"
                    )
                ) {

                    displayHistory();

                    return;

                }

            }
        );


        // ========================================
        // 履歴全削除
        // ========================================

        clearHistoryButton.addEventListener(
            "click",
            function() {

                if (history.length === 0) {
                    return;
                }


                const result =
                    confirm(
                        "検索履歴をすべて削除しますか？"
                    );


                if (!result) {
                    return;
                }


                history = [];


                saveHistory();

                displayHistory();

            }
        );


        // ========================================
        // 初期表示
        // ========================================

        displayHistory();

    </script>

</body>
</html>
