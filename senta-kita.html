<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostics</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        background: #f4f4f4;
        color: #222;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Helvetica Neue",
            Arial,
            sans-serif;
        min-height: 100vh;
    }
    #app {
        width: min(720px, 90%);
        margin: 0 auto;
        padding: 70px 0;
    }
    .top {
        font-size: 13px;
        color: #777;
        letter-spacing: .08em;
        margin-bottom: 45px;
    }
    h1 {
        font-size: clamp(30px, 7vw, 54px);
        font-weight: 500;
        margin: 0 0 15px;
    }
    #message {
        color: #666;
        line-height: 1.8;
    }
    #progress {
        width: 100%;
        height: 3px;
        background: #ddd;
        margin: 45px 0 12px;
    }
    #bar {
        width: 0%;
        height: 100%;
        background: #222;
        transition: width .3s;
    }
    #percent {
        font-size: 12px;
        color: #888;
    }
    #result {
        display: none;
        margin-top: 50px;
    }
    .item {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        padding: 14px 0;
        border-bottom: 1px solid #ddd;
        font-size: 14px;
    }
    .label {
        color: #888;
    }
    .value {
        text-align: right;
        word-break: break-all;
        max-width: 65%;
    }
    #notice {
        display: none;
        margin-top: 40px;
        padding: 20px;
        background: #fff;
        border: 1px solid #ccc;
        line-height: 1.8;
    }
    #countdown {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    #countdown strong {
        font-size: clamp(60px, 18vw, 150px);
        font-weight: 400;
    }
    #countdown span {
        color: #777;
        margin-top: 15px;
        font-size: 13px;
    }
    #prank {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
    }
    #prank h2 {
        font-size: clamp(35px, 10vw, 80px);
        font-weight: 400;
        margin: 0;
    }
    #prank p {
        color: #777;
        margin-top: 20px;
    }
</style>
</head>
<body>
<div id="app">
    <div class="top">
        BROWSER / DIAGNOSTICS
    </div>
    <h1>環境を確認しています。</h1>
    <div id="message">
        このページを表示している環境を確認しています。
    </div>
    <div id="progress">
        <div id="bar"></div>
    </div>
    <div id="percent">0%</div>
    <div id="result">
        <div class="item">
            <span class="label">端末</span>
            <span class="value" id="device"></span>
        </div>
        <div class="item">
            <span class="label">画面</span>
            <span class="value" id="screen"></span>
        </div>
        <div class="item">
            <span class="label">言語</span>
            <span class="value" id="language"></span>
        </div>
        <div class="item">
            <span class="label">タイムゾーン</span>
            <span class="value" id="timezone"></span>
        </div>
        <div class="item">
            <span class="label">CPU</span>
            <span class="value" id="cpu"></span>
        </div>
        <div class="item">
            <span class="label">タッチ入力</span>
            <span class="value" id="touch"></span>
        </div>
        <div class="item">
            <span class="label">ブラウザ識別情報</span>
            <span class="value" id="ua"></span>
        </div>
        <div id="notice">
            この環境では、いくつかの情報を取得できます。<br>
            解析を終了しています……
        </div>
    </div>
</div>
<div id="countdown">
    <strong id="number">3</strong>
    <span>
        解析結果を確認しています
    </span>
</div>
<div id="prank">
    <h2>……。</h2>
    <p>びっくりしました？</p>
</div>
<script>
const $ = id => document.getElementById(id);
const ua = navigator.userAgent;
/* -------------------------
   端末をそれっぽく判定
------------------------- */
function detectDevice() {
    if (/iPhone/.test(ua))
        return "iPhone";
    if (/iPad/.test(ua))
        return "iPad";
    if (/Macintosh/.test(ua))
        return "Mac";
    if (/Android/.test(ua))
        return "Android";
    if (/Windows/.test(ua))
        return "Windows";
    if (/Linux/.test(ua))
        return "Linux";
    return "Unknown";
}
/* -------------------------
   情報をセット
------------------------- */
$("device").textContent =
    detectDevice();
$("screen").textContent =
    `${screen.width} × ${screen.height}`;
$("language").textContent =
    navigator.language;
$("timezone").textContent =
    Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone;
$("cpu").textContent =
    navigator.hardwareConcurrency
        ? `${navigator.hardwareConcurrency} cores`
        : "unknown";
$("touch").textContent =
    navigator.maxTouchPoints > 0
        ? "対応"
        : "非対応";
$("ua").textContent =
    ua;
/* -------------------------
   解析演出
------------------------- */
const messages = [
    "環境を確認しています。",
    "ブラウザを確認しています。",
    "端末情報を確認しています。",
    "表示環境を確認しています。",
    "解析結果を整理しています。"
];
let i = 0;
const timer = setInterval(() => {
    i++;
    const percent =
        Math.min(
            100,
            Math.round(
                i / messages.length * 100
            )
        );
    $("bar").style.width =
        percent + "%";
    $("percent").textContent =
        percent + "%";
    if (messages[i]) {
        $("message").textContent =
            messages[i];
    }
    if (i >= messages.length) {
        clearInterval(timer);
        setTimeout(startCountdown, 1000);
    }
}, 900);
/* -------------------------
   カウントダウン
------------------------- */
function startCountdown() {
    $("app").style.display = "none";
    $("countdown").style.display =
        "flex";
    let n = 3;
    $("number").textContent = n;
    const timer =
        setInterval(() => {
            n--;
            $("number").textContent =
                n;
            if (n <= 0) {
                clearInterval(timer);
                setTimeout(showPrank, 500);
            }
        }, 900);
}
/* -------------------------
   ネタばらし
------------------------- 
function showPrank() {
    $("countdown").style.display =
        "none";
    $("prank").style.display =
        "flex";
}*/
</script>
</body>
</html>
