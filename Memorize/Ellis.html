<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Problem Repeater</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    max-width: 700px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
}

/* =========================
   共通
========================= */

header {
    height: 60px;
    padding: 0 16px;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

.screen {
    padding: 20px;
}

.hidden {
    display: none !important;
}

.primary-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
}

.secondary-button {
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
}

.danger-button {
    padding: 10px 14px;
    border: 1px solid #e55;
    border-radius: 8px;
    background: white;
    color: #d33;
}

/* =========================
   問題セット一覧
========================= */

.set-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.set-header h2 {
    margin: 0;
    font-size: 18px;
}

#setList {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.set-item {
    display: flex;
    align-items: center;
    gap: 6px;

    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.set-select {
    flex: 1;
    min-width: 0;

    border: none;
    background: transparent;
    text-align: left;
    padding: 6px;
}

.set-select.selected {
    font-weight: bold;
}

.set-name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.set-count {
    display: block;
    margin-top: 3px;
    color: #777;
    font-size: 12px;
}

.set-action {
    flex-shrink: 0;
    padding: 7px 9px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
}

/* =========================
   選択中セット
========================= */

#selectedPanel {
    margin-top: 24px;
    padding: 16px;
    border-radius: 10px;
    background: #f5f5f5;
}

#selectedSetName {
    margin: 0 0 14px;
    font-size: 17px;
}

.range-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.range-row input {
    width: 90px;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

#startButton {
    margin-top: 16px;
}

/* =========================
   編集画面
========================= */

#editScreen h2 {
    margin-top: 0;
}

.form-label {
    display: block;
    margin: 18px 0 7px;
    font-weight: bold;
}

#editName {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#problemInput {
    width: 100%;
    min-height: 300px;
    resize: vertical;

    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;

    line-height: 1.6;
}

.format-help {
    margin-top: 8px;
    color: #777;
    font-size: 13px;
}

.edit-buttons {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}

.edit-buttons button {
    flex: 1;
}

/* =========================
   問題画面
========================= */

#quizScreen {
    min-height: calc(100vh - 60px);
    padding: 20px;

    display: flex;
    flex-direction: column;
}

.quiz-top {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 13px;
}

#question {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 10px;

    text-align: center;
    font-size: 28px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.answer-buttons {
    display: flex;
    gap: 10px;
}

.answer-buttons button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 10px;
}

#knowButton {
    background: #222;
    color: white;
}

#unknownButton {
    background: #eee;
    color: #222;
}

/* =========================
   答え画面
========================= */

#answerScreen {
    min-height: calc(100vh - 60px);

    display: flex;
    flex-direction: column;

    padding: 20px;

    cursor: pointer;
}

.answer-label {
    color: #777;
    font-size: 13px;
}

#answer {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 10px;

    text-align: center;
    font-size: 26px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.answer-next {
    text-align: center;
    color: #888;
    font-size: 13px;
}

/* =========================
   完了画面
========================= */

#completeScreen {
    text-align: center;
    padding-top: 60px;
}

#completeScreen h2 {
    margin-bottom: 10px;
}

#completeScreen p {
    color: #666;
    margin-bottom: 30px;
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================
         ヘッダー
    ====================== -->

    <header>
        <h1>Problem Repeater</h1>

        <button
            id="editButton"
            class="secondary-button"
        >
            編集
        </button>
    </header>


    <!-- =====================
         メイン画面
    ====================== -->

    <main id="mainScreen" class="screen">

        <div class="set-header">
            <h2>問題セット</h2>

            <button
                id="newSetButton"
                class="secondary-button"
            >
                ＋ 新規
            </button>
        </div>

        <div id="setList"></div>


        <section
            id="selectedPanel"
            class="hidden"
        >
            <h2 id="selectedSetName"></h2>

            <div>
                <label>
                    範囲
                </label>

                <div class="range-row">
                    <input
                        id="rangeStart"
                        type="number"
                        min="1"
                        value="1"
                    >

                    <span>～</span>

                    <input
                        id="rangeEnd"
                        type="number"
                        min="1"
                        value="1"
                    >
                </div>
            </div>

            <button
                id="startButton"
                class="primary-button"
            >
                問題を開始
            </button>
        </section>

    </main>


    <!-- =====================
         編集画面
    ====================== -->

    <section
        id="editScreen"
        class="screen hidden"
    >

        <h2 id="editTitle">問題セットを編集</h2>

        <label class="form-label">
            セット名
        </label>

        <input
            id="editName"
            type="text"
            placeholder="例：英単語"
        >


        <label class="form-label">
            問題と答え
        </label>

        <textarea
            id="problemInput"
            placeholder="apple / りんご
obtain / 得る
velocity / 速度"
        ></textarea>

        <div class="format-help">
            1行につき1問。<br>
            「問題 / 答え」の形式で入力してください。
        </div>


        <div class="edit-buttons">

            <button
                id="cancelEditButton"
                class="secondary-button"
            >
                キャンセル
            </button>

            <button
                id="saveEditButton"
                class="primary-button"
            >
                保存
            </button>

        </div>

    </section>


    <!-- =====================
         問題画面
    ====================== -->

    <section
        id="quizScreen"
        class="hidden"
    >

        <div class="quiz-top">
            <span id="quizSetName"></span>
            <span id="progress"></span>
        </div>

        <div id="question"></div>

        <div class="answer-buttons">

            <button id="unknownButton">
                わからない
            </button>

            <button id="knowButton">
                わかる
            </button>

        </div>

    </section>


    <!-- =====================
         答え画面
    ====================== -->

    <section
        id="answerScreen"
        class="hidden"
    >

        <div class="answer-label">
            答え
        </div>

        <div id="answer"></div>

        <div class="answer-next">
            どこでもタップして次へ
        </div>

    </section>


    <!-- =====================
         完了画面
    ====================== -->

    <section
        id="completeScreen"
        class="screen hidden"
    >

        <h2>完了</h2>

        <p>
            この範囲の問題をすべて「わかる」にしました。
        </p>

        <button
            id="backButton"
            class="primary-button"
        >
            問題セットへ戻る
        </button>

    </section>

</div>
<footer><a href="../senta-kita.html">センター北</a></footer>

<script>
"use strict";


/* ==================================================
   保存設定
================================================== */

const STORAGE_KEY = "problem-repeater-sets-v1";
const SELECTED_SET_KEY = "problem-repeater-selected-set-v1";


/* ==================================================
   DOM
================================================== */

const mainScreen = document.getElementById("mainScreen");
const editScreen = document.getElementById("editScreen");
const quizScreen = document.getElementById("quizScreen");
const answerScreen = document.getElementById("answerScreen");
const completeScreen = document.getElementById("completeScreen");

const editButton = document.getElementById("editButton");
const newSetButton = document.getElementById("newSetButton");

const setList = document.getElementById("setList");

const selectedPanel = document.getElementById("selectedPanel");
const selectedSetNameElement =
    document.getElementById("selectedSetName");

const rangeStart = document.getElementById("rangeStart");
const rangeEnd = document.getElementById("rangeEnd");

const startButton = document.getElementById("startButton");

const editTitle = document.getElementById("editTitle");
const editName = document.getElementById("editName");
const problemInput = document.getElementById("problemInput");

const cancelEditButton =
    document.getElementById("cancelEditButton");

const saveEditButton =
    document.getElementById("saveEditButton");

const quizSetName =
    document.getElementById("quizSetName");

const progress =
    document.getElementById("progress");

const question =
    document.getElementById("question");

const answer =
    document.getElementById("answer");

const knowButton =
    document.getElementById("knowButton");

const unknownButton =
    document.getElementById("unknownButton");

const backButton =
    document.getElementById("backButton");


/* ==================================================
   アプリの状態
================================================== */

/*
    問題セット

    {
        "英単語": [
            {
                question: "apple",
                answer: "りんご"
            }
        ],

        "物理": [
            {
                question: "F = ma",
                answer: "運動方程式"
            }
        ]
    }
*/

let problemSets = {};

let selectedSetName = null;


/* 編集中のセット名 */
let editingSetName = null;


/* ==================================================
   クイズの状態
================================================== */

/*
    quizProblems は今回の学習だけに使うコピー。

    元の problemSets は変更しない。
*/

let quizProblems = [];

let quizIndex = 0;

let quizRangeStart = 1;
let quizRangeEnd = 1;


/* ==================================================
   初期化
================================================== */

loadData();

renderSetList();

if (selectedSetName) {
    selectSet(selectedSetName);
}


/* ==================================================
   localStorage
================================================== */

function loadData() {

    const savedData =
        localStorage.getItem(STORAGE_KEY);

    if (savedData) {

        try {

            const parsed =
                JSON.parse(savedData);

            if (
                parsed &&
                typeof parsed === "object" &&
                !Array.isArray(parsed)
            ) {
                problemSets = parsed;
            }

        } catch (error) {

            console.error(
                "問題セットの読み込みに失敗しました。",
                error
            );

            problemSets = {};
        }
    }


    const savedSelected =
        localStorage.getItem(SELECTED_SET_KEY);

    if (
        savedSelected &&
        problemSets[savedSelected]
    ) {
        selectedSetName = savedSelected;
    }
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(problemSets)
    );

    if (selectedSetName) {

        localStorage.setItem(
            SELECTED_SET_KEY,
            selectedSetName
        );

    } else {

        localStorage.removeItem(
            SELECTED_SET_KEY
        );
    }
}


/* ==================================================
   画面切り替え
================================================== */

function showScreen(screen) {

    mainScreen.classList.add("hidden");
    editScreen.classList.add("hidden");
    quizScreen.classList.add("hidden");
    answerScreen.classList.add("hidden");
    completeScreen.classList.add("hidden");

    screen.classList.remove("hidden");
}


/* ==================================================
   問題セット一覧
================================================== */

function renderSetList() {

    setList.innerHTML = "";

    const names =
        Object.keys(problemSets);


    if (names.length === 0) {

        const emptyMessage =
            document.createElement("p");

        emptyMessage.textContent =
            "問題セットがありません。";

        emptyMessage.style.color = "#777";

        setList.appendChild(emptyMessage);

        selectedPanel.classList.add("hidden");

        return;
    }


    for (const name of names) {

        const item =
            document.createElement("div");

        item.className = "set-item";


        /* 選択ボタン */

        const select =
            document.createElement("button");

        select.className = "set-select";

        if (name === selectedSetName) {
            select.classList.add("selected");
        }


        const nameElement =
            document.createElement("span");

        nameElement.className = "set-name";
        nameElement.textContent = name;


        const countElement =
            document.createElement("span");

        countElement.className = "set-count";

        countElement.textContent =
            `${problemSets[name].length}問`;


        select.appendChild(nameElement);
        select.appendChild(countElement);


        select.addEventListener(
            "click",
            () => {
                selectSet(name);
            }
        );


        /* 編集ボタン */

        const edit =
            document.createElement("button");

        edit.className = "set-action";
        edit.textContent = "編集";

        edit.addEventListener(
            "click",
            () => {
                openEditor(name);
            }
        );


        /* 削除ボタン */

        const remove =
            document.createElement("button");

        remove.className = "set-action";
        remove.textContent = "削除";

        remove.addEventListener(
            "click",
            () => {
                deleteSet(name);
            }
        );


        item.appendChild(select);
        item.appendChild(edit);
        item.appendChild(remove);

        setList.appendChild(item);
    }


    updateSelectedPanel();
}


/* ==================================================
   問題セット選択
================================================== */

function selectSet(name) {

    if (!problemSets[name]) {
        return;
    }

    selectedSetName = name;

    saveData();

    updateSelectedPanel();
    renderSetList();
}


function updateSelectedPanel() {

    if (
        !selectedSetName ||
        !problemSets[selectedSetName]
    ) {

        selectedPanel.classList.add("hidden");

        return;
    }


    selectedPanel.classList.remove("hidden");

    selectedSetNameElement.textContent =
        selectedSetName;


    const count =
        problemSets[selectedSetName].length;


    rangeStart.max = count;
    rangeEnd.max = count;

    rangeStart.value = 1;
    rangeEnd.value = count;
}


/* ==================================================
   編集画面
================================================== */

function openEditor(name = null) {

    editingSetName = name;


    if (name === null) {

        editTitle.textContent =
            "新しい問題セット";

        editName.value = "";
        problemInput.value = "";

    } else {

        editTitle.textContent =
            "問題セットを編集";

        editName.value = name;


        const problems =
            problemSets[name];

        problemInput.value =
            problems
                .map(
                    item =>
                        `${item.question} / ${item.answer}`
                )
                .join("\n");
    }


    showScreen(editScreen);

    editName.focus();
}


/* ==================================================
   問題データ解析
================================================== */

function parseProblems(text) {

    const lines =
        text.split(/\r?\n/);

    const problems = [];


    for (const line of lines) {

        const trimmed =
            line.trim();


        /* 空行は無視 */

        if (!trimmed) {
            continue;
        }


        /*
            最初の / だけを区切りとして使う。

            例：
            A / B / C

            問題 = A
            答え = B / C
        */

        const separatorIndex =
            trimmed.indexOf("/");


        if (separatorIndex === -1) {
            continue;
        }


        const questionText =
            trimmed
                .slice(0, separatorIndex)
                .trim();

        const answerText =
            trimmed
                .slice(separatorIndex + 1)
                .trim();


        if (
            !questionText ||
            !answerText
        ) {
            continue;
        }


        problems.push({
            question: questionText,
            answer: answerText
        });
    }


    return problems;
}


/* ==================================================
   編集内容を保存
================================================== */

function saveEditor() {

    const name =
        editName.value.trim();

    const problems =
        parseProblems(problemInput.value);


    if (!name) {

        alert("セット名を入力してください。");

        return;
    }


    if (problems.length === 0) {

        alert(
            "問題がありません。\n" +
            "「問題 / 答え」の形式で入力してください。"
        );

        return;
    }


    /*
        名前変更時に、
        別の既存セットと名前が被るのを防ぐ。
    */

    if (
        name !== editingSetName &&
        problemSets[name]
    ) {

        alert(
            "その名前の問題セットは既に存在します。"
        );

        return;
    }


    /*
        名前を変更した場合、
        古い名前を削除。
    */

    if (
        editingSetName !== null &&
        editingSetName !== name
    ) {

        delete problemSets[editingSetName];
    }


    problemSets[name] = problems;

    selectedSetName = name;

    saveData();

    renderSetList();
    selectSet(name);

    showScreen(mainScreen);
}


/* ==================================================
   問題セット削除
================================================== */

function deleteSet(name) {

    const count =
        problemSets[name].length;


    const confirmed =
        confirm(
            `「${name}」を削除しますか？\n\n` +
            `${count}問の問題が削除されます。`
        );


    if (!confirmed) {
        return;
    }


    delete problemSets[name];


    if (selectedSetName === name) {

        const remaining =
            Object.keys(problemSets);

        selectedSetName =
            remaining.length > 0
                ? remaining[0]
                : null;
    }


    saveData();

    renderSetList();

    if (selectedSetName) {
        selectSet(selectedSetName);
    }
}


/* ==================================================
   クイズ開始
================================================== */

function startQuiz() {

    if (
        !selectedSetName ||
        !problemSets[selectedSetName]
    ) {
        return;
    }


    const total =
        problemSets[selectedSetName].length;


    let start =
        Number(rangeStart.value);

    let end =
        Number(rangeEnd.value);


    if (
        !Number.isInteger(start) ||
        !Number.isInteger(end)
    ) {

        alert("範囲を正しく入力してください。");

        return;
    }


    if (
        start < 1 ||
        end < 1 ||
        start > total ||
        end > total ||
        start > end
    ) {

        alert("範囲が正しくありません。");

        return;
    }


    quizRangeStart = start;
    quizRangeEnd = end;


    /*
        元データを直接変更しないため、
        slice + map でコピーする。
    */

    quizProblems =
        problemSets[selectedSetName]
            .slice(start - 1, end)
            .map(item => ({
                question: item.question,
                answer: item.answer
            }));


    shuffle(quizProblems);

    quizIndex = 0;


    quizSetName.textContent =
        selectedSetName;


    showQuestion();
}


/* ==================================================
   問題表示
================================================== */

function showQuestion() {

    /*
        問題が全部「わかる」なら終了。
    */

    if (quizProblems.length === 0) {

        showScreen(completeScreen);

        return;
    }


    /*
        「わからない」問題を一周した場合。

        残っている問題を再シャッフルして
        もう一周する。
    */

    if (quizIndex >= quizProblems.length) {

        quizIndex = 0;

        shuffle(quizProblems);
    }


    const current =
        quizProblems[quizIndex];


    question.textContent =
        current.question;


    progress.textContent =
        `${quizIndex + 1} / ${quizProblems.length}`;


    showScreen(quizScreen);
}


/* ==================================================
   わかる
================================================== */

function markKnown() {

    const current =
        quizProblems[quizIndex];


    if (!current) {
        return;
    }


    /*
        現在の問題を削除。

        indexは進めない。

        例えば

        A B C

        Bをわかる
        ↓

        A C

        indexが1なら
        そのままCを指せる。
    */

    quizProblems.splice(quizIndex, 1);


    showAnswer(current.answer);
}


/* ==================================================
   わからない
================================================== */

function markUnknown() {

    const current =
        quizProblems[quizIndex];


    if (!current) {
        return;
    }


    /*
        問題は削除しない。

        次の問題へ進む。
    */

    quizIndex++;

    showAnswer(current.answer);
}


/* ==================================================
   答え表示
================================================== */

function showAnswer(answerText) {

    answer.textContent =
        answerText;

    showScreen(answerScreen);
}


/* ==================================================
   答え画面 → 次
================================================== */

function nextQuestion() {

    showQuestion();
}


/* ==================================================
   シャッフル
================================================== */

function shuffle(array) {

    /*
        Fisher-Yates shuffle
    */

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }
}


/* ==================================================
   イベント
================================================== */


/* 新規作成 */

newSetButton.addEventListener(
    "click",
    () => {
        openEditor();
    }
);


/* ヘッダーの編集 */

editButton.addEventListener(
    "click",
    () => {

        if (!selectedSetName) {

            alert(
                "編集する問題セットがありません。"
            );

            return;
        }

        openEditor(selectedSetName);
    }
);


/* 編集キャンセル */

cancelEditButton.addEventListener(
    "click",
    () => {

        showScreen(mainScreen);
    }
);


/* 保存 */

saveEditButton.addEventListener(
    "click",
    saveEditor
);


/* 問題開始 */

startButton.addEventListener(
    "click",
    startQuiz
);


/* わかる */

knowButton.addEventListener(
    "click",
    markKnown
