<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Problem Repeater</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<main class="container">

    <h1>Problem Repeater</h1>


    <!-- =========================
         問題セット
    ========================== -->

    <section class="panel">

        <div class="section-header">
            <h2>問題セット</h2>

            <button
                id="newSetButton"
                type="button"
            >
                ＋ 新規
            </button>
        </div>

        <div id="setList" class="set-list"></div>

    </section>


    <!-- =========================
         選択中のセット
    ========================== -->

    <section
        id="selectedPanel"
        class="panel hidden"
    >

        <h2 id="selectedSetName"></h2>

        <div class="range">

            <input
                id="rangeStart"
                type="number"
                min="1"
                value="1"
            >

            <span>〜</span>

            <input
                id="rangeEnd"
                type="number"
                min="1"
                value="1"
            >

            <button
                id="startButton"
                type="button"
            >
                問題を開始
            </button>

        </div>

    </section>


    <!-- =========================
         暗記度
    ========================== -->

    <section
        id="masteryPanel"
        class="panel hidden"
    >

        <h2>暗記度</h2>

        <div class="average">
            平均暗記度：
            <strong id="averageMastery">0%</strong>
        </div>

        <div
            id="masteryList"
            class="mastery-list"
        ></div>

    </section>


    <!-- =========================
         編集画面
    ========================== -->

    <section
        id="editScreen"
        class="panel hidden"
    >

        <h2 id="editTitle">
            問題セットを編集
        </h2>


        <label
            class="form-label"
            for="editName"
        >
            セット名
        </label>

        <input
            id="editName"
            type="text"
            placeholder="例：英単語"
        >


        <label
            class="form-label"
            for="problemInput"
        >
            問題と答え
        </label>

        <textarea
            id="problemInput"
            placeholder="apple / りんご
obtain / 得る
velocity / 速度"
        ></textarea>

        <p class="format-help">
            1行につき1問。<br>
            「問題 / 答え」の形式で入力してください。
        </p>


        <div class="buttons">

            <button
                id="cancelEditButton"
                type="button"
            >
                キャンセル
            </button>

            <button
                id="saveEditButton"
                type="button"
            >
                保存
            </button>

        </div>

    </section>


    <!-- =========================
         クイズ画面
    ========================== -->

    <section
        id="quizScreen"
        class="panel quiz hidden"
    >

        <div class="quiz-info">

            <span id="quizSetName"></span>

            <span id="progress"></span>

        </div>


        <div
            id="questionLabel"
            class="question-label"
        >
            問題
        </div>


        <div
            id="question"
            class="question"
        >
            ---
        </div>


        <div class="answer-buttons">

            <button
                id="unknownButton"
                type="button"
            >
                わからない
            </button>

            <button
                id="knowButton"
                type="button"
            >
                わかる
            </button>

        </div>


        <p class="hint">
            ←：わからない　→：わかる
        </p>

    </section>


    <!-- =========================
         答え画面
    ========================== -->

    <section
        id="answerScreen"
        class="panel answer-screen hidden"
    >

        <div class="question-label">
            答え
        </div>


        <div
            id="answer"
            class="answer"
        ></div>


        <p class="hint">
            Space またはどこでもタップして次へ
        </p>

    </section>


    <!-- =========================
         完了画面
    ========================== -->

    <section
        id="completeScreen"
        class="panel complete hidden"
    >

        <h2>完了</h2>

        <p>
            この範囲の問題をすべて
            「わかる」にしました。
        </p>

        <button
            id="backButton"
            type="button"
        >
            問題セットへ戻る
        </button>

    </section>


    <!-- =========================
         リセット
    ========================== -->

    <section
        id="resetPanel"
        class="panel hidden"
    >

        <h2>リセット</h2>

        <div class="buttons">

            <button
                id="resetMasteryButton"
                type="button"
            >
                このセットの暗記度をリセット
            </button>

            <button
                id="resetAllButton"
                type="button"
            >
                すべてリセット
            </button>

        </div>

    </section>

</main>


<script src="./app.js"></script>

</body>
</html>
