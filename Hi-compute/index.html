<!DOCTYPE HTML>
    <html lang="ja">
        <head>
            <meta charset="UTF-8">
            <title>hi precision calculation</title>
            <style>
                canvas{
                    display:block;
                    width: 100vw;
                    height:100vh;
                    cursor: grab;
                    touch-action: none;
                }
            </style>
        </head>
        <body>
            <p>x:</p><input type="number" id="coordinatex" value="100">
            <p>y:</p><input type="number" id="coordinatey" value="100">
            <p></p><p id="result">計算結果</p>
            <canvas id="canvas"></canvas>
            <div id="info"></div>
        <script >
            const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl2");

const xInput = document.querySelector("#coordinatex");
const yInput = document.querySelector("#coordinatey");
const result = document.getElementById("result");

function calculate() {
    const x = Number(xInput.value);
    const y = Number(yInput.value);

    result.innerHTML = x * y;
}

xInput.addEventListener("input", calculate);
yInput.addEventListener("input", calculate);

calculate();
        </script>
        </body>
    </html>
