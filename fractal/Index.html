<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;

    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}


/* =========================
   Information
========================= */

#info {

    position: fixed;

    top: 14px;
    left: 14px;

    color:
        rgba(255,255,255,.75);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;

    line-height: 1.6;

    pointer-events: none;

    user-select: none;

    text-shadow:
        0 1px 4px #000;
}


/* =========================
   Progress
========================= */

#progressContainer {

    position: fixed;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    width: min(
        320px,
        calc(100vw - 40px)
    );

    height: 3px;

    background:
        rgba(255,255,255,.12);

    border-radius: 3px;

    overflow: hidden;

    opacity: 0;

    transition:
        opacity .2s;
}

#progress {

    width: 0%;

    height: 100%;

    background:
        rgba(255,255,255,.8);

    transition:
        width .05s linear;
}


/* =========================
   Settings
========================= */

#settings {

    position: fixed;

    left: 14px;
    bottom: 14px;

    display: flex;

    align-items: center;

    gap: 6px;

    color:
        rgba(255,255,255,.75);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;
}

#iterationsInput {

    width: 70px;

    padding: 6px 7px;

    color: white;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 6px;

    outline: none;

    font-size: 12px;
}

#iterationsInput:focus {

    border-color:
        rgba(255,255,255,.45);
}


/* =========================
   Reset
========================= */

#reset {

    position: fixed;

    right: 14px;
    bottom: 14px;

    padding:
        8px 12px;

    color:
        rgba(255,255,255,.75);

    background:
        rgba(0,0,0,.35);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 7px;

    font-size: 12px;

    cursor: pointer;
}

#reset:active {

    background:
        rgba(255,255,255,.15);
}

</style>

</head>


<body>

<canvas id="canvas"></canvas>


<div id="info">

    <div>
        Zoom
        <span id="zoom">1×</span>
    </div>

    <div>
        Iterations
        <span id="iterations">500</span>
    </div>

</div>


<div id="settings">

    <span>Max</span>

    <input
        id="iterationsInput"
        type="number"
        value="500"
        min="1"
        max="100000"
        step="1"
    >

</div>


<div id="progressContainer">

    <div id="progress"></div>

</div>


<button id="reset">
    Reset
</button>


<script>


/* =========================================================
   Canvas
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let width;
let height;


/* =========================================================
   UI
========================================================= */

const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterations");

const iterationsInput =
    document.getElementById(
        "iterationsInput"
    );

const progressContainer =
    document.getElementById(
        "progressContainer"
    );

const progressBar =
    document.getElementById(
        "progress"
    );


/* =========================================================
   Mandelbrot state
========================================================= */

let centerX = -0.75;
let centerY = 0;

let zoom = 1;


/*
    ユーザー指定値
*/

let maxIterations = 500;


/* =========================================================
   Rendering control
========================================================= */


/*
    描画世代。

    新しい描画が始まったら番号を変える。

    古い描画は途中で停止する。
*/

let renderVersion = 0;


/*
    高画質化を開始するタイマー
*/

let qualityTimer = null;


/* =========================================================
   Quality levels
========================================================= */


/*
    移動中

    step = 4
    iterations = 25%
*/

const MOVING_STEP = 4;

const MOVING_ITERATION_RATE = 0.25;


/*
    クッション

    操作停止直後に一度、

        step = 2
        iterations = 50%

    を描画する。

    これが「クッション」。
*/

const MEDIUM_STEP = 2;

const MEDIUM_ITERATION_RATE = 0.50;


/*
    最終状態

        step = 1
        iterations = Max
*/


/* =========================================================
   Iterations
========================================================= */

function getIterations(rate = 1) {

    return Math.max(
        1,
        Math.floor(
            maxIterations * rate
        )
    );
}


/* =========================================================
   Progress
========================================================= */

function showProgress(value) {

    progressContainer.style.opacity = 1;

    progressBar.style.width =
        Math.min(
            100,
            Math.max(0, value)
        ) + "%";
}


function hideProgress() {

    progressContainer.style.opacity = 0;

    progressBar.style.width = "0%";
}


/* =========================================================
   Draw
========================================================= */


/*
    draw()

    step:
        1 = 全ピクセル
        2 = 2×2
        4 = 4×4

    iterationRate:
        1    = Max
        0.5  = Maxの50%
        0.25 = Maxの25%
*/

function draw(
    step = 1,
    iterationRate = 1,
    progressive = false
) {

    const version =
        ++renderVersion;


    const iterations =
        getIterations(
            iterationRate
        );


    const image =
        ctx.createImageData(
            width,
            height
        );

    const data =
        image.data;


    /*
        複素平面の範囲
    */

    const scale =
        4 / zoom;

    const aspect =
        width / height;

    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    const minX =
        centerX -
        rangeX / 2;

    const minY =
        centerY -
        rangeY / 2;


    /*
        総行数

        step=4なら
        height / 4 行
    */

    const totalRows =
        Math.ceil(
            height / step
        );


    let completedRows = 0;


    /*
        行ごとに計算する。

        これによって途中結果を
        画面に表示できる。
    */

    for (
        let py = 0;
        py < height;
        py += step
    ) {

        /*
            新しい操作が来たら
            即座に中止。
        */

        if (
            version !== renderVersion
        ) {

            return false;
        }


        const cy =
            minY +
            py / height *
            rangeY;


        for (
            let px = 0;
            px < width;
            px += step
        ) {

            const cx =
                minX +
                px / width *
                rangeX;


            let x = 0;
            let y = 0;

            let iteration = 0;


            while (
                x * x +
                y * y <= 4 &&
                iteration < iterations
            ) {

                const xx =
                    x * x -
                    y * y +
                    cx;


                y =
                    2 * x * y +
                    cy;


                x = xx;

                iteration++;
            }


            /*
                色
            */

            let r = 0;
            let g = 0;
            let b = 0;


            if (
                iteration <
                iterations
            ) {

                /*
                    Smooth coloring
                */

                const logZn =
                    Math.log(
                        Math.log(
                            x * x +
                            y * y
                        )
                    ) / Math.log(2);


                const smooth =
                    iteration +
                    1 -
                    logZn;


                const t =
                    smooth /
                    iterations;


                const v =
                    Math.floor(
                        255 *
                        Math.pow(
                            Math.max(
                                0,
                                t
                            ),
                            0.35
                        )
                    );


                r = v;
                g = v;
                b = v;
            }


            /*
                ブロックを塗る
            */

            for (
                let yy = 0;
                yy < step &&
                py + yy < height;
                yy++
            ) {

                for (
                    let xx = 0;
                    xx < step &&
                    px + xx < width;
                    xx++
                ) {

                    const index =
                        (
                            (py + yy) *
                            width +
                            (px + xx)
                        ) * 4;


                    data[index] =
                        r;

                    data[index + 1] =
                        g;

                    data[index + 2] =
                        b;

                    data[index + 3] =
                        255;
                }
            }
        }


        completedRows++;


        /*
            progressive = true の場合、

            1行終わるたびに
            途中結果を表示。

            ただし毎行 putImageData()
            すると重いので、
            8行ごとに更新する。
        */

        if (
            progressive &&
            (
                completedRows % 8 === 0 ||
                completedRows === totalRows
            )
        ) {

            ctx.putImageData(
                image,
                0,
                0
            );


            showProgress(
                completedRows /
                totalRows *
                100
            );
        }
    }


    /*
        最終結果
    */

    if (
        version !== renderVersion
    ) {

        return false;
    }


    ctx.putImageData(
        image,
        0,
        0
    );


    if (progressive) {

        showProgress(100);

        /*
            少しだけ100%を見せる
        */

        setTimeout(() => {

            if (
                version === renderVersion
            ) {

                hideProgress();
            }

        }, 150);
    }


    updateInfo();

    return true;
}


/* =========================================================
   Progressive high quality rendering
========================================================= */


/*
    ここが今回の重要部分。

    操作停止
        ↓
    中画質
        ↓
    高画質
*/


function scheduleHighQuality() {

    clearTimeout(
        qualityTimer
    );


    qualityTimer =
        setTimeout(() => {


            /*
                --------------------------------
                STEP 1
                クッション
                --------------------------------

                まず

                    50% iterations
                    step = 2

                を出す。
            */

            const mediumVersion =
                renderVersion;


            draw(
                MEDIUM_STEP,
                MEDIUM_ITERATION_RATE,
                true
            );


            /*
                --------------------------------
                STEP 2
                高画質
                --------------------------------
            */

            if (
                mediumVersion ===
                renderVersion
            ) {

                /*
                    少しだけ間を置く。

                    中間画像を見せる
                    「クッション」。
                */

                setTimeout(() => {

                    if (
                        mediumVersion !==
                        renderVersion
                    ) {
                        return;
                    }


                    draw(
                        1,
                        1,
                        true
                    );

                }, 80);
            }

        }, 100);
}


/* =========================================================
   Zoom
========================================================= */

function zoomAt(
    screenX,
    screenY,
    factor
) {

    const scale =
        4 / zoom;

    const aspect =
        width / height;


    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    /*
        ズーム前の複素座標
    */

    const worldX =
        centerX +
        (
            screenX / width -
            0.5
        ) * rangeX;


    const worldY =
        centerY +
        (
            screenY / height -
            0.5
        ) * rangeY;


    zoom *= factor;


    /*
        ズーム後
    */

    const newScale =
        4 / zoom;

    const newRangeX =
        newScale;

    const newRangeY =
        newScale / aspect;


    centerX =
        worldX -
        (
            screenX / width -
            0.5
        ) * newRangeX;


    centerY =
        worldY -
        (
            screenY / height -
            0.5
        ) * newRangeY;


    /*
        古い高画質化をキャンセル
    */

    clearTimeout(
        qualityTimer
    );


    /*
        まず移動中品質
    */

    draw(
        MOVING_STEP,
        MOVING_ITERATION_RATE,
        false
    );


    /*
        停止後に高画質化
    */

    scheduleHighQuality();
}


/* =========================================================
   Mouse
========================================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastX =
            e.clientX;

        lastY =
            e.clientY;


        clearTimeout(
            qualityTimer
        );


        hideProgress();
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging) {
            return;
        }


        dragging = false;


        scheduleHighQuality();
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if (!dragging) {
            return;
        }


        const dx =
            e.clientX -
            lastX;

        const dy =
            e.clientY -
            lastY;


        const scale =
            4 / zoom;

        const aspect =
            width / height;


        centerX -=
            dx /
            width *
            scale;


        centerY -=
            dy /
            height *
            scale /
            aspect;


        lastX =
            e.clientX;

        lastY =
            e.clientY;


        /*
            移動中

            ・粗い描画
            ・低反復
        */

        draw(
            MOVING_STEP,
            MOVING_ITERATION_RATE,
            false
        );


        scheduleHighQuality();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const factor =
            e.deltaY < 0
                ? 1.5
                : 1 / 1.5;


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

let previousDistance = null;


canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        clearTimeout(
            qualityTimer
        );


        hideProgress();


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        if (
            e.touches.length === 2
        ) {

            previousDistance =
                getTouchDistance(
                    e.touches
                );
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        /*
            1本指
        */

        if (
            e.touches.length === 1
        ) {

            const x =
                e.touches[0].clientX;

            const y =
                e.touches[0].clientY;


            const dx =
                x - lastX;

            const dy =
                y - lastY;


            const scale =
                4 / zoom;

            const aspect =
                width / height;


            centerX -=
                dx /
                width *
                scale;


            centerY -=
                dy /
                height *
                scale /
                aspect;


            lastX = x;
            lastY = y;


            draw(
                MOVING_STEP,
                MOVING_ITERATION_RATE,
                false
            );


            scheduleHighQuality();
        }


        /*
            2本指
        */

        if (
            e.touches.length === 2
        ) {

            const distance =
                getTouchDistance(
                    e.touches
                );


            if (
                previousDistance !== null
            ) {

                const factor =
                    distance /
                    previousDistance;


                const x =
                    (
                        e.touches[0].clientX +
                        e.touches[1].clientX
                    ) / 2;


                const y =
                    (
                        e.touches[0].clientY +
                        e.touches[1].clientY
                    ) / 2;


                zoomAt(
                    x,
                    y,
                    factor
                );
            }


            previousDistance =
                distance;
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        if (
            e.touches.length < 2
        ) {

            previousDistance =
                null;
        }


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        scheduleHighQuality();
    }
);


function getTouchDistance(
    touches
) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================================================
   Iteration setting
========================================================= */

iterationsInput.addEventListener(
    "change",
    () => {

        let value =
            parseInt(
                iterationsInput.value,
                10
            );


        if (
            !Number.isFinite(value)
        ) {

            value = 500;
        }


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    value
                )
            );


        maxIterations =
            value;


        iterationsInput.value =
            value;


        /*
            設定変更時は
            即高画質化
        */

        draw(
            1,
            1,
            true
        );
    }
);


/* =========================================================
   Reset
========================================================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            clearTimeout(
                qualityTimer
            );

            centerX = -0.75;
            centerY = 0;
            zoom = 1;


            draw(
                1,
                1,
                true
            );
        }
    );


/* =========================================================
   Resize
========================================================= */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    draw(
        1,
        1,
        false
    );
}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   Info
========================================================= */

function updateInfo() {

    if (
        zoom < 1000
    ) {

        zoomText.textContent =
            zoom.toFixed(1) + "×";

    } else {

        zoomText.textContent =
            zoom.toExponential(2) + "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Start
========================================================= */

resize();

</script>

</body>
</html>
