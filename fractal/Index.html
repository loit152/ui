<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 14px;
    left: 16px;

    color: rgba(255,255,255,.75);

    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;

    pointer-events: none;
    user-select: none;
}

#controls {
    position: fixed;
    right: 16px;
    bottom: 16px;

    display: flex;
    gap: 8px;
    align-items: center;

    font-family: monospace;
}

#iterations {
    width: 80px;

    padding: 5px 7px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: white;

    outline: none;
}

#reset {
    padding: 6px 10px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: rgba(255,255,255,.8);

    cursor: pointer;
}

#reset:hover {
    background: rgba(255,255,255,.1);
}

#progress {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    pointer-events: none;

    opacity: 0;

    transition: opacity .15s ease;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: rgba(255,255,255,.8);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom: <span id="zoom">1×</span></div>
    <div>Iterations: <span id="iterationText">500</span></div>
</div>

<div id="controls">

    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
        inputmode="numeric"
    >

    <button id="reset">
        Reset
    </button>

</div>

<div id="progress">
    <div id="progressBar"></div>
</div>


<script>
"use strict";


/* =========================================================
   WebGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl2", {
        antialias: false,
        powerPreference: "high-performance"
    });

if (!gl) {
    alert("このブラウザはWebGL2に対応していません。");
    throw new Error("WebGL2 unavailable");
}


/* =========================================================
   UI
========================================================= */

const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterationText");

const iterationsInput =
    document.getElementById("iterations");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const resetButton =
    document.getElementById("reset");


/* =========================================================
   State
========================================================= */

let centerX = -0.75;
let centerY = 0;

let zoom = 1;

let maxIterations = 500;


/*
    描画世代。

    古い高品質描画が、
    新しい操作後に実行されるのを防ぐ。
*/

let renderVersion = 0;

let qualityTimer = null;


/* =========================================================
   Rendering quality
========================================================= */

const MOVING_RATE = 0.15;


/*
    移動中は15%。

    指を止めると500回へ戻す。
*/

const FINAL_RATE = 1.0;


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main()
{
    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}
`;


/* =========================================================
   Fragment Shader
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;

out vec4 outColor;

uniform vec2 u_resolution;

uniform vec2 u_center;

uniform float u_zoom;

uniform int u_iterations;


/* =========================================================
   Color
========================================================= */

vec3 colorize(float t)
{
    return
        0.5 +
        0.5 *
        cos(
            6.28318530718 *
            (
                t +
                vec3(
                    0.00,
                    0.12,
                    0.25
                )
            )
        );
}


/* =========================================================
   Mandelbrot
========================================================= */

void main()
{
    vec2 pixel =
        gl_FragCoord.xy;


    /*
        アスペクト比を維持。
    */

    float scale =
        min(
            u_resolution.x,
            u_resolution.y
        );


    /*
        複素平面上のc。

        Y方向は上を正にする。
    */

    vec2 c =
        u_center +
        (
            pixel -
            0.5 * u_resolution
        )
        / scale
        / u_zoom;


    float zx = 0.0;
    float zy = 0.0;


    float smoothIteration = 0.0;

    bool escaped = false;


    /*
        Mandelbrot iteration

            z = z² + c
    */

    for (int i = 0; i < 100000; ++i)
    {
        if (i >= u_iterations)
            break;


        /*
            z²
        */

        float xx =
            zx * zx;

        float yy =
            zy * zy;


        /*
            escape判定。

            4ではなく16にして、
            smooth coloringのための
           余計な計算を減らす。
        */

        float r2 =
            xx + yy;


        if (r2 > 16.0)
        {
            /*
                Smooth iteration
            */

            float logZn =
                0.5 *
                log(r2);


            float nu =
                log(
                    logZn /
                    0.6931471805599453
                )
                /
                0.6931471805599453;


            smoothIteration =
                float(i) +
                1.0 -
                nu;


            escaped = true;

            break;
        }


        float xy =
            zx * zy;


        zx =
            xx -
            yy +
            c.x;


        zy =
            xy +
            xy +
            c.y;
    }


    /*
        Mandelbrot集合内部
    */

    if (!escaped)
    {
        outColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /*
        色付け
    */

    float t =
        smoothIteration /
        float(u_iterations);


    t =
        pow(
            clamp(
                t,
                0.0,
                1.0
            ),
            0.35
        );


    outColor =
        vec4(
            colorize(t),
            1.0
        );
}
`;


/* =========================================================
   Shader compilation
========================================================= */

function createShader(type, source)
{
    const shader =
        gl.createShader(type);


    gl.shaderSource(
        shader,
        source
    );


    gl.compileShader(shader);


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    )
    {
        const error =
            gl.getShaderInfoLog(shader);

        gl.deleteShader(shader);

        throw new Error(error);
    }


    return shader;
}


function createProgram(
    vertexSource,
    fragmentSource
)
{
    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexSource
        );


    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );


    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(program);


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    )
    {
        throw new Error(
            gl.getProgramInfoLog(program)
        );
    }


    gl.deleteShader(
        vertexShader
    );

    gl.deleteShader(
        fragmentShader
    );


    return program;
}


const program =
    createProgram(
        vertexShaderSource,
        fragmentShaderSource
    );


gl.useProgram(program);


/* =========================================================
   Fullscreen triangle
========================================================= */

const vertices =
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]);


const buffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniforms
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(
        program,
        "u_resolution"
    );


const centerLocation =
    gl.getUniformLocation(
        program,
        "u_center"
    );


const zoomLocation =
    gl.getUniformLocation(
        program,
        "u_zoom"
    );


const iterationsLocation =
    gl.getUniformLocation(
        program,
        "u_iterations"
    );


/* =========================================================
   Resize
========================================================= */

function resizeCanvas()
{
    /*
        DPRを最大2に制限。

        Retina画面での計算量爆発を防ぐ。
    */

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        Math.max(
            1,
            Math.floor(
                canvas.clientWidth * dpr
            )
        );


    const height =
        Math.max(
            1,
            Math.floor(
                canvas.clientHeight * dpr
            )
        );


    if (
        canvas.width !== width ||
        canvas.height !== height
    )
    {
        canvas.width = width;
        canvas.height = height;
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Render
========================================================= */

function render(iterationRate)
{
    resizeCanvas();


    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );


    gl.useProgram(program);


    gl.uniform2f(
        resolutionLocation,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        centerLocation,
        centerX,
        centerY
    );


    gl.uniform1f(
        zoomLocation,
        zoom
    );


    gl.uniform1i(
        iterationsLocation,
        iterations
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );
}


/* =========================================================
   Moving render
========================================================= */

function renderMoving()
{
    renderVersion++;


    clearTimeout(
        qualityTimer
    );


    render(
        MOVING_RATE
    );
}


/* =========================================================
   Final render
========================================================= */

function scheduleFinal()
{
    const version =
        renderVersion;


    clearTimeout(
        qualityTimer
    );


    qualityTimer =
        setTimeout(
            () =>
            {
                if (
                    version !== renderVersion
                )
                {
                    return;
                }


                render(
                    FINAL_RATE
                );
            },
            120
        );
}


function renderFinal()
{
    renderVersion++;


    clearTimeout(
        qualityTimer
    );


    render(
        FINAL_RATE
    );
}


/* =========================================================
   Zoom
========================================================= */

function zoomAt(
    screenX,
    screenY,
    factor
)
{
    const rect =
        canvas.getBoundingClientRect();


    const x =
        screenX -
        rect.left;


    const y =
        screenY -
        rect.top;


    const scale =
        Math.min(
            rect.width,
            rect.height
        );


    /*
        ズーム前のカーソル位置。
    */

    const worldX =
        centerX +
        (
            x -
            rect.width * 0.5
        )
        / scale
        / zoom;


    const worldY =
        centerY +
        (
            rect.height * 0.5 -
            y
        )
        / scale
        / zoom;


    /*
        ズーム。
    */

    zoom *= factor;


    /*
        カーソル下の点を固定。
    */

    centerX =
        worldX -
        (
            x -
            rect.width * 0.5
        )
        / scale
        / zoom;


    centerY =
        worldY -
        (
            rect.height * 0.5 -
            y
        )
        / scale
        / zoom;


    updateInfo();


    renderMoving();

    scheduleFinal();
}


/* =========================================================
   Mouse drag
========================================================= */

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;


canvas.addEventListener(
    "mousedown",
    e =>
    {
        dragging = true;


        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;


        renderVersion++;


        clearTimeout(
            qualityTimer
        );
    }
);


window.addEventListener(
    "mousemove",
    e =>
    {
        if (!dragging)
            return;


        const dx =
            e.clientX -
            lastMouseX;


        const dy =
            e.clientY -
            lastMouseY;


        const scale =
            Math.min(
                canvas.clientWidth,
                canvas.clientHeight
            );


        const worldScale =
            1 / zoom;


        centerX -=
            dx /
            scale *
            worldScale;


        centerY +=
            dy /
            scale *
            worldScale;


        lastMouseX =
            e.clientX;


        lastMouseY =
            e.clientY;


        updateInfo();


        renderMoving();
    }
);


window.addEventListener(
    "mouseup",
    () =>
    {
        if (!dragging)
            return;


        dragging = false;


        scheduleFinal();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e =>
    {
        e.preventDefault();


        /*
            滑らかな指数ズーム。

            上方向 → zoom in
            下方向 → zoom out
        */

        const factor =
            Math.exp(
                -e.deltaY * 0.0015
            );


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );
    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

const touches =
    new Map();


let pinchStartDistance = 0;

let pinchStartZoom = 1;

let pinchCenter = null;


function touchDistance(a, b)
{
    return Math.hypot(
        a.clientX - b.clientX,
        a.clientY - b.clientY
    );
}


function touchMidpoint(a, b)
{
    return {
        x:
            (a.clientX + b.clientX) * 0.5,

        y:
            (a.clientY + b.clientY) * 0.5
    };
}


canvas.addEventListener(
    "touchstart",
    e =>
    {
        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        )
        {
            touches.set(
                touch.identifier,
                {
                    clientX:
                        touch.clientX,

                    clientY:
                        touch.clientY,

                    lastX:
                        touch.clientX,

                    lastY:
                        touch.clientY
                }
            );
        }


        renderVersion++;


        clearTimeout(
            qualityTimer
        );


        if (touches.size === 2)
        {
            const [a, b] =
                [...touches.values()];


            pinchStartDistance =
                touchDistance(a, b);


            pinchStartZoom =
                zoom;


            pinchCenter =
                touchMidpoint(a, b);
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e =>
    {
        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        )
        {
            const old =
                touches.get(
                    touch.identifier
                );


            if (old)
            {
                old.clientX =
                    touch.clientX;

                old.clientY =
                    touch.clientY;
            }
        }


        /*
            1本指 = パン
        */

        if (touches.size === 1)
        {
            const touch =
                [...touches.values()][0];


            const dx =
                touch.clientX -
                touch.lastX;


            const dy =
                touch.clientY -
                touch.lastY;


            const scale =
                Math.min(
                    canvas.clientWidth,
                    canvas.clientHeight
                );


            const worldScale =
                1 / zoom;


            centerX -=
                dx /
                scale *
                worldScale;


            centerY +=
                dy /
                scale *
                worldScale;


            touch.lastX =
                touch.clientX;


            touch.lastY =
                touch.clientY;


            updateInfo();


            renderMoving();
        }


        /*
            2本指 = ピンチ
        */

        else if (
            touches.size === 2 &&
            pinchStartDistance > 0
        )
        {
            const [a, b] =
                [...touches.values()];


            const currentDistance =
                touchDistance(a, b);


            const ratio =
                currentDistance /
                pinchStartDistance;


            /*
                ズーム倍率
            */

            zoom =
                pinchStartZoom *
                ratio;


            /*
                ピンチ中心を維持。

                現在の中心を一度
                ピンチ中心基準に変換する。
            */

            if (pinchCenter)
            {
                const rect =
                    canvas.getBoundingClientRect();


                const mx =
                    pinchCenter.x -
                    rect.left;


                const my =
                    pinchCenter.y -
                    rect.top;


                const scale =
                    Math.min(
                        rect.width,
                        rect.height
                    );


                /*
                    ピンチ開始時の
                    ワールド座標を推定。
                */

                const startScale =
                    1 / pinchStartZoom;


                const wx =
                    centerX +
                    (
                        mx -
                        rect.width * 0.5
                    )
                    / scale *
                    startScale;


                const wy =
                    centerY +
                    (
                        rect.height * 0.5 -
                        my
                    )
                    / scale *
                    startScale;


                /*
                    新しいズームで
                    ピンチ中心を固定。
                */

                centerX =
                    wx -
                    (
                        mx -
                        rect.width * 0.5
                    )
                    / scale /
                    zoom;


                centerY =
                    wy -
                    (
                        rect.height * 0.5 -
                        my
                    )
                    / scale /
                    zoom;
            }


            updateInfo();


            renderMoving();
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e =>
    {
        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        )
        {
            touches.delete(
                touch.identifier
            );
        }


        if (touches.size === 0)
        {
            pinchStartDistance = 0;

            pinchCenter = null;

            scheduleFinal();
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchcancel",
    () =>
    {
        touches.clear();

        pinchStartDistance = 0;

        pinchCenter = null;

        scheduleFinal();
    }
);


/* =========================================================
   Iterations
========================================================= */

iterationsInput.addEventListener(
    "change",
    () =>
    {
        let value =
            parseInt(
                iterationsInput.value,
                10
            );


        if (!Number.isFinite(value))
        {
            value = 500;
        }


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    value
                )
            );


        maxIterations =
            value;


        iterationsInput.value =
            value;


        iterationText.textContent =
            value;


        renderFinal();
    }
);


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener(
    "click",
    () =>
    {
        centerX = -0.75;

        centerY = 0;

        zoom = 1;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Info
========================================================= */

function updateInfo()
{
    if (zoom < 1000000)
    {
        zoomText.textContent =
            zoom.toPrecision(4) +
            "×";
    }
    else
    {
        zoomText.textContent =
            zoom.toExponential(3) +
            "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
    "resize",
    () =>
    {
        resizeCanvas();

        renderFinal();
    }
);


/* =========================================================
   Start
========================================================= */

resizeCanvas();

updateInfo();

renderFinal();

</script>

</body>
</html>
