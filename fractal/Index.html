<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
}

#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    cursor: grab;
    touch-action: none;
}

#canvas.dragging {
    cursor: grabbing;
}

#info {
    position: fixed;
    top: 10px;
    left: 10px;

    padding: 8px 10px;

    background: rgba(0,0,0,.65);

    border: 1px solid rgba(255,255,255,.2);

    font-size: 12px;
    line-height: 1.5;

    pointer-events: none;
    user-select: none;

    z-index: 10;
}

#progressBox {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 10px;

    height: 4px;

    background: rgba(255,255,255,.15);

    z-index: 10;

    pointer-events: none;
}

#progress {
    width: 0%;
    height: 100%;

    background: white;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>MODE: <span id="mode">READY</span></div>
    <div>ZOOM: <span id="zoom">1</span></div>
    <div>X: <span id="cx">-0.75</span></div>
    <div>Y: <span id="cy">0</span></div>
    <div>PRECISION: <span id="precision">50</span></div>
    <div>QUALITY: <span id="quality">0%</span></div>
</div>

<div id="progressBox">
    <div id="progress"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>

<script>

"use strict";

/* =====================================================
   基本設定
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });


/* =====================================================
   UI
===================================================== */

const modeElement =
    document.getElementById("mode");

const zoomElement =
    document.getElementById("zoom");

const cxElement =
    document.getElementById("cx");

const cyElement =
    document.getElementById("cy");

const precisionElement =
    document.getElementById("precision");

const qualityElement =
    document.getElementById("quality");

const progressElement =
    document.getElementById("progress");


/* =====================================================
   Decimal
===================================================== */

Decimal.set({
    precision: 60
});


/* =====================================================
   Mandelbrot状態
===================================================== */

let centerX =
    new Decimal("-0.75");

let centerY =
    new Decimal("0");

let zoom =
    new Decimal("1");


/* =====================================================
   Canvas
===================================================== */

let width = 0;
let height = 0;


/* =====================================================
   描画管理
===================================================== */

/*
    renderVersionを増やすことで、
    古い描画処理を無効化する。
*/

let renderVersion = 0;

let rendering = false;


/* =====================================================
   ドラッグ
===================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;

let dragStartX = 0;
let dragStartY = 0;


/* =====================================================
   高画質化待機
===================================================== */

let renderTimer = null;


/* =====================================================
   リサイズ
===================================================== */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

    cancelRendering();

    drawPreview();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   Precision
===================================================== */

function updatePrecision() {

    /*
        Numberを使わず、
        Decimalから指数を取得する。

        深くズームするほど精度を増やす。
    */

    const exponent =
        Math.max(
            0,
            zoom.log().div(10).toNumber()
        );

    const precision =
        Math.max(
            50,
            Math.ceil(exponent + 40)
        );

    Decimal.set({
        precision: precision
    });

    precisionElement.textContent =
        precision;
}


/* =====================================================
   最大反復回数
===================================================== */

function getMaxIteration() {

    /*
        ズームが深くなるほど
        最大反復回数を増やす。

        ただし無制限には増やさない。
    */

    const exponent =
        Math.max(
            0,
            zoom.log().div(2).toNumber()
        );

    return Math.min(
        1000,
        Math.floor(
            120 + exponent * 30
        )
    );
}


/* =====================================================
   座標変換
===================================================== */

function getPlaneSize() {

    const aspect =
        new Decimal(width)
        .div(height);

    const planeHeight =
        new Decimal(4)
        .div(zoom);

    const planeWidth =
        planeHeight.mul(aspect);

    return {
        width: planeWidth,
        height: planeHeight
    };
}


function screenToComplex(px, py) {

    const plane =
        getPlaneSize();

    const dx =
        new Decimal(
            px - width / 2
        )
        .div(width)
        .mul(plane.width);

    const dy =
        new Decimal(
            py - height / 2
        )
        .div(height)
        .mul(plane.height);

    return {
        x: centerX.add(dx),
        y: centerY.add(dy)
    };
}


/* =====================================================
   Mandelbrot
===================================================== */

function mandelbrot(
    cx,
    cy,
    maxIteration
) {

    let x =
        new Decimal(0);

    let y =
        new Decimal(0);

    let iteration = 0;

    const four =
        new Decimal(4);

    while (
        iteration < maxIteration
    ) {

        const xx =
            x.mul(x);

        const yy =
            y.mul(y);

        if (
            xx.add(yy).gt(four)
        ) {
            break;
        }

        const xy =
            x.mul(y);

        x =
            xx.sub(yy).add(cx);

        y =
            xy.mul(2).add(cy);

        iteration++;
    }

    return iteration;
}


/* =====================================================
   色
===================================================== */

function getColor(
    iteration,
    maxIteration
) {

    if (
        iteration >= maxIteration
    ) {
        return 0;
    }

    /*
        現在は白黒。
        後からカラーマップ化可能。
    */

    return 255;
}


/* =====================================================
   Preview
===================================================== */

function drawPreview() {

    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }

    modeElement.textContent =
        "PREVIEW";

    /*
        操作中用。

        画面全体を毎回計算するのではなく、
        16px間隔で計算。
    */

    const step = 16;

    const image =
        ctx.createImageData(
            width,
            height
        );

    const data =
        image.data;

    const maxIteration = 40;

    for (
        let y = 0;
        y < height;
        y += step
    ) {

        for (
            let x = 0;
            x < width;
            x += step
        ) {

            const point =
                screenToComplex(
                    x,
                    y
                );

            const iteration =
                mandelbrot(
                    point.x,
                    point.y,
                    maxIteration
                );

            const value =
                getColor(
                    iteration,
                    maxIteration
                );

            /*
                16×16のブロックとして描画
            */

            for (
                let yy = y;
                yy < Math.min(
                    y + step,
                    height
                );
                yy++
            ) {

                for (
                    let xx = x;
                    xx < Math.min(
                        x + step,
                        width
                    );
                    xx++
                ) {

                    const index =
                        (yy * width + xx) * 4;

                    data[index] =
                        value;

                    data[index + 1] =
                        value;

                    data[index + 2] =
                        value;

                    data[index + 3] =
                        255;
                }
            }
        }
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    updateInfo();
}


/* =====================================================
   描画キャンセル
===================================================== */

function cancelRendering() {

    renderVersion++;

    rendering = false;

    if (
        renderTimer !== null
    ) {

        clearTimeout(
            renderTimer
        );

        renderTimer = null;
    }

    modeElement.textContent =
        "READY";
}


/* =====================================================
   高画質描画予約
===================================================== */

function scheduleRender() {

    if (
        renderTimer !== null
    ) {

        clearTimeout(
            renderTimer
        );
    }

    /*
        操作直後には計算しない。

        150ms操作が止まったら開始。
    */

    renderTimer =
        setTimeout(
            () => {

                renderTimer = null;

                renderHighQuality();

            },
            150
        );
}


/* =====================================================
   高画質描画
===================================================== */

async function renderHighQuality() {

    cancelRendering();

    const version =
        renderVersion;

    rendering = true;

    modeElement.textContent =
        "RENDERING";

    progressElement.style.width =
        "0%";

    qualityElement.textContent =
        "0%";

    const maxIteration =
        getMaxIteration();

    updatePrecision();


    /*
        最初からフル解像度ではなく、

        1/8
        ↓
        1/4
        ↓
        1/2
        ↓
        1/1

        と段階的に高画質化する。
    */

    const levels = [
        8,
        4,
        2,
        1
    ];

    for (
        let levelIndex = 0;
        levelIndex < levels.length;
        levelIndex++
    ) {

        const step =
            levels[levelIndex];

        /*
            小さい画像を作る。
        */

        const renderWidth =
            Math.ceil(
                width / step
            );

        const renderHeight =
            Math.ceil(
                height / step
            );

        const image =
            ctx.createImageData(
                width,
                height
            );

        const data =
            image.data;


        /*
            ピクセル計算
        */

        for (
            let y = 0;
            y < renderHeight;
            y++
        ) {

            /*
                操作されたら即中止。
            */

            if (
                version !== renderVersion
            ) {
                return;
            }

            for (
                let x = 0;
                x < renderWidth;
                x++
            ) {

                const px =
                    x * step;

                const py =
                    y * step;

                const point =
                    screenToComplex(
                        px,
                        py
                    );

                const iteration =
                    mandelbrot(
                        point.x,
                        point.y,
                        maxIteration
                    );

                const value =
                    getColor(
                        iteration,
                        maxIteration
                    );


                /*
                    step × step に拡大。
                */

                for (
                    let yy = py;
                    yy < Math.min(
                        py + step,
                        height
                    );
                    yy++
                ) {

                    for (
                        let xx = px;
                        xx < Math.min(
                            px + step,
                            width
                        );
                        xx++
                    ) {

                        const index =
                            (yy * width + xx) * 4;

                        data[index] =
                            value;

                        data[index + 1] =
                            value;

                        data[index + 2] =
                            value;

                        data[index + 3] =
                            255;
                    }
                }
            }

            /*
                数行ごとに画面更新。
            */

            if (
                y % 8 === 0
            ) {

                ctx.putImageData(
                    image,
                    0,
                    0
                );

                const levelProgress =
                    y / renderHeight;

                const totalProgress =
                    (
                        levelIndex +
                        levelProgress
                    ) / levels.length;

                const percent =
                    Math.floor(
                        totalProgress * 100
                    );

                progressElement.style.width =
                    percent + "%";

                qualityElement.textContent =
                    percent + "%";

                await nextFrame();
            }
        }

        /*
            レベル終了時に必ず描画。
        */

        ctx.putImageData(
            image,
            0,
            0
        );

        /*
            UIへ制御を返す。
        */

        await nextFrame();
    }

    rendering = false;

    modeElement.textContent =
        "READY";

    progressElement.style.width =
        "100%";

    qualityElement.textContent =
        "100%";

    updateInfo();
}


/* =====================================================
   requestAnimationFrame
===================================================== */

function nextFrame() {

    return new Promise(
        resolve => {

            requestAnimationFrame(
                resolve
            );

        }
    );
}


/* =====================================================
   情報表示
===================================================== */

function updateInfo() {

    zoomElement.textContent =
        formatDecimal(zoom);

    cxElement.textContent =
        formatDecimal(centerX);

    cyElement.textContent =
        formatDecimal(centerY);
}


function formatDecimal(value) {

    return value
        .toSignificantDigits(25)
        .toString();
}


/* =====================================================
   ドラッグ開始
===================================================== */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
            まず描画を完全停止。
        */

        cancelRendering();

        dragging = true;

        canvas.classList.add(
            "dragging"
        );

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );

        modeElement.textContent =
            "MOVING";
    }
);


/* =====================================================
   ドラッグ中
===================================================== */

canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging) {
            return;
        }

        const dx =
            event.clientX - lastX;

        const dy =
            event.clientY - lastY;

        lastX =
            event.clientX;

        lastY =
            event.clientY;


        /*
            画面上の移動量を
            複素平面へ変換。
        */

        const plane =
            getPlaneSize();

        const moveX =
            new Decimal(dx)
            .div(width)
            .mul(plane.width);

        const moveY =
            new Decimal(dy)
            .div(height)
            .mul(plane.height);


        centerX =
            centerX.sub(moveX);

        centerY =
            centerY.sub(moveY);


        /*
            プレビューだけ描画。
        */

        drawPreview();
    }
);


/* =====================================================
   ドラッグ終了
===================================================== */

canvas.addEventListener(
    "pointerup",
    event => {

        if (!dragging) {
            return;
        }

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );

        canvas.releasePointerCapture(
            event.pointerId
        );

        modeElement.textContent =
            "WAIT";

        /*
            操作終了後に高画質化。
        */

        scheduleRender();
    }
);


/* =====================================================
   Pointer cancel
===================================================== */

canvas.addEventListener(
    "pointercancel",
    () => {

        if (!dragging) {
            return;
        }

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );

        scheduleRender();
    }
);


/* =====================================================
   ズーム
===================================================== */

canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        /*
            ズーム中は計算をしない。
        */

        cancelRendering();


        /*
            マウス位置の
            ズーム前の複素座標
        */

        const before =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        /*
            ズーム量。

            1回 = ×2 または ×0.5
        */

        const factor =
            event.deltaY < 0
                ? new Decimal(2)
                : new Decimal("0.5");


        zoom =
            zoom.mul(factor);


        updatePrecision();


        /*
            ズーム後のマウス位置。
        */

        const after =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        /*
            マウス位置を固定する。
        */

        centerX =
            centerX.add(
                before.x.sub(after.x)
            );

        centerY =
            centerY.add(
                before.y.sub(after.y)
            );


        /*
            即座に粗いプレビュー。
        */

        drawPreview();


        /*
            ホイール操作が止まってから
            高画質化。
        */

        scheduleRender();
    },
    {
        passive: false
    }
);


/* =====================================================
   ダブルクリック
===================================================== */

canvas.addEventListener(
    "dblclick",
    event => {

        cancelRendering();

        const before =
            screenToComplex(
                event.clientX,
                event.clientY
            );

        zoom =
            zoom.mul(2);

        const after =
            screenToComplex(
                event.clientX,
                event.clientY
            );

        centerX =
            centerX.add(
                before.x.sub(after.x)
            );

        centerY =
            centerY.add(
                before.y.sub(after.y)
            );

        updatePrecision();

        drawPreview();

        scheduleRender();
    }
);


/* =====================================================
   初期化
===================================================== */

resize();

updatePrecision();

updateInfo();

drawPreview();

scheduleRender();

</script>

</body>
</html>
