<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

#info {
    position: fixed;
    top: 14px;
    left: 14px;

    color: rgba(255,255,255,.75);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;
    line-height: 1.6;

    user-select: none;
    pointer-events: none;

    text-shadow: 0 1px 4px #000;
}

#settings {
    position: fixed;
    left: 14px;
    bottom: 14px;

    color: rgba(255,255,255,.75);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;

    display: flex;
    align-items: center;
    gap: 6px;
}

#iterationsInput {
    width: 65px;

    padding: 6px 7px;

    color: white;
    background: rgba(0,0,0,.45);

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;

    outline: none;

    font-size: 12px;
}

#iterationsInput:focus {
    border-color: rgba(255,255,255,.45);
}

#reset {
    position: fixed;
    right: 14px;
    bottom: 14px;

    padding: 8px 12px;

    color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.35);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 7px;

    font-size: 12px;

    cursor: pointer;
}

#reset:active {
    background: rgba(255,255,255,.15);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom <span id="zoom">1×</span></div>
    <div>Iterations <span id="iterations">500</span></div>
</div>

<div id="settings">
    <span>Max</span>
    <input
        id="iterationsInput"
        type="number"
        value="500"
        min="1"
        max="100000"
        step="1"
    >
</div>

<button id="reset">Reset</button>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterations");

const iterationsInput =
    document.getElementById("iterationsInput");


let width;
let height;


/* =========================
   Mandelbrot state
========================= */

let centerX = -0.75;
let centerY = 0;

let zoom = 1;


/*
    ユーザーが指定した
    通常時の最大反復回数
*/
let maxIterations = 500;


/*
    描画世代

    古い計算を途中で破棄するために使う
*/
let renderVersion = 0;


/*
    高精細描画タイマー
*/
let highQualityTimer = null;


/* =========================
   Iterations
========================= */

function getCurrentIterations(moving) {

    if (!moving) {
        return maxIterations;
    }

    /*
        移動中は通常の25%

        例:
        500 → 125
        1000 → 250
        10000 → 2500

        最低1回
    */

    return Math.max(
        1,
        Math.floor(
            maxIterations * 0.25
        )
    );
}


/* =========================
   Draw
========================= */

function draw(
    step = 1,
    moving = false
) {

    const version =
        ++renderVersion;


    const iterations =
        getCurrentIterations(moving);


    const image =
        ctx.createImageData(
            width,
            height
        );

    const data =
        image.data;


    /*
        複素平面の範囲
    */

    const scale =
        4 / zoom;

    const aspect =
        width / height;

    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    const minX =
        centerX - rangeX / 2;

    const minY =
        centerY - rangeY / 2;


    /*
        step = 4なら
        4×4のブロック単位で計算
    */

    for (
        let py = 0;
        py < height;
        py += step
    ) {

        /*
            新しい操作が発生したら
            古い計算を捨てる
        */

        if (
            version !== renderVersion
        ) {
            return;
        }


        const cy =
            minY +
            py / height * rangeY;


        for (
            let px = 0;
            px < width;
            px += step
        ) {

            const cx =
                minX +
                px / width * rangeX;


            let x = 0;
            let y = 0;

            let iteration = 0;


            while (
                x * x +
                y * y <= 4 &&
                iteration < iterations
            ) {

                const xx =
                    x * x -
                    y * y +
                    cx;

                y =
                    2 * x * y +
                    cy;

                x = xx;

                iteration++;
            }


            let r = 0;
            let g = 0;
            let b = 0;


            /*
                集合内部
            */

            if (
                iteration <
                iterations
            ) {

                /*
                    Smooth coloring
                */

                const logZn =
                    Math.log(
                        Math.log(
                            x * x +
                            y * y
                        )
                    ) / Math.log(2);


                const smooth =
                    iteration +
                    1 -
                    logZn;


                const t =
                    smooth /
                    iterations;


                const v =
                    Math.floor(
                        255 *
                        Math.pow(
                            Math.max(0, t),
                            0.35
                        )
                    );


                r = v;
                g = v;
                b = v;
            }


            /*
                ブロックを塗る
            */

            for (
                let yy = 0;
                yy < step &&
                py + yy < height;
                yy++
            ) {

                for (
                    let xx = 0;
                    xx < step &&
                    px + xx < width;
                    xx++
                ) {

                    const index =
                        (
                            (py + yy) *
                            width +
                            (px + xx)
                        ) * 4;


                    data[index] =
                        r;

                    data[index + 1] =
                        g;

                    data[index + 2] =
                        b;

                    data[index + 3] =
                        255;
                }
            }
        }
    }


    /*
        最新の描画だけ表示
    */

    if (
        version === renderVersion
    ) {

        ctx.putImageData(
            image,
            0,
            0
        );

        updateInfo();
    }
}


/* =========================
   Info
========================= */

function updateInfo() {

    if (zoom < 1000) {

        zoomText.textContent =
            zoom.toFixed(1) + "×";

    } else {

        zoomText.textContent =
            zoom.toExponential(2) + "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================
   High quality rendering
========================= */

function scheduleHighQuality() {

    clearTimeout(
        highQualityTimer
    );


    highQualityTimer =
        setTimeout(() => {

            /*
                step = 1
                通常の反復回数
            */

            draw(1, false);

        }, 120);
}


/* =========================
   Zoom
========================= */

function zoomAt(
    screenX,
    screenY,
    factor
) {

    const scale =
        4 / zoom;

    const aspect =
        width / height;


    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    /*
        ズーム前の座標
    */

    const worldX =
        centerX +
        (
            screenX / width -
            0.5
        ) * rangeX;


    const worldY =
        centerY +
        (
            screenY / height -
            0.5
        ) * rangeY;


    zoom *= factor;


    /*
        ズーム後
    */

    const newScale =
        4 / zoom;

    const newRangeX =
        newScale;

    const newRangeY =
        newScale / aspect;


    centerX =
        worldX -
        (
            screenX / width -
            0.5
        ) * newRangeX;


    centerY =
        worldY -
        (
            screenY / height -
            0.5
        ) * newRangeY;


    /*
        移動中と同じ扱い

        step = 4
        iterations = 25%
    */

    draw(4, true);

    scheduleHighQuality();
}


/* =========================
   Mouse
========================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        clearTimeout(
            highQualityTimer
        );
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging) return;

        dragging = false;

        scheduleHighQuality();
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if (!dragging) return;


        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;


        const scale =
            4 / zoom;

        const aspect =
            width / height;


        centerX -=
            dx / width * scale;


        centerY -=
            dy /
            height *
            scale /
            aspect;


        lastX = e.clientX;
        lastY = e.clientY;


        /*
            移動中

            ・粗い描画
            ・反復回数25%
        */

        draw(4, true);

        scheduleHighQuality();
    }
);


/* =========================
   Wheel
========================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const factor =
            e.deltaY < 0
                ? 1.5
                : 1 / 1.5;


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );

    },
    {
        passive: false
    }
);


/* =========================
   Touch
========================= */

let previousDistance = null;


canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        if (
            e.touches.length === 2
        ) {

            previousDistance =
                getTouchDistance(
                    e.touches
                );
        }


        clearTimeout(
            highQualityTimer
        );

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        /*
            1本指
        */

        if (
            e.touches.length === 1
        ) {

            const x =
                e.touches[0].clientX;

            const y =
                e.touches[0].clientY;


            const dx =
                x - lastX;

            const dy =
                y - lastY;


            const scale =
                4 / zoom;

            const aspect =
                width / height;


            centerX -=
                dx / width * scale;


            centerY -=
                dy /
                height *
                scale /
                aspect;


            lastX = x;
            lastY = y;


            draw(4, true);

            scheduleHighQuality();
        }


        /*
            2本指
        */

        if (
            e.touches.length === 2
        ) {

            const distance =
                getTouchDistance(
                    e.touches
                );


            if (
                previousDistance !== null
            ) {

                const factor =
                    distance /
                    previousDistance;


                const x =
                    (
                        e.touches[0].clientX +
                        e.touches[1].clientX
                    ) / 2;


                const y =
                    (
                        e.touches[0].clientY +
                        e.touches[1].clientY
                    ) / 2;


                zoomAt(
                    x,
                    y,
                    factor
                );
            }


            previousDistance =
                distance;
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        if (
            e.touches.length < 2
        ) {

            previousDistance =
                null;
        }


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        scheduleHighQuality();
    }
);


function getTouchDistance(touches) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================
   Iteration setting
========================= */

iterationsInput.addEventListener(
    "change",
    () => {

        let value =
            parseInt(
                iterationsInput.value,
                10
            );


        if (
            !Number.isFinite(value)
        ) {
            value = 500;
        }


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    value
                )
            );


        maxIterations = value;

        iterationsInput.value =
            value;


        /*
            設定変更時は
            すぐ高精細描画
        */

        draw(1, false);
    }
);


/* =========================
   Reset
========================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            centerX = -0.75;
            centerY = 0;
            zoom = 1;

            draw(1, false);
        }
    );


/* =========================
   Resize
========================= */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    draw(1, false);
}


window.addEventListener(
    "resize",
    resize
);


resize();

</script>

</body>
</html>
