<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
    }

    canvas:active {
        cursor: grabbing;
    }

    #info {
        position: fixed;
        top: 16px;
        left: 16px;

        padding: 10px 13px;

        color: rgba(255,255,255,.8);
        background: rgba(0,0,0,.35);

        border-radius: 8px;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        font-size: 12px;
        line-height: 1.6;

        pointer-events: none;
        user-select: none;

        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }

    #reset {
        position: fixed;
        right: 16px;
        bottom: 16px;

        padding: 9px 13px;

        color: rgba(255,255,255,.8);
        background: rgba(0,0,0,.4);

        border: 1px solid rgba(255,255,255,.15);
        border-radius: 8px;

        font-size: 12px;

        cursor: pointer;
    }

    #reset:active {
        background: rgba(255,255,255,.15);
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom <span id="zoom">1×</span></div>
    <div>Iterations <span id="iterations">80</span></div>
</div>

<button id="reset">Reset</button>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const zoomText = document.getElementById("zoom");
const iterationText = document.getElementById("iterations");

let width;
let height;

let centerX = -0.75;
let centerY = 0;

let zoom = 1;

let dragging = false;
let lastX = 0;
let lastY = 0;

let renderID = 0;


// ========================
// Canvas
// ========================

function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    draw();
}

window.addEventListener("resize", resize);


// ========================
// Mandelbrot
// ========================

function getIterations() {

    return Math.floor(
        80 + Math.log2(zoom) * 18
    );
}


function draw() {

    const id = ++renderID;

    const image = ctx.createImageData(width, height);
    const data = image.data;

    const maxIteration = getIterations();

    /*
        表示範囲

        zoom = 1
            → 約4 × 4の範囲

        zoomが増えるほど
            → 見える範囲が狭くなる
    */

    const scale = 4 / zoom;

    const aspect = width / height;

    const rangeX = scale;
    const rangeY = scale / aspect;

    const minX = centerX - rangeX / 2;
    const minY = centerY - rangeY / 2;


    for (let py = 0; py < height; py++) {

        if (id !== renderID) return;

        const cy =
            minY + py / height * rangeY;

        for (let px = 0; px < width; px++) {

            const cx =
                minX + px / width * rangeX;

            let x = 0;
            let y = 0;

            let iteration = 0;

            while (
                x * x + y * y <= 4 &&
                iteration < maxIteration
            ) {

                const xx = x * x - y * y + cx;

                y = 2 * x * y + cy;
                x = xx;

                iteration++;
            }


            const index =
                (py * width + px) * 4;


            if (iteration === maxIteration) {

                data[index] = 0;
                data[index + 1] = 0;
                data[index + 2] = 0;

            } else {

                /*
                    滑らかな色付け
                */

                const logZn =
                    Math.log(
                        Math.log(
                            x * x + y * y
                        )
                    ) / Math.log(2);

                const smooth =
                    iteration + 1 - logZn;

                const t =
                    smooth / maxIteration;

                const v =
                    Math.floor(
                        255 * Math.pow(t, 0.35)
                    );

                data[index] = v;
                data[index + 1] = v;
                data[index + 2] = v;
            }

            data[index + 3] = 255;
        }
    }

    ctx.putImageData(image, 0, 0);

    updateInfo();
}


// ========================
// Information
// ========================

function updateInfo() {

    zoomText.textContent =
        zoom < 1000
            ? zoom.toFixed(1) + "×"
            : zoom.toExponential(2) + "×";

    iterationText.textContent =
        getIterations();
}


// ========================
// Zoom
// ========================

function zoomAt(screenX, screenY, factor) {

    /*
        ズーム前に、
        画面上の座標が
        複素平面のどこなのか求める
    */

    const scale = 4 / zoom;

    const aspect = width / height;

    const rangeX = scale;
    const rangeY = scale / aspect;

    const worldX =
        centerX +
        (screenX / width - 0.5) * rangeX;

    const worldY =
        centerY +
        (screenY / height - 0.5) * rangeY;


    zoom *= factor;


    /*
        ズーム後も
        worldX / worldY が
        同じ画面位置に残るようにする
    */

    const newScale = 4 / zoom;

    const newRangeX = newScale;
    const newRangeY = newScale / aspect;

    centerX =
        worldX -
        (screenX / width - 0.5) * newRangeX;

    centerY =
        worldY -
        (screenY / height - 0.5) * newRangeY;


    draw();
}


// ========================
// Mouse
// ========================

canvas.addEventListener("mousedown", e => {

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;
});


window.addEventListener("mouseup", () => {

    dragging = false;
});


window.addEventListener("mousemove", e => {

    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    const scale = 4 / zoom;

    const aspect = width / height;

    centerX -=
        dx / width * scale;

    centerY -=
        dy / height * scale / aspect;


    lastX = e.clientX;
    lastY = e.clientY;

    draw();
});


canvas.addEventListener("wheel", e => {

    e.preventDefault();

    const factor =
        e.deltaY < 0
            ? 1.5
            : 1 / 1.5;

    zoomAt(
        e.clientX,
        e.clientY,
        factor
    );

}, { passive: false });


// ========================
// Touch
// ========================

let touches = [];
let previousDistance = null;

canvas.addEventListener("touchstart", e => {

    e.preventDefault();

    touches = [...e.touches];

    if (touches.length === 1) {

        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
    }

    if (touches.length === 2) {

        previousDistance =
            getTouchDistance(touches);
    }

}, { passive: false });


canvas.addEventListener("touchmove", e => {

    e.preventDefault();

    const current =
        [...e.touches];

    if (current.length === 1) {

        const dx =
            current[0].clientX - lastX;

        const dy =
            current[0].clientY - lastY;

        const scale = 4 / zoom;
        const aspect = width / height;

        centerX -=
            dx / width * scale;

        centerY -=
            dy / height * scale / aspect;

        lastX = current[0].clientX;
        lastY = current[0].clientY;

        draw();
    }


    if (current.length === 2) {

        const distance =
            getTouchDistance(current);

        if (previousDistance !== null) {

            const factor =
                distance / previousDistance;

            const centerTouchX =
                (current[0].clientX +
                 current[1].clientX) / 2;

            const centerTouchY =
                (current[0].clientY +
                 current[1].clientY) / 2;

            zoomAt(
                centerTouchX,
                centerTouchY,
                factor
            );
        }

        previousDistance = distance;
    }

    touches = current;

}, { passive: false });


canvas.addEventListener("touchend", e => {

    touches = [...e.touches];

    if (touches.length < 2) {
        previousDistance = null;
    }

    if (touches.length === 1) {

        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
    }

});


function getTouchDistance(t) {

    const dx =
        t[0].clientX -
        t[1].clientX;

    const dy =
        t[0].clientY -
        t[1].clientY;

    return Math.sqrt(dx * dx + dy * dy);
}


// ========================
// Reset
// ========================

document.getElementById("reset")
    .addEventListener("click", () => {

        centerX = -0.75;
        centerY = 0;
        zoom = 1;

        draw();
    });


// ========================
// Start
// ========================

resize();

</script>

</body>
</html>
