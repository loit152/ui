<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 14px;
    left: 16px;

    color: rgba(255,255,255,.75);
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;

    pointer-events: none;
    user-select: none;
}

#controls {
    position: fixed;
    right: 16px;
    bottom: 16px;

    display: flex;
    align-items: center;
    gap: 8px;

    font-family: monospace;
    font-size: 12px;
}

#iterations {
    width: 80px;
    padding: 5px 7px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.6);
    color: white;

    outline: none;
}

#reset {
    padding: 6px 10px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.6);
    color: rgba(255,255,255,.8);

    cursor: pointer;
}

#reset:hover {
    background: rgba(255,255,255,.1);
}

/*
    計算全体の進捗

    画面下端に極細のラインとして表示。
*/
#progress {
    position: fixed;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    pointer-events: none;

    opacity: 0;
    transition: opacity .25s ease;
}

#progress.active {
    opacity: 1;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: rgba(255,255,255,.8);

    transition: width .08s linear;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom: <span id="zoom">1×</span></div>
    <div>Iterations: <span id="iterationText">500</span></div>
</div>

<div id="controls">
    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
        inputmode="numeric"
    >

    <button id="reset">Reset</button>
</div>

<div id="progress">
    <div id="progressBar"></div>
</div>


<script>
"use strict";

/* =========================================================
   Canvas / WebGL
========================================================= */

const canvas = document.getElementById("canvas");

const gl = canvas.getContext("webgl2", {
    antialias: false,
    powerPreference: "high-performance"
});

if (!gl) {
    alert("WebGL2 is not supported on this device.");
    throw new Error("WebGL2 unavailable");
}


/* =========================================================
   UI
========================================================= */

const zoomText = document.getElementById("zoom");
const iterationText = document.getElementById("iterationText");
const iterationsInput = document.getElementById("iterations");

const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");

const resetButton = document.getElementById("reset");


/* =========================================================
   State
========================================================= */

let centerX = -0.75;
let centerY = 0.0;

let zoom = 1.0;

let maxIterations = 500;


/*
    WebGLの描画倍率。

    1.0 = 全解像度
    0.5 = 半分の解像度
    0.25 = 1/4解像度
*/
let renderScale = 1.0;


/*
    現在の描画世代。

    新しい操作が始まったら番号を更新して、
    古いタイマーなどを無効化する。
*/
let renderVersion = 0;

let qualityTimer = null;


/* =========================================================
   Quality settings
========================================================= */

/*
    操作中
*/
const MOVING_SCALE = 0.35;
const MOVING_ITERATION_RATE = 0.25;


/*
    操作停止直後
*/
const MEDIUM_SCALE = 0.60;
const MEDIUM_ITERATION_RATE = 0.50;


/*
    最終
*/
const FINAL_SCALE = 1.0;
const FINAL_ITERATION_RATE = 1.0;


/* =========================================================
   Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;


const fragmentShaderSource = `#version 300 es

precision highp float;

out vec4 outColor;

uniform vec2 u_resolution;

uniform vec2 u_center;

uniform float u_zoom;

uniform int u_iterations;


/*
    Smooth coloring
*/
vec3 palette(float t) {

    /*
        黒 → 青 → 紫 → オレンジ系
    */

    vec3 a = vec3(0.0, 0.0, 0.0);
    vec3 b = vec3(0.35, 0.25, 0.5);
    vec3 c = vec3(0.8, 0.7, 0.5);
    vec3 d = vec3(0.1, 0.2, 0.3);

    return a + b * cos(
        6.28318 * (c * t + d)
    );
}


void main() {

    /*
        画面の中心を原点にする。

        aspect ratioも考慮。
    */

    vec2 p = gl_FragCoord.xy;

    vec2 uv =
        (p - 0.5 * u_resolution)
        / min(u_resolution.x, u_resolution.y);


    /*
        zoomが大きいほど見る範囲を狭くする。
    */

    vec2 c = u_center + uv / u_zoom;


    /*
        Mandelbrot
    */

    vec2 z = vec2(0.0);

    int i;

    float smoothIteration = 0.0;

    for (i = 0; i < u_iterations; i++) {

        float x = z.x;
        float y = z.y;

        z = vec2(
            x * x - y * y + c.x,
            2.0 * x * y + c.y
        );

        float magnitudeSquared = dot(z, z);

        if (magnitudeSquared > 256.0) {

            /*
                Continuous / smooth coloring
            */

            float logZn =
                log(magnitudeSquared) * 0.5;

            float nu =
                log(logZn / log(2.0)) / log(2.0);

            smoothIteration =
                float(i) + 1.0 - nu;

            break;
        }
    }


    /*
        Set内部
    */

    if (i == u_iterations) {
        outColor = vec4(0.0, 0.0, 0.0, 1.0);
        return;
    }


    /*
        Coloring
    */

    float t =
        smoothIteration / float(u_iterations);

    t = pow(t, 0.35);

    vec3 color = palette(t);

    outColor = vec4(color, 1.0);
}
`;


/* =========================================================
   Shader utilities
========================================================= */

function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {

        const log = gl.getShaderInfoLog(shader);

        gl.deleteShader(shader);

        throw new Error(log);
    }

    return shader;
}


function createProgram(vertexSource, fragmentSource) {

    const vertexShader =
        createShader(gl.VERTEX_SHADER, vertexSource);

    const fragmentShader =
        createShader(gl.FRAGMENT_SHADER, fragmentSource);

    const program = gl.createProgram();

    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);

    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {

        const log = gl.getProgramInfoLog(program);

        throw new Error(log);
    }

    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);

    return program;
}


const program =
    createProgram(
        vertexShaderSource,
        fragmentShaderSource
    );

gl.useProgram(program);


/* =========================================================
   Full-screen triangle
========================================================= */

/*
    画面全体を覆う三角形。

    これを1枚描くだけで、
    Fragment Shaderが画面全ピクセルを処理する。
*/

const vertices = new Float32Array([
    -1, -1,
     3, -1,
    -1,  3
]);

const buffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);

const positionLocation =
    gl.getAttribLocation(program, "a_position");

gl.enableVertexAttribArray(positionLocation);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniforms
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(program, "u_resolution");

const centerLocation =
    gl.getUniformLocation(program, "u_center");

const zoomLocation =
    gl.getUniformLocation(program, "u_zoom");

const iterationsLocation =
    gl.getUniformLocation(program, "u_iterations");


/* =========================================================
   Resize
========================================================= */

function resizeCanvas() {

    /*
        devicePixelRatioをそのまま使うと
        iPadなどで非常に重くなる可能性がある。

        最大2倍まで。
    */

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    const width =
        Math.floor(canvas.clientWidth * dpr);

    const height =
        Math.floor(canvas.clientHeight * dpr);

    if (
        canvas.width !== width ||
        canvas.height !== height
    ) {

        canvas.width = width;
        canvas.height = height;
    }

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Progress
========================================================= */

function setProgress(value) {

    value = Math.max(
        0,
        Math.min(1, value)
    );

    progressBar.style.width =
        `${value * 100}%`;

    progress.classList.add("active");
}


function finishProgress() {

    progressBar.style.width = "100%";

    setTimeout(() => {

        progress.classList.remove("active");

    }, 250);
}


/*
    計算量の概算。

    GPU内部の正確な実行時間は取得できないので、

        ピクセル数 × iterations

    を計算量として扱う。
*/
function estimatedWork(scale, iterationRate) {

    const pixels =
        canvas.width *
        canvas.height *
        scale *
        scale;

    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations * iterationRate
            )
        );

    return pixels * iterations;
}


/* =========================================================
   Render
========================================================= */

function render(scale, iterationRate, progressStart, progressEnd) {

    resizeCanvas();

    renderScale = scale;

    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations * iterationRate
            )
        );


    /*
        低解像度レンダリング

        viewportを小さくすることで、
        Fragment Shaderの呼び出し数自体を減らす。
    */

    const renderWidth =
        Math.max(
            1,
            Math.floor(canvas.width * scale)
        );

    const renderHeight =
        Math.max(
            1,
            Math.floor(canvas.height * scale)
        );


    gl.viewport(
        0,
        0,
        renderWidth,
        renderHeight
    );


    gl.useProgram(program);


    gl.uniform2f(
        resolutionLocation,
        renderWidth,
        renderHeight
    );


    gl.uniform2f(
        centerLocation,
        centerX,
        centerY
    );


    gl.uniform1f(
        zoomLocation,
        zoom
    );


    gl.uniform1i(
        iterationsLocation,
        iterations
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    /*
        元のcanvasサイズへ戻す。
    */

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        この段階の計算が完了したので
        全体進捗を更新。
    */

    setProgress(progressEnd);
}


/* =========================================================
   Full render pipeline
========================================================= */

function renderMoving() {

    renderVersion++;

    clearTimeout(qualityTimer);

    resizeCanvas();

    setProgress(0);

    render(
        MOVING_SCALE,
        MOVING_ITERATION_RATE,
        0,
        0.20
    );
}


function scheduleHighQuality() {

    const version = renderVersion;

    clearTimeout(qualityTimer);

    qualityTimer = setTimeout(() => {

        if (version !== renderVersion) {
            return;
        }


        /*
            実際の計算量から、
            各段階の全体に対する割合を算出。
        */

        const movingWork =
            estimatedWork(
                MOVING_SCALE,
                MOVING_ITERATION_RATE
            );

        const mediumWork =
            estimatedWork(
                MEDIUM_SCALE,
                MEDIUM_ITERATION_RATE
            );

        const finalWork =
            estimatedWork(
                FINAL_SCALE,
                FINAL_ITERATION_RATE
            );


        const totalWork =
            movingWork +
            mediumWork +
            finalWork;


        const movingEnd =
            movingWork / totalWork;


        const mediumEnd =
            (movingWork + mediumWork)
            / totalWork;


        /*
            中間品質
        */

        render(
            MEDIUM_SCALE,
            MEDIUM_ITERATION_RATE,
            movingEnd,
            mediumEnd
        );


        if (version !== renderVersion) {
            return;
        }


        /*
            ブラウザに中間画像を表示する時間を
            少し与える。
        */

        setTimeout(() => {

            if (version !== renderVersion) {
                return;
            }


            /*
                最終品質
            */

            render(
                FINAL_SCALE,
                FINAL_ITERATION_RATE,
                mediumEnd,
                1.0
            );


            if (version === renderVersion) {

                finishProgress();
            }

        }, 50);

    }, 100);
}


/* =========================================================
   Complete render
========================================================= */

function renderFinalImmediately() {

    renderVersion++;

    clearTimeout(qualityTimer);

    resizeCanvas();

    setProgress(0);

    render(
        FINAL_SCALE,
        FINAL_ITERATION_RATE,
        0,
        1
    );

    finishProgress();
}


/* =========================================================
   Zoom
========================================================= */

function zoomAt(screenX, screenY, factor) {

    resizeCanvas();


    /*
        現在の画面座標を
        複素平面上の座標へ変換。
    */

    const rect =
        canvas.getBoundingClientRect();

    const x =
        screenX - rect.left;

    const y =
        screenY - rect.top;


    const scale =
        Math.min(
            canvas.width,
            canvas.height
        );


    const worldX =
        centerX +
        (x - rect.width / 2)
        / scale
        / zoom;


    const worldY =
        centerY +
        (rect.height / 2 - y)
        / scale
        / zoom;


    /*
        zoom
    */

    zoom *= factor;


    /*
        マウスポインタ位置を
        同じ複素平面座標に固定。
    */

    centerX =
        worldX -
        (x - rect.width / 2)
        / scale
        / zoom;


    centerY =
        worldY -
        (rect.height / 2 - y)
        / scale
        / zoom;


    updateInfo();

    renderMoving();

    scheduleHighQuality();
}


/* =========================================================
   Mouse
========================================================= */

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;


canvas.addEventListener("mousedown", e => {

    dragging = true;

    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    renderVersion++;

    clearTimeout(qualityTimer);

    setProgress(0);
});


window.addEventListener("mousemove", e => {

    if (!dragging) {
        return;
    }


    const dx =
        e.clientX - lastMouseX;

    const dy =
        e.clientY - lastMouseY;


    const scale =
        Math.min(
            canvas.clientWidth,
            canvas.clientHeight
        );


    centerX -=
        dx / scale / zoom;

    centerY +=
        dy / scale / zoom;


    lastMouseX = e.clientX;
    lastMouseY = e.clientY;


    updateInfo();

    renderMoving();
});


window.addEventListener("mouseup", () => {

    if (!dragging) {
        return;
    }

    dragging = false;

    scheduleHighQuality();
});


canvas.addEventListener("wheel", e => {

    e.preventDefault();

    const factor =
        Math.exp(
            -e.deltaY * 0.0015
        );

    zoomAt(
        e.clientX,
        e.clientY,
        factor
    );

}, { passive: false });


/* =========================================================
   Touch / iPad
========================================================= */

let touches = new Map();

let pinchStartDistance = 0;
let pinchStartZoom = 1;

let pinchCenterX = 0;
let pinchCenterY = 0;


function distance(a, b) {

    const dx = a.clientX - b.clientX;
    const dy = a.clientY - b.clientY;

    return Math.hypot(dx, dy);
}


function midpoint(a, b) {

    return {
        x: (a.clientX + b.clientX) / 2,
        y: (a.clientY + b.clientY) / 2
    };
}


canvas.addEventListener("touchstart", e => {

    e.preventDefault();

    for (const touch of e.changedTouches) {
        touches.set(touch.identifier, touch);
    }


    renderVersion++;

    clearTimeout(qualityTimer);

    setProgress(0);


    if (touches.size === 2) {

        const [a, b] =
            [...touches.values()];

        pinchStartDistance =
            distance(a, b);

        pinchStartZoom =
            zoom;

        const mid =
            midpoint(a, b);

        pinchCenterX = mid.x;
        pinchCenterY = mid.y;
    }

}, { passive: false });


canvas.addEventListener("touchmove", e => {

    e.preventDefault();

    for (const touch of e.changedTouches) {
        touches.set(touch.identifier, touch);
    }


    if (touches.size === 1) {

        const touch =
            [...touches.values()][0];

        if (!touch._lastX) {

            touch._lastX =
                touch.clientX;

            touch._lastY =
                touch.clientY;

            return;
        }


        const dx =
            touch.clientX - touch._lastX;

        const dy =
            touch.clientY - touch._lastY;


        const scale =
            Math.min(
                canvas.clientWidth,
                canvas.clientHeight
            );


        centerX -=
            dx / scale / zoom;

        centerY +=
            dy / scale / zoom;


        touch._lastX =
            touch.clientX;

        touch._lastY =
            touch.clientY;


        updateInfo();

        renderMoving();

    }
    else if (touches.size === 2) {

        const [a, b] =
            [...touches.values()];


        const currentDistance =
            distance(a, b);


        if (pinchStartDistance > 0) {

            const factor =
                currentDistance /
                pinchStartDistance;


            zoom =
                pinchStartZoom * factor;


            updateInfo();

            renderMoving();
        }
    }

}, { passive: false });


canvas.addEventListener("touchend", e => {

    e.preventDefault();

    for (const touch of e.changedTouches) {
        touches.delete(touch.identifier);
    }


    if (touches.size === 0) {

        scheduleHighQuality();
    }

}, { passive: false });


canvas.addEventListener("touchcancel", e => {

    touches.clear();

    scheduleHighQuality();

}, { passive: false });


/* =========================================================
   Iterations
========================================================= */

iterationsInput.addEventListener("change", () => {

    let value =
        parseInt(
            iterationsInput.value,
            10
        );


    if (!Number.isFinite(value)) {
        value = 500;
    }


    value =
        Math.max(
            1,
            Math.min(
                100000,
                value
            )
        );


    maxIterations = value;

    iterationsInput.value = value;

    iterationText.textContent = value;


    renderFinalImmediately();
});


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener("click", () => {

    centerX = -0.75;
    centerY = 0.0;
    zoom = 1.0;

    updateInfo();

    renderFinalImmediately();
});


/* =========================================================
   UI
========================================================= */

function updateInfo() {

    if (zoom >= 1000000) {

        zoomText.textContent =
            zoom.toExponential(2) + "×";

    }
    else {

        zoomText.textContent =
            zoom.toFixed(
                zoom < 100
                    ? 2
                    : 0
            ) + "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Resize
========================================================= */

window.addEventListener("resize", () => {

    resizeCanvas();

    renderFinalImmediately();
});


/* =========================================================
   Start
========================================================= */

resizeCanvas();

updateInfo();

renderFinalImmediately();

</script>

</body>
</html>
