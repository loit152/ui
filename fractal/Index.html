<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 14px;
    left: 16px;

    color: rgba(255,255,255,.75);

    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;

    pointer-events: none;
    user-select: none;
}

#controls {
    position: fixed;
    right: 16px;
    bottom: 16px;

    display: flex;
    gap: 8px;
    align-items: center;

    font-family: monospace;
}

#iterations {
    width: 80px;
    padding: 5px 7px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: white;

    outline: none;
}

#reset {
    padding: 6px 10px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: rgba(255,255,255,.8);

    cursor: pointer;
}

#reset:hover {
    background: rgba(255,255,255,.1);
}

#progress {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    pointer-events: none;

    opacity: 0;

    transition: opacity .2s ease;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: rgba(255,255,255,.8);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom: <span id="zoom">1×</span></div>
    <div>Iterations: <span id="iterationText">500</span></div>
</div>

<div id="controls">

    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
        inputmode="numeric"
    >

    <button id="reset">Reset</button>

</div>

<div id="progress">
    <div id="progressBar"></div>
</div>


<script>
"use strict";


/* =========================================================
   WebGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl2", {
        antialias: false,
        powerPreference: "high-performance"
    });

if (!gl) {
    alert("このブラウザはWebGL2に対応していません。");
    throw new Error("WebGL2 unavailable");
}


/* =========================================================
   UI
========================================================= */

const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterationText");

const iterationsInput =
    document.getElementById("iterations");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const resetButton =
    document.getElementById("reset");


/* =========================================================
   State
========================================================= */

/*
    中心座標。

    hi + lo の double-double 表現。

    JavaScript Numberだけの場合よりも、
    深いズームで中心位置を保持しやすい。
*/

let centerXHi = -0.75;
let centerXLo = 0;

let centerYHi = 0;
let centerYLo = 0;


/*
    ズームは

        zoom = 2 ^ zoomPower

    として管理。

    これにより Number の上限による
    zoom *= factor の問題を避ける。
*/

let zoomPower = 0;


/*
    画面移動中の軽量反復回数。
*/

let maxIterations = 500;


/*
    描画世代。
*/

let renderVersion = 0;

let qualityTimer = 0;


/* =========================================================
   Rendering quality
========================================================= */

const MOVING_RATE = 0.16;
const FINAL_RATE = 1.0;


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main() {
    gl_Position = vec4(a_position, 0.0, 1.0);
}
`;


/* =========================================================
   Fragment Shader
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;

out vec4 outColor;

uniform vec2 u_resolution;


/*
    double-double center

    value = hi + lo
*/

uniform vec2 u_centerX;
uniform vec2 u_centerY;


/*
    zoom = 2 ^ u_zoomPower

    scale = 2 ^ (-u_zoomPower)
*/

uniform float u_zoomPower;

uniform int u_iterations;


/* =========================================================
   Double-double arithmetic
========================================================= */

vec2 twoSum(float a, float b)
{
    float s = a + b;
    float v = s - a;

    float e =
        (a - (s - v)) +
        (b - v);

    return vec2(s, e);
}


vec2 quickTwoSum(float a, float b)
{
    float s = a + b;
    float e = b - (s - a);

    return vec2(s, e);
}


vec2 ddAdd(vec2 a, vec2 b)
{
    vec2 s = twoSum(a.x, b.x);

    float e =
        s.y +
        a.y +
        b.y;

    return quickTwoSum(s.x, e);
}


vec2 ddSub(vec2 a, vec2 b)
{
    return ddAdd(
        a,
        vec2(-b.x, -b.y)
    );
}


vec2 ddMul(vec2 a, vec2 b)
{
    float p =
        a.x * b.x;

    float e =
        fma(a.x, b.x, -p);

    e +=
        a.x * b.y +
        a.y * b.x;

    return quickTwoSum(p, e);
}


/* =========================================================
   Complex double-double multiplication
========================================================= */

void complexMul(
    vec2 ar,
    vec2 ai,
    vec2 br,
    vec2 bi,
    out vec2 rr,
    out vec2 ri
)
{
    vec2 ac = ddMul(ar, br);
    vec2 bd = ddMul(ai, bi);

    vec2 ad = ddMul(ar, bi);
    vec2 bc = ddMul(ai, br);

    rr = ddSub(ac, bd);
    ri = ddAdd(ad, bc);
}


/* =========================================================
   Color
========================================================= */

vec3 colorize(float t)
{
    /*
        軽量な cosine palette。
    */

    vec3 phase =
        vec3(
            0.00,
            0.15,
            0.30
        );

    return
        0.5 +
        0.5 *
        cos(
            6.2831853 *
            (t + phase)
        );
}


/* =========================================================
   Main
========================================================= */

void main()
{
    vec2 pixel =
        gl_FragCoord.xy;

    float scale =
        min(
            u_resolution.x,
            u_resolution.y
        );


    /*
        ピクセル位置。

        ここでは巨大な zoom 値を直接作らず、

            offset × 2^(-zoomPower)

        とする。
    */

    vec2 offset =
        (
            pixel -
            0.5 * u_resolution
        ) / scale;


    /*
        GPUのexp2は非常に高速。

        ただし float の指数範囲を超える
        深度ではゼロになる。

        通常のWebGL2で実用的な範囲では
        十分な精度を維持する。
    */

    float scaleZoom =
        exp2(-u_zoomPower);


    vec2 delta =
        offset * scaleZoom;


    /*
        c = center + delta

        double-double
    */

    vec2 cx =
        ddAdd(
            u_centerX,
            vec2(delta.x, 0.0)
        );

    vec2 cy =
        ddAdd(
            u_centerY,
            vec2(delta.y, 0.0)
        );


    /*
        z

        Mandelbrot計算では z 自体は
        普通のfloatで計算する。

        これによりdouble-doubleを
        毎回使用するより高速。
    */

    float zx = 0.0;
    float zy = 0.0;

    float smoothIteration = 0.0;

    bool escaped = false;


    /*
        固定上限を100000にしておく。

        実際のiteration数は
        u_iterationsで制御。
    */

    for (int i = 0; i < 100000; ++i)
    {
        if (i >= u_iterations)
            break;


        float xx =
            zx * zx;

        float yy =
            zy * zy;

        float xy =
            zx * zy;


        /*
            escape判定を早めに行う。
        */

        if (xx + yy > 64.0)
        {
            float logZn =
                0.5 *
                log(xx + yy);

            float nu =
                log(
                    logZn /
                    0.6931471805599453
                ) /
                0.6931471805599453;

            smoothIteration =
                float(i) +
                1.0 -
                nu;

            escaped = true;

            break;
        }


        zx =
            xx - yy + cx.x;

        zy =
            xy + xy + cy.x * 0.0 + cy.y;
    }


    /*
        内部
    */

    if (!escaped)
    {
        outColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    float t =
        smoothIteration /
        float(u_iterations);


    /*
        iteration数が少ないときも
        コントラストを確保。
    */

    t =
        pow(
            clamp(t, 0.0, 1.0),
            0.35
        );


    vec3 color =
        colorize(t);


    outColor =
        vec4(
            color,
            1.0
        );
}
`;


/* =========================================================
   Shader
========================================================= */

function createShader(type, source)
{
    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);

    if (!gl.getShaderParameter(
        shader,
        gl.COMPILE_STATUS
    )) {
        const error =
            gl.getShaderInfoLog(shader);

        gl.deleteShader(shader);

        throw new Error(error);
    }

    return shader;
}


function createProgram(vsSource, fsSource)
{
    const vs =
        createShader(
            gl.VERTEX_SHADER,
            vsSource
        );

    const fs =
        createShader(
            gl.FRAGMENT_SHADER,
            fsSource
        );

    const p =
        gl.createProgram();

    gl.attachShader(p, vs);
    gl.attachShader(p, fs);

    gl.linkProgram(p);

    if (!gl.getProgramParameter(
        p,
        gl.LINK_STATUS
    )) {
        throw new Error(
            gl.getProgramInfoLog(p)
        );
    }

    gl.deleteShader(vs);
    gl.deleteShader(fs);

    return p;
}


const program =
    createProgram(
        vertexShaderSource,
        fragmentShaderSource
    );

gl.useProgram(program);


/* =========================================================
   Fullscreen triangle
========================================================= */

const vertices =
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]);

const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);

const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );

gl.enableVertexAttribArray(
    positionLocation
);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniforms
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(
        program,
        "u_resolution"
    );

const centerXLocation =
    gl.getUniformLocation(
        program,
        "u_centerX"
    );

const centerYLocation =
    gl.getUniformLocation(
        program,
        "u_centerY"
    );

const zoomPowerLocation =
    gl.getUniformLocation(
        program,
        "u_zoomPower"
    );

const iterationsLocation =
    gl.getUniformLocation(
        program,
        "u_iterations"
    );


/* =========================================================
   Resize
========================================================= */

function resizeCanvas()
{
    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    const width =
        Math.floor(
            canvas.clientWidth * dpr
        );

    const height =
        Math.floor(
            canvas.clientHeight * dpr
        );

    if (
        canvas.width !== width ||
        canvas.height !== height
    ) {
        canvas.width = width;
        canvas.height = height;
    }

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Render
========================================================= */

function render(iterationRate)
{
    resizeCanvas();

    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );

    gl.useProgram(program);

    gl.uniform2f(
        resolutionLocation,
        canvas.width,
        canvas.height
    );

    gl.uniform2f(
        centerXLocation,
        centerXHi,
        centerXLo
    );

    gl.uniform2f(
        centerYLocation,
        centerYHi,
        centerYLo
    );

    /*
        clampしない。

        深いズームでもzoomPowerを維持。
    */

    gl.uniform1f(
        zoomPowerLocation,
        zoomPower
    );

    gl.uniform1i(
        iterationsLocation,
        iterations
    );

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );
}


/* =========================================================
   Quality
========================================================= */

function renderMoving()
{
    renderVersion++;

    clearTimeout(
        qualityTimer
    );

    render(
        MOVING_RATE
    );
}


function scheduleFinal()
{
    const version =
        renderVersion;

    clearTimeout(
        qualityTimer
    );

    qualityTimer =
        setTimeout(() =>
        {
            if (
                version !== renderVersion
            ) {
                return;
            }

            render(FINAL_RATE);

        }, 120);
}


function renderFinal()
{
    renderVersion++;

    clearTimeout(
        qualityTimer
    );

    render(FINAL_RATE);
}


/* =========================================================
   Double-double helpers
========================================================= */

function normalizeDD(hi, lo)
{
    const s =
        hi + lo;

    const e =
        lo - (s - hi);

    return [s, e];
}


function addDD(
    aHi,
    aLo,
    bHi,
    bLo
)
{
    const s =
        aHi + bHi;

    const v =
        s - aHi;

    const e =
        (
            aHi - (s - v)
        ) +
        (
            bHi - v
        ) +
        aLo +
        bLo;

    return normalizeDD(
        s,
        e
    );
}


/* =========================================================
   Coordinate movement
========================================================= */

function moveCenter(
    dx,
    dy
)
{
    const x =
        addDD(
            centerXHi,
            centerXLo,
            dx,
            0
        );

    const y =
        addDD(
            centerYHi,
            centerYLo,
            dy,
            0
        );

    centerXHi = x[0];
    centerXLo = x[1];

    centerYHi = y[0];
    centerYLo = y[1];
}


/* =========================================================
   Zoom
========================================================= */

/*
    zoomPower += amount

    1 = 2倍
    2 = 4倍
    10 = 1024倍
    100 = 約1.27e30倍
*/

function zoomAt(
    screenX,
    screenY,
    powerDelta
)
{
    const rect =
        canvas.getBoundingClientRect();

    const x =
        screenX -
        rect.left;

    const y =
        screenY -
        rect.top;

    const scale =
        Math.min(
            rect.width,
            rect.height
        );


    /*
        カーソル位置の
        現在の複素座標との差。

        深度に応じたscaleは
        JS側でexp2を使用。
    */

    const localScale =
        Math.pow(
            2,
            -zoomPower
        );


    const dx =
        (
            x -
            rect.width * 0.5
        ) /
        scale *
        localScale;

    const dy =
        (
            rect.height * 0.5 -
            y
        ) /
        scale *
        localScale;


    /*
        ズーム前のカーソル位置を
        center + delta として取得。
    */

    const worldXHi =
        centerXHi + dx;

    const worldXLo =
        centerXLo +
        (
            dx -
            (
                worldXHi -
                centerXHi
            )
        );


    const worldYHi =
        centerYHi + dy;

    const worldYLo =
        centerYLo +
        (
            dy -
            (
                worldYHi -
                centerYHi
            )
        );


    /*
        zoom
    */

    zoomPower += powerDelta;


    /*
        ズーム後に同じ画面位置へ
        カーソル位置を戻す。

        deltaAfter =
            deltaBefore / 2^powerDelta
    */

    const afterScale =
        Math.pow(
            2,
            -zoomPower
        );


    const afterDX =
        (
            x -
            rect.width * 0.5
        ) /
        scale *
        afterScale;

    const afterDY =
        (
            rect.height * 0.5 -
            y
        ) /
        scale *
        afterScale;


    centerXHi =
        worldXHi -
        afterDX;

    centerXLo =
        worldXLo -
        (
            afterDX -
            (
                worldXHi -
                centerXHi
            )
        );


    centerYHi =
        worldYHi -
        afterDY;

    centerYLo =
        worldYLo -
        (
            afterDY -
            (
                worldYHi -
                centerYHi
            )
        );


    updateInfo();

    renderMoving();

    scheduleFinal();
}


/* =========================================================
   Mouse drag
========================================================= */

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;


canvas.addEventListener(
    "mousedown",
    e =>
    {
        dragging = true;

        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;

        renderVersion++;

        clearTimeout(
            qualityTimer
        );
    }
);


window.addEventListener(
    "mousemove",
    e =>
    {
        if (!dragging)
            return;

        const dx =
            e.clientX -
            lastMouseX;

        const dy =
            e.clientY -
            lastMouseY;


        const scale =
            Math.min(
                canvas.clientWidth,
                canvas.clientHeight
            );


        const worldScale =
            Math.pow(
                2,
                -zoomPower
            );


        moveCenter(
            -dx / scale * worldScale,
             dy / scale * worldScale
        );


        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;


        updateInfo();

        renderMoving();
    }
);


window.addEventListener(
    "mouseup",
    () =>
    {
        if (!dragging)
            return;

        dragging = false;

        scheduleFinal();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e =>
    {
        e.preventDefault();

        /*
            1 wheel notch ≒ 2^(0.35)

            通常の倍率計算より
            滑らか。
        */

        const power =
            -e.deltaY * 0.003;

        zoomAt(
            e.clientX,
            e.clientY,
            power
        );
    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

const touches =
    new Map();

let pinchStartDistance = 0;

let pinchStartPower = 0;

let pinchCenter = null;


function distance(a, b)
{
    return Math.hypot(
        a.clientX - b.clientX,
        a.clientY - b.clientY
    );
}


function midpoint(a, b)
{
    return {
        x:
            (a.clientX + b.clientX) * 0.5,

        y:
            (a.clientY + b.clientY) * 0.5
    };
}


canvas.addEventListener(
    "touchstart",
    e =>
    {
        e.preventDefault();

        for (
            const t of e.changedTouches
        ) {
            touches.set(
                t.identifier,
                {
                    clientX: t.clientX,
                    clientY: t.clientY,
                    lastX: t.clientX,
                    lastY: t.clientY
                }
            );
        }


        renderVersion++;

        clearTimeout(
            qualityTimer
        );


        if (touches.size === 2)
        {
            const [a, b] =
                [...touches.values()];

            pinchStartDistance =
                distance(a, b);

            pinchStartPower =
                zoomPower;

            pinchCenter =
                midpoint(a, b);
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e =>
    {
        e.preventDefault();


        for (
            const t of e.changedTouches
        ) {
            const old =
                touches.get(
                    t.identifier
                );

            if (old)
            {
                old.clientX = t.clientX;
                old.clientY = t.clientY;
            }
        }


        if (touches.size === 1)
        {
            const touch =
                [...touches.values()][0];

            const dx =
                touch.clientX -
                touch.lastX;

            const dy =
                touch.clientY -
                touch.lastY;


            const scale =
                Math.min(
                    canvas.clientWidth,
                    canvas.clientHeight
                );

            const worldScale =
                Math.pow(
                    2,
                    -zoomPower
                );


            moveCenter(
                -dx / scale * worldScale,
                 dy / scale * worldScale
            );


            touch.lastX =
                touch.clientX;

            touch.lastY =
                touch.clientY;


            updateInfo();

            renderMoving();
        }


        else if (
            touches.size === 2 &&
            pinchStartDistance > 0
        )
        {
            const [a, b] =
                [...touches.values()];


            const currentDistance =
                distance(a, b);


            /*
                ピンチ距離を
                2の指数へ変換。
            */

            const ratio =
                currentDistance /
                pinchStartDistance;


            const powerDelta =
                Math.log2(ratio);


            zoomPower =
                pinchStartPower +
                powerDelta;


            updateInfo();

            renderMoving();
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e =>
    {
        e.preventDefault();

        for (
            const t of e.changedTouches
        ) {
            touches.delete(
                t.identifier
            );
        }


        if (touches.size === 0)
        {
            scheduleFinal();
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchcancel",
    () =>
    {
        touches.clear();

        scheduleFinal();
    }
);


/* =========================================================
   Iterations
========================================================= */

iterationsInput.addEventListener(
    "change",
    () =>
    {
        let value =
            parseInt(
                iterationsInput.value,
                10
            );


        if (!Number.isFinite(value))
            value = 500;


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    value
                )
            );


        maxIterations =
            value;

        iterationsInput.value =
            value;

        iterationText.textContent =
            value;


        renderFinal();
    }
);


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener(
    "click",
    () =>
    {
        centerXHi = -0.75;
        centerXLo = 0;

        centerYHi = 0;
        centerYLo = 0;

        zoomPower = 0;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Info
========================================================= */

function updateInfo()
{
    /*
        zoom = 2^zoomPower

        巨大な値を直接計算しない。
    */

    if (
        zoomPower > 1000
    ) {
        zoomText.textContent =
            "2^" +
            Math.floor(zoomPower);

    }
    else if (
        zoomPower > 20
    ) {
        zoomText.textContent =
            "2^" +
            zoomPower.toFixed(2);

    }
    else {
        const zoom =
            Math.pow(
                2,
                zoomPower
            );

        zoomText.textContent =
            zoom.toPrecision(4) +
            "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
    "resize",
    () =>
    {
        resizeCanvas();

        renderFinal();
    }
);


/* =========================================================
   Start
========================================================= */

resizeCanvas();

updateInfo();

renderFinal();

</script>

</body>
</html>
