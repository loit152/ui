<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Mandelbrot Explorer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: #fff;

    font-family: monospace;
}

#canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    cursor: grab;

    touch-action: none;
}

#canvas.dragging {
    cursor: grabbing;
}

#info {

    position: fixed;

    top: 10px;
    left: 10px;

    padding: 8px 10px;

    background:
        rgba(0, 0, 0, 0.65);

    border:
        1px solid
        rgba(255,255,255,0.2);

    font-size: 12px;

    line-height: 1.5;

    pointer-events: none;

    user-select: none;

    z-index: 10;
}

#progressBox {

    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 10px;

    height: 4px;

    background:
        rgba(255,255,255,0.15);

    pointer-events: none;

    z-index: 10;
}

#progress {

    width: 0%;
    height: 100%;

    background: white;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">

    <div>
        MODE:
        <span id="mode">READY</span>
    </div>

    <div>
        ZOOM:
        <span id="zoom">1</span>
    </div>

    <div>
        X:
        <span id="cx">-0.75</span>
    </div>

    <div>
        Y:
        <span id="cy">0</span>
    </div>

    <div>
        PRECISION:
        <span id="precision">50</span>
    </div>

    <div>
        QUALITY:
        <span id="quality">100%</span>
    </div>

</div>

<div id="progressBox">
    <div id="progress"></div>
</div>


<script
src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js">
</script>


<script>

"use strict";


/* =====================================================
   Canvas
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });


/* =====================================================
   UI
===================================================== */

const modeElement =
    document.getElementById("mode");

const zoomElement =
    document.getElementById("zoom");

const cxElement =
    document.getElementById("cx");

const cyElement =
    document.getElementById("cy");

const precisionElement =
    document.getElementById("precision");

const qualityElement =
    document.getElementById("quality");

const progressElement =
    document.getElementById("progress");


/* =====================================================
   Decimal
===================================================== */

Decimal.set({
    precision: 80
});


/* =====================================================
   Mandelbrot state
===================================================== */

let centerX =
    new Decimal("-0.75");

let centerY =
    new Decimal("0");

let zoom =
    new Decimal("1");


/* =====================================================
   Canvas size
===================================================== */

let width = 0;
let height = 0;


/* =====================================================
   現在表示している完成画像
===================================================== */

let currentImage = null;


/* =====================================================
   描画世代
===================================================== */

let renderGeneration = 0;

let renderTimer = null;


/* =====================================================
   Drag
===================================================== */

let dragging = false;

let lastPointerX = 0;
let lastPointerY = 0;


/*
    現在表示されている画像を
    ドラッグ中にどれだけ移動したか。

    画像を再計算せず、
    見た目だけ移動させる。
*/

let visualOffsetX = 0;
let visualOffsetY = 0;


/* =====================================================
   Resize
===================================================== */

window.addEventListener(
    "resize",
    () => {

        width =
            canvas.width =
            window.innerWidth;

        height =
            canvas.height =
            window.innerHeight;

        cancelRender();

        currentImage = null;

        drawInitialPreview();

        scheduleRender();

    }
);


/* =====================================================
   Precision
===================================================== */

function updatePrecision() {

    /*
        ズーム倍率をDecimalのまま扱い、
        表示・座標計算の精度を確保する。
    */

    const magnitude =
        Math.max(
            0,
            zoom.log().div(10).toNumber()
        );

    const precision =
        Math.max(
            50,
            Math.ceil(
                40 + magnitude
            )
        );

    Decimal.set({
        precision:
            precision
    });

    precisionElement.textContent =
        precision;
}


/* =====================================================
   Plane
===================================================== */

function getPlane() {

    const aspect =
        new Decimal(width)
        .div(height);

    const planeHeight =
        new Decimal(4)
        .div(zoom);

    const planeWidth =
        planeHeight.mul(aspect);

    return {
        width: planeWidth,
        height: planeHeight
    };
}


/* =====================================================
   Screen → Complex
===================================================== */

function screenToComplex(
    px,
    py
) {

    const plane =
        getPlane();

    const dx =
        new Decimal(
            px - width / 2
        )
        .div(width)
        .mul(plane.width);

    const dy =
        new Decimal(
            py - height / 2
        )
        .div(height)
        .mul(plane.height);

    return {

        x:
            centerX.add(dx),

        y:
            centerY.add(dy)

    };
}


/* =====================================================
   高速 Mandelbrot
===================================================== */

function mandelbrot(
    cx,
    cy,
    maxIteration
) {

    /*
        ここではNumberを使用。

        Decimalを全反復で使うより
        大幅に高速。

        cx / cy 自体は高精度座標から
        必要な範囲をNumber化する。
    */

    let x = 0;
    let y = 0;

    let iteration = 0;

    while (
        iteration < maxIteration
    ) {

        const xx =
            x * x;

        const yy =
            y * y;

        if (
            xx + yy > 4
        ) {
            break;
        }

        const xy =
            x * y;

        x =
            xx - yy + cx;

        y =
            xy * 2 + cy;

        iteration++;
    }

    return iteration;
}


/* =====================================================
   Iteration
===================================================== */

function getMaxIteration() {

    const z =
        Math.max(
            0,
            zoom.log()
                .div(2)
                .toNumber()
        );

    return Math.min(
        800,
        Math.floor(
            100 + z * 25
        )
    );
}


/* =====================================================
   Color
===================================================== */

function getColor(
    iteration,
    maxIteration
) {

    if (
        iteration >= maxIteration
    ) {
        return 0;
    }

    /*
        現在は白黒。

        後から色付け可能。
    */

    return 255;
}


/* =====================================================
   画面を維持したまま描画
===================================================== */

function drawCurrentImage() {

    if (!currentImage) {
        return;
    }

    ctx.putImageData(
        currentImage,
        visualOffsetX,
        visualOffsetY
    );
}


/* =====================================================
   初期プレビュー
===================================================== */

function drawInitialPreview() {

    const image =
        ctx.createImageData(
            width,
            height
        );

    const data =
        image.data;

    /*
        最初だけ粗く計算。

        20px間隔なので軽い。
    */

    const step = 20;

    const plane =
        getPlane();

    /*
        Number化するのは
        画面1枚分の範囲だけ。

        座標そのものはDecimalで保持。
    */

    const scaleX =
        plane.width
            .div(width)
            .toNumber();

    const scaleY =
        plane.height
            .div(height)
            .toNumber();

    const baseX =
        centerX.toNumber();

    const baseY =
        centerY.toNumber();

    const maxIteration = 40;


    for (
        let py = 0;
        py < height;
        py += step
    ) {

        for (
            let px = 0;
            px < width;
            px += step
        ) {

            const cx =
                baseX +
                (px - width / 2)
                * scaleX;

            const cy =
                baseY +
                (py - height / 2)
                * scaleY;

            const iteration =
                mandelbrot(
                    cx,
                    cy,
                    maxIteration
                );

            const value =
                getColor(
                    iteration,
                    maxIteration
                );


            for (
                let y = py;
                y < Math.min(
                    py + step,
                    height
                );
                y++
            ) {

                for (
                    let x = px;
                    x < Math.min(
                        px + step,
                        width
                    );
                    x++
                ) {

                    const index =
                        (y * width + x) * 4;

                    data[index] =
                        value;

                    data[index + 1] =
                        value;

                    data[index + 2] =
                        value;

                    data[index + 3] =
                        255;
                }
            }
        }
    }

    currentImage =
        image;

    visualOffsetX = 0;
    visualOffsetY = 0;

    drawCurrentImage();
}


/* =====================================================
   描画キャンセル
===================================================== */

function cancelRender() {

    renderGeneration++;

    if (
        renderTimer !== null
    ) {

        clearTimeout(
            renderTimer
        );

        renderTimer = null;
    }
}


/* =====================================================
   Render予約
===================================================== */

function scheduleRender() {

    if (
        renderTimer !== null
    ) {

        clearTimeout(
            renderTimer
        );
    }

    renderTimer =
        setTimeout(
            () => {

                renderTimer =
                    null;

                renderHighQuality();

            },
            250
        );
}


/* =====================================================
   高画質描画
===================================================== */

async function renderHighQuality() {

    /*
        この描画だけが新しい画像を作る。

        現在の画像は最後まで残す。
    */

    cancelRender();

    const generation =
        renderGeneration;

    modeElement.textContent =
        "RENDERING";


    const maxIteration =
        getMaxIteration();

    updatePrecision();


    /*
        新しい画像。

        currentImageにはまだ入れない。
    */

    const newImage =
        ctx.createImageData(
            width,
            height
        );

    const data =
        newImage.data;


    /*
        高精度Decimalで
        画面座標系を作る。
    */

    const plane =
        getPlane();

    const scaleX =
        plane.width
            .div(width)
            .toNumber();

    const scaleY =
        plane.height
            .div(height)
            .toNumber();

    /*
        現在の中心を基準として
        1ピクセルごとの差分をNumberで処理。

        深いズームではここが
        Decimalを使うべき箇所になるため、
        次の段階でPerturbationを導入できる。
    */

    const baseX =
        centerX.toNumber();

    const baseY =
        centerY.toNumber();


    /*
        上からではなく、
        「8行ずつ」処理して
        ブラウザへ制御を返す。
    */

    const rowsPerBatch = 8;


    for (
        let py = 0;
        py < height;
        py += rowsPerBatch
    ) {

        /*
            操作されたら即終了。

            古い画像はそのまま残る。
        */

        if (
            generation !==
            renderGeneration
        ) {

            return;
        }


        const endY =
            Math.min(
                py + rowsPerBatch,
                height
            );


        for (
            let y = py;
            y < endY;
            y++
        ) {

            const cy =
                baseY +
                (y - height / 2)
                * scaleY;


            for (
                let x = 0;
                x < width;
                x++
            ) {

                const cx =
                    baseX +
                    (x - width / 2)
                    * scaleX;


                const iteration =
                    mandelbrot(
                        cx,
                        cy,
                        maxIteration
                    );


                const value =
                    getColor(
                        iteration,
                        maxIteration
                    );


                const index =
                    (y * width + x) * 4;


                data[index] =
                    value;

                data[index + 1] =
                    value;

                data[index + 2] =
                    value;

                data[index + 3] =
                    255;
            }
        }


        /*
            ここでは新しい画像を
            直接表示しない。

            進捗だけ表示する。
        */

        const percent =
            Math.floor(
                endY /
                height *
                100
            );

        progressElement.style.width =
            percent + "%";

        qualityElement.textContent =
            percent + "%";


        await nextFrame();
    }


    /*
        完成した瞬間にだけ
        currentImageを交換。
    */

    if (
        generation !==
        renderGeneration
    ) {
        return;
    }


    currentImage =
        newImage;

    visualOffsetX = 0;
    visualOffsetY = 0;

    drawCurrentImage();


    modeElement.textContent =
        "READY";

    progressElement.style.width =
        "100%";

    qualityElement.textContent =
        "100%";

    updateInfo();
}


/* =====================================================
   Frame
===================================================== */

function nextFrame() {

    return new Promise(
        resolve =>
            requestAnimationFrame(
                resolve
            )
    );
}


/* =====================================================
   Info
===================================================== */

function updateInfo() {

    zoomElement.textContent =
        formatDecimal(zoom);

    cxElement.textContent =
        formatDecimal(centerX);

    cyElement.textContent =
        formatDecimal(centerY);
}


function formatDecimal(value) {

    return value
        .toSignificantDigits(25)
        .toString();
}


/* =====================================================
   Pointer Down
===================================================== */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
            計算を即キャンセル。

            ただし画面は消さない。
        */

        cancelRender();

        dragging = true;

        canvas.classList.add(
            "dragging"
        );

        lastPointerX =
            event.clientX;

        lastPointerY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );

        modeElement.textContent =
            "MOVING";
    }
);


/* =====================================================
   Pointer Move
===================================================== */

canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging) {
            return;
        }


        const dx =
            event.clientX -
            lastPointerX;

        const dy =
            event.clientY -
            lastPointerY;


        lastPointerX =
            event.clientX;

        lastPointerY =
            event.clientY;


        /*
            ------------------------------------------------
            重要

            ここでは画像を再計算しない。

            既存画像をそのまま動かす。
            ------------------------------------------------
        */

        visualOffsetX += dx;
        visualOffsetY += dy;


        /*
            見た目だけ更新。
        */

        drawCurrentImage();


        /*
            実際の中心座標は
            Decimalで更新する。
        */

        const plane =
            getPlane();


        const moveX =
            new Decimal(dx)
            .div(width)
            .mul(plane.width);

        const moveY =
            new Decimal(dy)
            .div(height)
            .mul(plane.height);


        centerX =
            centerX.sub(moveX);

        centerY =
            centerY.sub(moveY);


        updateInfo();
    }
);


/* =====================================================
   Pointer Up
===================================================== */

canvas.addEventListener(
    "pointerup",
    event => {

        if (!dragging) {
            return;
        }


        dragging = false;

        canvas.classList.remove(
            "dragging"
        );


        canvas.releasePointerCapture(
            event.pointerId
        );


        /*
            ここで初めて
            粗い新画像を作る。
        */

        modeElement.textContent =
            "UPDATING";


        /*
            現在の画像の移動量をリセット。

            新しい座標を基準に
            プレビューを作る。
        */

        visualOffsetX = 0;
        visualOffsetY = 0;


        drawInitialPreview();


        /*
            250ms操作が止まったら
            高画質化。
        */

        scheduleRender();
    }
);


/* =====================================================
   Pointer Cancel
===================================================== */

canvas.addEventListener(
    "pointercancel",
    () => {

        if (!dragging) {
            return;
        }

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );

        visualOffsetX = 0;
        visualOffsetY = 0;

        drawInitialPreview();

        scheduleRender();
    }
);


/* =====================================================
   Wheel Zoom
===================================================== */

canvas.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        /*
            計算中でも即操作可能。
        */

        cancelRender();


        /*
            ズーム前の
            マウス位置の座標。
        */

        const before =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        /*
            ズーム。
        */

        const factor =
            event.deltaY < 0
                ? new Decimal(2)
                : new Decimal("0.5");


        zoom =
            zoom.mul(factor);


        updatePrecision();


        /*
            ズーム後。
        */

        const after =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        /*
            マウス位置を固定。
        */

        centerX =
            centerX.add(
                before.x.sub(
                    after.x
                )
            );

        centerY =
            centerY.add(
                before.y.sub(
                    after.y
                )
            );


        updateInfo();


        /*
            まず粗い画像。

            これで画面が黒くならない。
        */

        visualOffsetX = 0;
        visualOffsetY = 0;

        drawInitialPreview();


        /*
            操作が止まったら
            高画質化。
        */

        scheduleRender();
    },
    {
        passive: false
    }
);


/* =====================================================
   Double Click
===================================================== */

canvas.addEventListener(
    "dblclick",
    event => {

        cancelRender();


        const before =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        zoom =
            zoom.mul(2);


        const after =
            screenToComplex(
                event.clientX,
                event.clientY
            );


        centerX =
            centerX.add(
                before.x.sub(
                    after.x
                )
            );

        centerY =
            centerY.add(
                before.y.sub(
                    after.y
                )
            );


        updatePrecision();

        updateInfo();


        visualOffsetX = 0;
        visualOffsetY = 0;


        drawInitialPreview();

        scheduleRender();
    }
);


/* =====================================================
   初期化
===================================================== */

width =
    canvas.width =
    window.innerWidth;

height =
    canvas.height =
    window.innerHeight;


updatePrecision();

updateInfo();

drawInitialPreview();

scheduleRender();

</script>

</body>
</html>
