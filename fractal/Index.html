<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no"
>
<title>Mandelbrot WebGL</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 10px;
    left: 10px;

    color: white;
    font-family: monospace;
    font-size: 14px;

    pointer-events: none;
    user-select: none;
}

#controls {
    position: fixed;
    right: 10px;
    bottom: 15px;

    display: flex;
    gap: 6px;
    align-items: center;

    font-family: monospace;
}

#iterations {
    width: 80px;
    padding: 4px;

    background: black;
    color: white;

    border: 1px solid #666;
}

button {
    padding: 5px 10px;

    background: black;
    color: white;

    border: 1px solid #666;
}

button:active {
    background: #333;
}

#progress {
    position: fixed;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    background: #222;

    pointer-events: none;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: white;

    transition: width 0.05s linear;
}

#error {
    position: fixed;
    inset: 0;

    padding: 20px;

    background: black;
    color: #ff5555;

    font-family: monospace;
    font-size: 13px;

    white-space: pre-wrap;
    overflow: auto;

    display: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    Zoom: 1.00<br>
    Iterations: 500
</div>

<div id="controls">
    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
    >
    <button id="reset">Reset</button>
</div>

<div id="progress">
    <div id="progressBar"></div>
</div>

<pre id="error"></pre>


<script>

/* =========================================================
   Canvas / WebGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext(
        "webgl2",
        {
            antialias: false,
            powerPreference: "high-performance"
        }
    );

if (!gl) {
    showError(
        "WebGL2 が利用できません。"
    );
}


/* =========================================================
   UI
========================================================= */

const info =
    document.getElementById("info");

const iterationInput =
    document.getElementById("iterations");

const resetButton =
    document.getElementById("reset");

const progressBar =
    document.getElementById("progressBar");

const progress =
    document.getElementById("progress");


/* =========================================================
   State
========================================================= */

let centerX = -0.75;
let centerY = 0.0;

let zoom = 1.0;

let maxIterations = 500;


/*
    レンダリング世代。

    新しい操作が発生したら番号を増やし、
    古いレンダリングを無効化する。
*/
let renderVersion = 0;

let qualityTimer = null;

let animationFrame = null;


/* =========================================================
   Quality
========================================================= */

const MOVING_RATE = 0.25;
const MEDIUM_RATE = 0.50;
const FINAL_RATE = 1.00;


/* =========================================================
   Error
========================================================= */

function showError(message) {

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        message;
}


/* =========================================================
   Shader compile
========================================================= */

function createShader(
    gl,
    type,
    source
) {

    const shader =
        gl.createShader(type);

    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(shader);


    if (!gl.getShaderParameter(
        shader,
        gl.COMPILE_STATUS
    )) {

        const log =
            gl.getShaderInfoLog(shader);

        console.error(
            "Shader compile error:"
        );

        console.error(log);

        console.error(source);


        throw new Error(
            "Shader compile error:\n\n" +
            log
        );
    }


    return shader;
}


/* =========================================================
   Program link
========================================================= */

function createProgram(
    gl,
    vertexSource,
    fragmentSource
) {

    const vertexShader =
        createShader(
            gl,
            gl.VERTEX_SHADER,
            vertexSource
        );


    const fragmentShader =
        createShader(
            gl,
            gl.FRAGMENT_SHADER,
            fragmentSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );

    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(
        program
    );


    if (!gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )) {

        const log =
            gl.getProgramInfoLog(
                program
            );

        console.error(
            "Program link error:"
        );

        console.error(log);


        throw new Error(
            "Program link error:\n\n" +
            log
        );
    }


    return program;
}


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main()
{
    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}
`;


/* =========================================================
   Fragment Shader
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;
precision highp int;

out vec4 outColor;


/* ---------------------------------------------------------
   Uniforms
--------------------------------------------------------- */

uniform vec2 u_resolution;

uniform vec2 u_centerHigh;
uniform vec2 u_centerLow;

uniform float u_zoom;

uniform int u_iterations;


/* =========================================================
   Double-Single arithmetic
========================================================= */


/*
    DS number:

        x = x.x + x.y

    x.x = high
    x.y = low
*/


/* ---------------------------------------------------------
   Two-Sum
--------------------------------------------------------- */

vec2 twoSum(
    float a,
    float b
)
{
    float s =
        a + b;

    float v =
        s - a;

    float e =
        (a - (s - v))
        + (b - v);

    return vec2(
        s,
        e
    );
}


/* ---------------------------------------------------------
   Fast Two-Sum

   |a| >= |b|
--------------------------------------------------------- */

vec2 fastTwoSum(
    float a,
    float b
)
{
    float s =
        a + b;

    float e =
        b - (s - a);

    return vec2(
        s,
        e
    );
}


/* ---------------------------------------------------------
   DS addition
--------------------------------------------------------- */

vec2 dsAdd(
    vec2 a,
    vec2 b
)
{
    vec2 s =
        twoSum(
            a.x,
            b.x
        );

    float e =
        s.y
        + a.y
        + b.y;

    return fastTwoSum(
        s.x,
        e
    );
}


/* ---------------------------------------------------------
   DS × float

   ここではDS同士の乗算を使わない。

   そのため、以前のDS版よりかなり軽い。
--------------------------------------------------------- */

vec2 dsMulFloat(
    vec2 a,
    float b
)
{
    const float SPLIT =
        4097.0;


    float cona =
        a.x * SPLIT;

    float aHigh =
        cona - (cona - a.x);

    float aLow =
        a.x - aHigh;


    float p =
        a.x * b;


    float e =
        (aHigh * b - p)
        + aLow * b;


    e +=
        a.y * b;


    return fastTwoSum(
        p,
        e
    );
}


/* =========================================================
   Color
========================================================= */

vec3 colorize(
    float t
)
{
    float r =
        0.5
        +
        0.5 *
        cos(
            6.2831853 *
            (t + 0.00)
        );


    return vec3(
        r,
        r,
        r
    );
}


/* =========================================================
   Main
========================================================= */

void main()
{
    /* -----------------------------------------------------
       Pixel
    ----------------------------------------------------- */

    vec2 pixel =
        gl_FragCoord.xy;


    /* -----------------------------------------------------
       Scale
    ----------------------------------------------------- */

    float scale =
        min(
            u_resolution.x,
            u_resolution.y
        );


    /* -----------------------------------------------------
       Pixel → centered pixel

       DS化
    ----------------------------------------------------- */

    vec2 pixelX =
        twoSum(
            pixel.x,
            -0.5 * u_resolution.x
        );

    vec2 pixelY =
        twoSum(
            pixel.y,
            -0.5 * u_resolution.y
        );


    /* -----------------------------------------------------
       centered pixel / scale
    ----------------------------------------------------- */

    vec2 offsetX =
        dsMulFloat(
            pixelX,
            1.0 / scale
        );

    vec2 offsetY =
        dsMulFloat(
            pixelY,
            1.0 / scale
        );


    /* -----------------------------------------------------
       / zoom
    ----------------------------------------------------- */

    vec2 scaledX =
        dsMulFloat(
            offsetX,
            1.0 / u_zoom
        );

    vec2 scaledY =
        dsMulFloat(
            offsetY,
            1.0 / u_zoom
        );


    /* -----------------------------------------------------
       Center

       JSから

           high + low

       の2つに分けて送っている。
    ----------------------------------------------------- */

    vec2 cx =
        vec2(
            u_centerHigh.x,
            u_centerLow.x
        );

    vec2 cy =
        vec2(
            u_centerHigh.y,
            u_centerLow.y
        );


    /* -----------------------------------------------------
       Center + offset

       ここで初めて

           c = center + offset

       が完成する。
    ----------------------------------------------------- */

    cx =
        dsAdd(
            cx,
            scaledX
        );

    cy =
        dsAdd(
            cy,
            scaledY
        );


    /* -----------------------------------------------------
       Mandelbrot

       重要：

       z は通常float。

       cだけDS。

       これによってDS演算量を大幅に削減する。
    ----------------------------------------------------- */

    float zx = 0.0;
    float zy = 0.0;


    float smoothIteration =
        0.0;

    bool escaped =
        false;


    for (
        int i = 0;
        i < 100000;
        i++
    )
    {
        if (
            i >= u_iterations
        )
        {
            break;
        }


        /* -----------------------------------------------
           z²

           (x + yi)²

           real = x² - y²
           imag = 2xy
        ------------------------------------------------ */

        float zx2 =
            zx * zx;

        float zy2 =
            zy * zy;

        float xy =
            zx * zy;


        float nextX =
            zx2
            - zy2
            + cx.x;


        float nextY =
            2.0 * xy
            + cy.x;


        zx =
            nextX;

        zy =
            nextY;


        /* -----------------------------------------------
           Escape test
        ------------------------------------------------ */

        float magnitudeSquared =
            zx * zx
            +
            zy * zy;


        if (
            magnitudeSquared >
            256.0
        )
        {
            float logZn =
                log(
                    magnitudeSquared
                )
                * 0.5;


            float nu =
                log(
                    logZn /
                    log(2.0)
                )
                /
                log(2.0);


            smoothIteration =
                float(i)
                + 1.0
                - nu;


            escaped =
                true;

            break;
        }
    }


    /* -----------------------------------------------------
       Interior
    ----------------------------------------------------- */

    if (!escaped)
    {
        outColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /* -----------------------------------------------------
       Smooth coloring
    ----------------------------------------------------- */

    float t =
        pow(
            clamp(
                smoothIteration
                /
                float(u_iterations),

                0.0,
                1.0
            ),

            0.35
        );


    outColor =
        vec4(
            colorize(t),
            1.0
        );
}
`;


/* =========================================================
   Create Program
========================================================= */

let program;

try {

    program =
        createProgram(
            gl,
            vertexShaderSource,
            fragmentShaderSource
        );

} catch (e) {

    showError(
        e.message
    );

    throw e;
}


/* =========================================================
   Fullscreen Triangle
========================================================= */

const vertices =
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]);


const vao =
    gl.createVertexArray();

gl.bindVertexArray(
    vao
);


const buffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);

gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    positionLocation
);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniform locations
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(
        program,
        "u_resolution"
    );


const centerHighLocation =
    gl.getUniformLocation(
        program,
        "u_centerHigh"
    );


const centerLowLocation =
    gl.getUniformLocation(
        program,
        "u_centerLow"
    );


const zoomLocation =
    gl.getUniformLocation(
        program,
        "u_zoom"
    );


const iterationsLocation =
    gl.getUniformLocation(
        program,
        "u_iterations"
    );


/* =========================================================
   Double → Double-Single
========================================================= */

function splitDouble(
    value
)
{
    const high =
        Math.fround(value);

    const low =
        Math.fround(
            value - high
        );

    return [
        high,
        low
    ];
}


/* =========================================================
   Canvas resize
========================================================= */

function resizeCanvas()
{
    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        Math.floor(
            canvas.clientWidth * dpr
        );

    const height =
        Math.floor(
            canvas.clientHeight * dpr
        );


    if (
        canvas.width !== width ||
        canvas.height !== height
    )
    {
        canvas.width =
            width;

        canvas.height =
            height;
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Info
========================================================= */

function updateInfo()
{
    info.innerHTML =
        "Zoom: " +
        zoom.toExponential(3) +
        "<br>" +
        "Iterations: " +
        maxIterations;
}


/* =========================================================
   Progress
========================================================= */

function setProgress(
    value
)
{
    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                value * 100
            )
        ) + "%";

    progress.style.opacity =
        "1";
}


function finishProgress()
{
    progressBar.style.width =
        "100%";

    setTimeout(
        () => {
            progress.style.opacity =
                "0";
        },
        250
    );
}


/* =========================================================
   Render
========================================================= */

function render(
    iterationRate,
    progressValue
)
{
    resizeCanvas();


    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );


    const centerXParts =
        splitDouble(
            centerX
        );

    const centerYParts =
        splitDouble(
            centerY
        );


    gl.useProgram(
        program
    );

    gl.bindVertexArray(
        vao
    );


    gl.uniform2f(
        resolutionLocation,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        centerHighLocation,
        centerXParts[0],
        centerYParts[0]
    );


    gl.uniform2f(
        centerLowLocation,
        centerXParts[1],
        centerYParts[1]
    );


    gl.uniform1f(
        zoomLocation,
        zoom
    );


    gl.uniform1i(
        iterationsLocation,
        iterations
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    setProgress(
        progressValue
    );
}


/* =========================================================
   Moving render
========================================================= */

function renderMoving()
{
    renderVersion++;


    clearTimeout(
        qualityTimer
    );


    if (animationFrame !== null)
    {
        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    setProgress(
        0
    );


    /*
        移動中は25% iterations
    */

    render(
        MOVING_RATE,
        0.14
    );
}


/* =========================================================
   HQ render
========================================================= */

function renderFinal()
{
    renderVersion++;

    const version =
        renderVersion;


    clearTimeout(
        qualityTimer
    );


    /*
        まず移動中画質
    */

    render(
        MOVING_RATE,
        0.14
    );


    /*
        少し待ってMedium
    */

    qualityTimer =
        setTimeout(
            () => {

                if (
                    version !== renderVersion
                )
                    return;


                render(
                    MEDIUM_RATE,
                    0.43
                );


                /*
                    最終画質
                */

                qualityTimer =
                    setTimeout(
                        () => {

                            if (
                                version !==
                                renderVersion
                            )
                                return;


                            render(
                                FINAL_RATE,
                                1.0
                            );


                            finishProgress();

                        },
                        80
                    );

            },
            100
        );
}


/* =========================================================
   Zoom around cursor
========================================================= */

function zoomAt(
    screenX,
    screenY,
    factor
)
{
    resizeCanvas();


    const rect =
        canvas.getBoundingClientRect();


    const x =
        (
            screenX -
            rect.left
        )
        *
        (
            canvas.width /
            rect.width
        );


    const y =
        (
            screenY -
            rect.top
        )
        *
        (
            canvas.height /
            rect.height
        );


    const scale =
        Math.min(
            canvas.width,
            canvas.height
        );


    /*
        現在のカーソル位置の
        Mandelbrot座標
    */

    const worldX =
        centerX
        +
        (
            x -
            canvas.width * 0.5
        )
        /
        scale
        /
        zoom;


    const worldY =
        centerY
        +
        (
            y -
            canvas.height * 0.5
        )
        /
        scale
        /
        zoom;


    zoom *= factor;


    /*
        ズーム後も
        カーソル位置を固定
    */

    centerX =
        worldX
        -
        (
            x -
            canvas.width * 0.5
        )
        /
        scale
        /
        zoom;


    centerY =
        worldY
        -
        (
            y -
            canvas.height * 0.5
        )
        /
        scale
        /
        zoom;


    updateInfo();

    renderMoving();
}


/* =========================================================
   Mouse
========================================================= */

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;

        renderMoving();
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if (!dragging)
            return;


        resizeCanvas();


        const rect =
            canvas.getBoundingClientRect();


        const scale =
            Math.min(
                canvas.width,
                canvas.height
            );


        const dx =
            (
                e.clientX -
                lastMouseX
            )
            *
            (
                canvas.width /
                rect.width
            );


        const dy =
            (
                e.clientY -
                lastMouseY
            )
            *
            (
                canvas.height /
                rect.height
            );


        centerX -=
            dx /
            scale /
            zoom;


        centerY -=
            dy /
            scale /
            zoom;


        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;


        updateInfo();

        renderMoving();
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging)
            return;


        dragging = false;

        renderFinal();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const factor =
            e.deltaY < 0
                ? 1.5
                : 1 / 1.5;


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );


        renderFinal();
    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

let touches = [];

let lastTouchCenter = null;

let lastTouchDistance = null;


function getTouchCenter()
{
    return {
        x:
            (
                touches[0].clientX +
                touches[1].clientX
            ) / 2,

        y:
            (
                touches[0].clientY +
                touches[1].clientY
            ) / 2
    };
}


function getTouchDistance()
{
    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.hypot(
        dx,
        dy
    );
}


canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        touches =
            Array.from(
                e.touches
            );


        if (touches.length === 1)
        {
            lastTouchCenter = {
                x:
                    touches[0].clientX,

                y:
                    touches[0].clientY
            };

            lastTouchDistance =
                null;
        }


        if (touches.length >= 2)
        {
            lastTouchCenter =
                getTouchCenter();

            lastTouchDistance =
                getTouchDistance();
        }


        renderMoving();

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        touches =
            Array.from(
                e.touches
            );


        if (
            touches.length === 1 &&
            lastTouchCenter
        )
        {
            resizeCanvas();


            const rect =
                canvas.getBoundingClientRect();


            const scale =
                Math.min(
                    canvas.width,
                    canvas.height
                );


            const dx =
                (
                    touches[0].clientX -
                    lastTouchCenter.x
                )
                *
                (
                    canvas.width /
                    rect.width
                );


            const dy =
                (
                    touches[0].clientY -
                    lastTouchCenter.y
                )
                *
                (
                    canvas.height /
                    rect.height
                );


            centerX -=
                dx /
                scale /
                zoom;


            centerY -=
                dy /
                scale /
                zoom;


            lastTouchCenter = {
                x:
                    touches[0].clientX,

                y:
                    touches[0].clientY
            };


            updateInfo();

            renderMoving();
        }


        if (
            touches.length >= 2
        )
        {
            const center =
                getTouchCenter();


            const distance =
                getTouchDistance();


            /*
                Pan
            */

            if (lastTouchCenter)
            {
                resizeCanvas();


                const rect =
                    canvas.getBoundingClientRect();


                const scale =
                    Math.min(
                        canvas.width,
                        canvas.height
                    );


                const dx =
                    (
                        center.x -
                        lastTouchCenter.x
                    )
                    *
                    (
                        canvas.width /
                        rect.width
                    );


                const dy =
                    (
                        center.y -
                        lastTouchCenter.y
                    )
                    *
                    (
                        canvas.height /
                        rect.height
                    );


                centerX -=
                    dx /
                    scale /
                    zoom;


                centerY -=
                    dy /
                    scale /
                    zoom;
            }


            /*
                Pinch zoom
            */

            if (
                lastTouchDistance !== null &&
                lastTouchDistance > 0
            )
            {
                const factor =
                    distance /
                    lastTouchDistance;


                zoomAt(
                    center.x,
                    center.y,
                    factor
                );
            }


            lastTouchCenter =
                center;

            lastTouchDistance =
                distance;


            updateInfo();

            renderMoving();
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        e.preventDefault();


        touches =
            Array.from(
                e.touches
            );


        if (touches.length === 1)
        {
            lastTouchCenter = {
                x:
                    touches[0].clientX,

                y:
                    touches[0].clientY
            };

            lastTouchDistance =
                null;
        }
        else
        {
            lastTouchCenter =
                null;

            lastTouchDistance =
                null;
        }


        renderFinal();

    },
    {
        passive: false
    }
);


/* =========================================================
   Iteration input
========================================================= */

iterationInput.addEventListener(
    "change",
    () => {

        let value =
            Number(
                iterationInput.value
            );


        if (!Number.isFinite(value))
        {
            value = 500;
        }


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    Math.floor(value)
                )
            );


        maxIterations =
            value;


        iterationInput.value =
            value;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        centerX = -0.75;
        centerY = 0.0;

        zoom = 1.0;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
    "resize",
    () => {

        renderFinal();
    }
);


/* =========================================================
   Initial render
========================================================= */

resizeCanvas();

updateInfo();

renderFinal();

</script>

</body>
</html>
