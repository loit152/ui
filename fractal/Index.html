<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Mandelbrot WebGL</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    font: 13px monospace;
    z-index: 10;
    user-select: none;
    pointer-events: none;
}

#controls {
    position: fixed;
    right: 10px;
    bottom: 12px;
    z-index: 10;
    display: flex;
    gap: 6px;
}

#iterations {
    width: 80px;
    box-sizing: border-box;
}

button,
input {
    font: 13px monospace;
}

#progress {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.15);
    z-index: 20;
    opacity: 0;
    transition: opacity 0.2s;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: rgba(255,255,255,0.9);
    transition: width 0.08s linear;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    Zoom: <span id="zoomText">1.00</span><br>
    Iterations: <span id="iterationText">500</span>
</div>

<div id="controls">
    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
    >
    <button id="reset">Reset</button>
</div>

<div id="progress">
    <div id="progressBar"></div>
</div>

<script>

/* =========================================================
   WebGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl2", {
        antialias: false,
        powerPreference: "high-performance"
    });

if (!gl) {
    alert("WebGL2が利用できません。");
    throw new Error("WebGL2 unavailable");
}


/* =========================================================
   UI
========================================================= */

const zoomText =
    document.getElementById("zoomText");

const iterationText =
    document.getElementById("iterationText");

const iterationInput =
    document.getElementById("iterations");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const resetButton =
    document.getElementById("reset");


/* =========================================================
   Mandelbrot state
========================================================= */

let centerX = -0.75;
let centerY = 0.0;

let zoom = 1.0;

let maxIterations = 500;


/* =========================================================
   Render state
========================================================= */

let renderVersion = 0;

let qualityTimer = null;

let renderAnimationFrame = null;

let activeRender = null;


/* =========================================================
   Quality
========================================================= */

const MOVING_ITERATION_RATE = 0.25;
const MEDIUM_ITERATION_RATE = 0.50;
const FINAL_ITERATION_RATE = 1.00;


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main() {
    gl_Position =
        vec4(a_position, 0.0, 1.0);
}
`;


/* =========================================================
   Fragment Shader
   ========================================================
   座標を double-single 形式で扱う。

   value = high + low

   通常の WebGL float は 32-bit だが、
   1つの座標を2つのfloatに分けることで
   中心座標の精度を改善する。
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;
precision highp int;


/* =========================================================
   Fragment output
========================================================= */

out vec4 outColor;


/* =========================================================
   Uniforms
========================================================= */

uniform vec2 u_resolution;

uniform vec2 u_centerHigh;
uniform vec2 u_centerLow;

uniform float u_zoom;

uniform int u_iterations;


/* =========================================================
   Double-Single arithmetic
========================================================= */


/* -----------------------------------------
   Two-Sum

   a + b を high + low に分解
----------------------------------------- */

vec2 twoSum(float a, float b) {

    float s = a + b;

    float bb = s - a;

    float e =
        (a - (s - bb))
        + (b - bb);

    return vec2(s, e);
}


/* -----------------------------------------
   Fast Two-Sum
----------------------------------------- */

vec2 fastTwoSum(float a, float b) {

    float s = a + b;

    float e =
        b - (s - a);

    return vec2(s, e);
}


/* -----------------------------------------
   Double-Single addition
----------------------------------------- */

vec2 dsAdd(vec2 a, vec2 b) {

    vec2 s =
        twoSum(a.x, b.x);

    float e =
        s.y +
        a.y +
        b.y;

    return fastTwoSum(
        s.x,
        e
    );
}


/* -----------------------------------------
   Double-Single subtraction
----------------------------------------- */

vec2 dsSub(vec2 a, vec2 b) {

    return dsAdd(
        a,
        vec2(-b.x, -b.y)
    );
}


/* -----------------------------------------
   Double-Single multiplication
----------------------------------------- */

vec2 dsMul(vec2 a, vec2 b) {

    float p =
        a.x * b.x;

    float e =
        fma(
            a.x,
            b.x,
            -p
        );

    e +=
        a.x * b.y +
        a.y * b.x;

    return fastTwoSum(
        p,
        e
    );
}


/* -----------------------------------------
   Double-Single × float
----------------------------------------- */

vec2 dsMulFloat(
    vec2 a,
    float b
) {

    float p =
        a.x * b;

    float e =
        fma(
            a.x,
            b,
            -p
        );

    e +=
        a.y * b;

    return fastTwoSum(
        p,
        e
    );
}


/* -----------------------------------------
   Square
----------------------------------------- */

vec2 dsSquare(vec2 a) {

    return dsMul(a, a);
}


/* =========================================================
   Color
   ---------------------------------------------------------
   元コードのグレースケールを維持
========================================================= */

vec3 colorize(float t) {

    float r =
        0.5 +
        0.5 *
        cos(
            6.2831853 *
            (t + 0.00)
        );

    return vec3(
        r,
        r,
        r
    );
}


/* =========================================================
   Main
========================================================= */

void main() {

    /*
       gl_FragCoord は画面全体の
       pixel coordinate。
    */

    vec2 pixel =
        gl_FragCoord.xy;


    /* -----------------------------------------
       Screen → complex plane
    ----------------------------------------- */

    float scale =
        min(
            u_resolution.x,
            u_resolution.y
        );


    vec2 offset =
        (
            pixel -
            0.5 * u_resolution
        )
        / scale;


    vec2 offsetScaled =
        offset / u_zoom;


    /* -----------------------------------------
       Center

       center = high + low
    ----------------------------------------- */

    vec2 cx =
        dsAdd(
            vec2(
                u_centerHigh.x,
                u_centerLow.x
            ),

            vec2(
                offsetScaled.x,
                0.0
            )
        );


    vec2 cy =
        dsAdd(
            vec2(
                u_centerHigh.y,
                u_centerLow.y
            ),

            vec2(
                offsetScaled.y,
                0.0
            )
        );


    /* -----------------------------------------
       z = 0
    ----------------------------------------- */

    vec2 zx =
        vec2(0.0, 0.0);

    vec2 zy =
        vec2(0.0, 0.0);


    float smoothIteration = 0.0;

    bool escaped = false;


    /* -----------------------------------------
       Mandelbrot iteration
    ----------------------------------------- */

    for (int i = 0; i < 100000; i++) {

        if (i >= u_iterations)
            break;


        /*
           z²
        */

        vec2 zx2 =
            dsSquare(zx);

        vec2 zy2 =
            dsSquare(zy);


        /*
           real:
               zx² - zy²
        */

        vec2 real =
            dsSub(
                zx2,
                zy2
            );


        /*
           imaginary:
               2zxzy
        */

        vec2 product =
            dsMul(
                zx,
                zy
            );

        vec2 imag =
            dsMulFloat(
                product,
                2.0
            );


        /*
           z² + c
        */

        zx =
            dsAdd(
                real,
                cx
            );

        zy =
            dsAdd(
                imag,
                cy
            );


        /*
           Escape test

           escape threshold:
               |z|² > 256
        */

        float magnitudeSquared =
            zx.x * zx.x +
            zy.x * zy.x;


        if (
            magnitudeSquared >
            256.0
        ) {

            /*
               Smooth coloring
            */

            float logZn =
                log(
                    magnitudeSquared
                ) * 0.5;


            float nu =
                log(
                    logZn /
                    log(2.0)
                )
                / log(2.0);


            smoothIteration =
                float(i)
                + 1.0
                - nu;


            escaped = true;

            break;
        }
    }


    /* -----------------------------------------
       Inside Mandelbrot set
    ----------------------------------------- */

    if (!escaped) {

        outColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    /* -----------------------------------------
       Smooth coloring
    ----------------------------------------- */

    float t =
        pow(
            clamp(
                smoothIteration /
                float(u_iterations),

                0.0,
                1.0
            ),

            0.35
        );


    outColor =
        vec4(
            colorize(t),
            1.0
        );
}
`;


/* =========================================================
   Shader compilation
========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);


    gl.shaderSource(
        shader,
        source
    );


    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        console.error(
            gl.getShaderInfoLog(shader)
        );

        throw new Error(
            "Shader compilation failed"
        );
    }


    return shader;
}


/* =========================================================
   Program
========================================================= */

function createProgram() {

    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );

    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(
        program
    );


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        console.error(
            gl.getProgramInfoLog(program)
        );

        throw new Error(
            "Program linking failed"
        );
    }


    return program;
}


const program =
    createProgram();

gl.useProgram(program);


/* =========================================================
   Fullscreen triangle
========================================================= */

const vao =
    gl.createVertexArray();

gl.bindVertexArray(
    vao
);


const positionBuffer =
    gl.createBuffer();

gl.bindBuffer(
    gl.ARRAY_BUFFER,
    positionBuffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,

    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]),

    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniform locations
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(
        program,
        "u_resolution"
    );

const centerHighLocation =
    gl.getUniformLocation(
        program,
        "u_centerHigh"
    );

const centerLowLocation =
    gl.getUniformLocation(
        program,
        "u_centerLow"
    );

const zoomLocation =
    gl.getUniformLocation(
        program,
        "u_zoom"
    );

const iterationsLocation =
    gl.getUniformLocation(
        program,
        "u_iterations"
    );


/* =========================================================
   Double → two floats
========================================================= */

function splitDouble(value) {

    /*
       high:
       32-bit floatとして表現できる部分
    */

    const high =
        Math.fround(value);


    /*
       low:
       highとの差
    */

    const low =
        value - high;


    return [
        high,
        Math.fround(low)
    ];
}


/* =========================================================
   Canvas resize
========================================================= */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        Math.floor(
            canvas.clientWidth * dpr
        );

    const height =
        Math.floor(
            canvas.clientHeight * dpr
        );


    if (
        canvas.width !== width ||
        canvas.height !== height
    ) {

        canvas.width = width;
        canvas.height = height;
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   UI
========================================================= */

function updateInfo() {

    zoomText.textContent =
        zoom.toFixed(2);

    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Progress
========================================================= */

function setProgress(value) {

    value =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );


    progress.style.opacity = "1";


    progressBar.style.width =
        `${value * 100}%`;
}


function finishProgress() {

    progressBar.style.width =
        "100%";


    setTimeout(() => {

        progress.style.opacity =
            "0";

    }, 250);
}


/* =========================================================
   Cancel current rendering
========================================================= */

function cancelRender() {

    if (
        renderAnimationFrame !== null
    ) {

        cancelAnimationFrame(
            renderAnimationFrame
        );

        renderAnimationFrame =
            null;
    }


    activeRender = null;
}


/* =========================================================
   Work estimation
========================================================= */

function estimatedWork(rate) {

    return (
        canvas.width *
        canvas.height *
        Math.max(
            1,
            Math.floor(
                maxIterations * rate
            )
        )
    );
}


/* =========================================================
   Set shader uniforms
========================================================= */

function setRenderUniforms(
    iterations
) {

    const cx =
        splitDouble(centerX);

    const cy =
        splitDouble(centerY);


    gl.useProgram(
        program
    );


    gl.uniform2f(
        resolutionLocation,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        centerHighLocation,
        cx[0],
        cy[0]
    );


    gl.uniform2f(
        centerLowLocation,
        cx[1],
        cy[1]
    );


    gl.uniform1f(
        zoomLocation,
        zoom
    );


    gl.uniform1i(
        iterationsLocation,
        iterations
    );
}


/* =========================================================
   Full-screen render
   ---------------------------------------------------------
   移動中はこちら。

   解像度は落とさず、
   iterationだけ減らす。
========================================================= */

function renderFull(
    iterationRate
) {

    resizeCanvas();


    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );


    gl.disable(
        gl.SCISSOR_TEST
    );


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    setRenderUniforms(
        iterations
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );
}


/* =========================================================
   Tiles
========================================================= */

const TILE_SIZE = 128;


function createTiles() {

    const tiles = [];


    for (
        let y = 0;
        y < canvas.height;
        y += TILE_SIZE
    ) {

        for (
            let x = 0;
            x < canvas.width;
            x += TILE_SIZE
        ) {

            tiles.push({

                x: x,

                y: y,

                width:
                    Math.min(
                        TILE_SIZE,
                        canvas.width - x
                    ),

                height:
                    Math.min(
                        TILE_SIZE,
                        canvas.height - y
                    )
            });
        }
    }


    return tiles;
}


/* =========================================================
   Start tiled render
========================================================= */

function startTiledStage(
    iterationRate,
    progressStart,
    progressEnd,
    version,
    clearFirst
) {

    resizeCanvas();


    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );


    const tiles =
        createTiles();


    /*
       必要な場合だけ画面をクリア。
       Medium → Finalではクリアしない。

       これにより、
       古い段階の画像を「クッション」として
       残しながら高精度画像を上書きできる。
    */

    if (clearFirst) {

        gl.disable(
            gl.SCISSOR_TEST
        );

        gl.clearColor(
            0,
            0,
            0,
            1
        );

        gl.clear(
            gl.COLOR_BUFFER_BIT
        );
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );


    setRenderUniforms(
        iterations
    );


    gl.enable(
        gl.SCISSOR_TEST
    );


    activeRender = {

        version:
            version,

        tiles:
            tiles,

        index:
            0,

        progressStart:
            progressStart,

        progressEnd:
            progressEnd
    };


    processTiles();
}


/* =========================================================
   Tile processing
========================================================= */

function processTiles() {

    if (!activeRender)
        return;


    /*
       古いレンダリングなら破棄。
    */

    if (
        activeRender.version !==
        renderVersion
    ) {

        cancelRender();

        return;
    }


    const start =
        performance.now();


    /*
       1フレームあたり約7msまで
       GPUへの描画命令を投入する。

       残りは次のrequestAnimationFrameへ。
    */

    const budget = 7;


    while (
        activeRender.index <
        activeRender.tiles.length
    ) {

        const tile =
            activeRender.tiles[
                activeRender.index
            ];


        /*
           WebGLの原点は左下。
           タイル座標は左上基準なので変換。
        */

        const scissorY =
            canvas.height -
            tile.y -
            tile.height;


        gl.scissor(
            tile.x,
            scissorY,
            tile.width,
            tile.height
        );


        /*
           フルスクリーン三角形を描くが、
           scissorによってこのタイル部分だけ
           fragment shaderが実行される。
        */

        gl.drawArrays(
            gl.TRIANGLES,
            0,
            3
        );


        activeRender.index++;


        if (
            performance.now() - start >
            budget
        ) {

            break;
        }
    }


    /*
       ステージ内の進捗
    */

    const ratio =
        activeRender.index /
        activeRender.tiles.length;


    /*
       全体進捗へ変換
    */

    const value =
        activeRender.progressStart +
        (
            activeRender.progressEnd -
            activeRender.progressStart
        ) *
        ratio;


    setProgress(value);


    /*
       完了
    */

    if (
        activeRender.index >=
        activeRender.tiles.length
    ) {

        gl.disable(
            gl.SCISSOR_TEST
        );


        activeRender = null;

        renderAnimationFrame =
            null;


        if (
            window.__stageCallback
        ) {

            const callback =
                window.__stageCallback;

            window.__stageCallback =
                null;

            callback();
        }


        return;
    }


    renderAnimationFrame =
        requestAnimationFrame(
            processTiles
        );
}


/* =========================================================
   High-quality pipeline
========================================================= */

function scheduleHighQuality() {

    clearTimeout(
        qualityTimer
    );


    const version =
        renderVersion;


    qualityTimer =
        setTimeout(() => {

            if (
                version !==
                renderVersion
            )
                return;


            resizeCanvas();


            /*
               各段階の計算量

               Moving = 25%
               Medium = 50%
               Final = 100%
            */

            const movingWork =
                estimatedWork(
                    MOVING_ITERATION_RATE
                );


            const mediumWork =
                estimatedWork(
                    MEDIUM_ITERATION_RATE
                );


            const finalWork =
                estimatedWork(
                    FINAL_ITERATION_RATE
                );


            const totalWork =
                movingWork +
                mediumWork +
                finalWork;


            /*
               Moving終了時

               0.25 / 1.75
               ≒ 14.29%
            */

            const movingEnd =
                movingWork /
                totalWork;


            /*
               Medium終了時

               (0.25 + 0.50) / 1.75
               ≒ 42.86%
            */

            const mediumEnd =
                (
                    movingWork +
                    mediumWork
                ) /
                totalWork;


            /*
               Medium開始
            */

            window.__stageCallback =
                () => {

                    if (
                        version !==
                        renderVersion
                    )
                        return;


                    setTimeout(() => {

                        if (
                            version !==
                            renderVersion
                        )
                            return;


                        /*
                           Final開始
                        */

                        window.__stageCallback =
                            () => {

                                if (
                                    version !==
                                    renderVersion
                                )
                                    return;


                                setProgress(1);

                                finishProgress();
                            };


                        startTiledStage(
                            FINAL_ITERATION_RATE,

                            mediumEnd,

                            1.0,

                            version,

                            false
                        );

                    }, 50);
                };


            startTiledStage(
                MEDIUM_ITERATION_RATE,

                movingEnd,

                mediumEnd,

                version,

                false
            );

        }, 100);
}


/* =========================================================
   Moving render
========================================================= */

function renderMoving() {

    renderVersion++;


    clearTimeout(
        qualityTimer
    );


    cancelRender();


    resizeCanvas();


    const movingWork =
        estimatedWork(
            MOVING_ITERATION_RATE
        );


    const mediumWork =
        estimatedWork(
            MEDIUM_ITERATION_RATE
        );


    const finalWork =
        estimatedWork(
            FINAL_ITERATION_RATE
        );


    const totalWork =
        movingWork +
        mediumWork +
        finalWork;


    const movingProgress =
        movingWork /
        totalWork;


    setProgress(0);


    /*
       移動中は即座に全画面を描画。
       ただしiterationだけ25%。
    */

    renderFull(
        MOVING_ITERATION_RATE
    );


    /*
       Moving段階の計算終了。
    */

    setProgress(
        movingProgress
    );
}


/* =========================================================
   Immediate final render
========================================================= */

function renderFinal() {

    renderVersion++;


    clearTimeout(
        qualityTimer
    );


    cancelRender();


    setProgress(0);


    resizeCanvas();


    /*
       Resetやiteration変更時など。

       Moving画像がないので、
       最初に画面をクリアする。
    */

    startTiledStage(
        FINAL_ITERATION_RATE,

        0,

        1,

        renderVersion,

        true
    );
}


/* =========================================================
   Zoom
========================================================= */

function zoomAt(
    clientX,
    clientY,
    factor
) {

    const rect =
        canvas.getBoundingClientRect();


    const x =
        clientX -
        rect.left;


    const y =
        clientY -
        rect.top;


    const scale =
        Math.min(
            rect.width,
            rect.height
        );


    /*
       ズーム前のカーソル位置
    */

    const beforeX =
        centerX +
        (
            x -
            rect.width / 2
        ) /
        scale /
        zoom;


    const beforeY =
        centerY +
        (
            rect.height / 2 -
            y
        ) /
        scale /
        zoom;


    zoom *= factor;


    /*
       ズーム後のカーソル位置
    */

    const afterX =
        centerX +
        (
            x -
            rect.width / 2
        ) /
        scale /
        zoom;


    const afterY =
        centerY +
        (
            rect.height / 2 -
            y
        ) /
        scale /
        zoom;


    /*
       カーソル位置を固定
    */

    centerX +=
        beforeX - afterX;

    centerY +=
        beforeY - afterY;


    updateInfo();

    renderMoving();

    scheduleHighQuality();
}


/* =========================================================
   Mouse
========================================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;


        renderVersion++;

        clearTimeout(
            qualityTimer
        );

        cancelRender();

        setProgress(0);
    }
);


canvas.addEventListener(
    "mousemove",
    e => {

        if (!dragging)
            return;


        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;


        lastX = e.clientX;
        lastY = e.clientY;


        const rect =
            canvas.getBoundingClientRect();


        const scale =
            Math.min(
                rect.width,
                rect.height
            );


        centerX -=
            dx /
            scale /
            zoom;


        centerY +=
            dy /
            scale /
            zoom;


        updateInfo();

        renderMoving();
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging)
            return;


        dragging = false;

        scheduleHighQuality();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const factor =
            Math.exp(
                -e.deltaY *
                0.0015
            );


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

const touches =
    new Map();


let pinchStartDistance = 0;

let pinchStartZoom = 1;


function touchDistance() {

    const values =
        [...touches.values()];


    if (values.length < 2)
        return 0;


    const dx =
        values[0].clientX -
        values[1].clientX;


    const dy =
        values[0].clientY -
        values[1].clientY;


    return Math.hypot(
        dx,
        dy
    );
}


/* -----------------------------------------
   Touch start
----------------------------------------- */

canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        renderVersion++;

        clearTimeout(
            qualityTimer
        );

        cancelRender();

        setProgress(0);


        for (
            const t of e.changedTouches
        ) {

            touches.set(
                t.identifier,
                {
                    clientX:
                        t.clientX,

                    clientY:
                        t.clientY,

                    lastX:
                        t.clientX,

                    lastY:
                        t.clientY
                }
            );
        }


        if (
            touches.size === 2
        ) {

            pinchStartDistance =
                touchDistance();

            pinchStartZoom =
                zoom;
        }

    },
    {
        passive: false
    }
);


/* -----------------------------------------
   Touch move
----------------------------------------- */

canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        for (
            const t of e.changedTouches
        ) {

            const data =
                touches.get(
                    t.identifier
                );


            if (!data)
                continue;


            data.clientX =
                t.clientX;

            data.clientY =
                t.clientY;
        }


        /*
           Single finger → pan
        */

        if (
            touches.size === 1
        ) {

            const data =
                [...touches.values()][0];


            const dx =
                data.clientX -
                data.lastX;


            const dy =
                data.clientY -
                data.lastY;


            data.lastX =
                data.clientX;

            data.lastY =
                data.clientY;


            const rect =
                canvas.getBoundingClientRect();


            const scale =
                Math.min(
                    rect.width,
                    rect.height
                );


            centerX -=
                dx /
                scale /
                zoom;


            centerY +=
                dy /
                scale /
                zoom;


            updateInfo();

            renderMoving();
        }


        /*
           Two fingers → pinch
        */

        else if (
            touches.size === 2
        ) {

            const distance =
                touchDistance();


            if (
                pinchStartDistance > 0
            ) {

                zoom =
                    pinchStartZoom *
                    distance /
                    pinchStartDistance;


                updateInfo();

                renderMoving();
            }
        }

    },
    {
        passive: false
    }
);


/* -----------------------------------------
   Touch end
----------------------------------------- */

canvas.addEventListener(
    "touchend",
    e => {

        e.preventDefault();


        for (
            const t of e.changedTouches
        ) {

            touches.delete(
                t.identifier
            );
        }


        /*
           2本指 → 1本指に戻ったときの
           急激なジャンプを防ぐ。
        */

        if (
            touches.size === 1
        ) {

            const remaining =
                [...touches.values()][0];


            remaining.lastX =
                remaining.clientX;

            remaining.lastY =
                remaining.clientY;
        }


        if (
            touches.size === 0
        ) {

            pinchStartDistance = 0;

            scheduleHighQuality();
        }

    },
    {
        passive: false
    }
);


/* -----------------------------------------
   Touch cancel
----------------------------------------- */

canvas.addEventListener(
    "touchcancel",
    e => {

        e.preventDefault();

        touches.clear();

        pinchStartDistance = 0;

        scheduleHighQuality();

    },
    {
        passive: false
    }
);


/* =========================================================
   Iteration input
========================================================= */

iterationInput.addEventListener(
    "change",
    () => {

        maxIterations =
            Math.max(
                1,
                Math.min(
                    100000,
                    parseInt(
                        iterationInput.value,
                        10
                    ) || 1
                )
            );


        iterationInput.value =
            maxIterations;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        centerX = -0.75;

        centerY = 0.0;

        zoom = 1.0;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
    "resize",
    () => {

        renderVersion++;

        clearTimeout(
            qualityTimer
        );

        cancelRender();

        renderFinal();
    }
);


/* =========================================================
   Start
========================================================= */

resizeCanvas();

updateInfo();

renderFinal();

</script>
