<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>WebGL Test</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 10px;
    left: 10px;

    color: white;
    font-family: monospace;
    font-size: 14px;

    pointer-events: none;
    user-select: none;
}

#error {
    position: fixed;
    inset: 0;

    padding: 20px;

    background: black;
    color: #ff5555;

    font-family: monospace;
    font-size: 13px;

    white-space: pre-wrap;
    overflow: auto;

    display: none;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    WebGL2 Test
</div>

<pre id="error"></pre>


<script>

/* =========================================================
   Canvas
========================================================= */

const canvas =
    document.getElementById("canvas");

const info =
    document.getElementById("info");

const error =
    document.getElementById("error");


/* =========================================================
   WebGL2
========================================================= */

const gl =
    canvas.getContext(
        "webgl2",
        {
            antialias: false,
            powerPreference: "high-performance"
        }
    );


if (!gl) {

    error.style.display = "block";

    error.textContent =
        "WebGL2 が利用できません。";

    throw new Error(
        "WebGL2 context could not be created."
    );
}


/* =========================================================
   Shader helper
========================================================= */

function createShader(
    type,
    source
)
{
    const shader =
        gl.createShader(type);


    if (!shader) {

        throw new Error(
            "gl.createShader() に失敗しました。\n\n" +

            "Context lost: " +
            gl.isContextLost() +

            "\n\nGL error: " +
            gl.getError()
        );
    }


    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    )
    {
        const log =
            gl.getShaderInfoLog(
                shader
            ) ||
            "Unknown shader error.";


        gl.deleteShader(
            shader
        );


        throw new Error(
            "Shader compile error:\n\n" +
            log
        );
    }


    return shader;
}


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main()
{
    gl_Position =
        vec4(
            a_position,
            0.0,
            1.0
        );
}
`;


/* =========================================================
   Fragment Shader
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;

out vec4 outColor;

void main()
{
    outColor =
        vec4(
            1.0,
            1.0,
            1.0,
            1.0
        );
}
`;


/* =========================================================
   Create shaders
========================================================= */

let vertexShader;
let fragmentShader;

try {

    vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );

}
catch (e)
{
    error.style.display = "block";

    error.textContent =
        e.message;

    throw e;
}


/* =========================================================
   Program
========================================================= */

const program =
    gl.createProgram();


if (!program)
{
    error.style.display = "block";

    error.textContent =
        "gl.createProgram() に失敗しました。";

    throw new Error(
        "Program creation failed."
    );
}


gl.attachShader(
    program,
    vertexShader
);

gl.attachShader(
    program,
    fragmentShader
);


gl.linkProgram(
    program
);


if (
    !gl.getProgramParameter(
        program,
        gl.LINK_STATUS
    )
)
{
    const log =
        gl.getProgramInfoLog(
            program
        ) ||
        "Unknown program link error.";


    error.style.display = "block";

    error.textContent =
        "Program link error:\n\n" +
        log;


    throw new Error(
        "Program link failed."
    );
}


/* =========================================================
   Fullscreen Triangle
========================================================= */

const vertices =
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]);


const vao =
    gl.createVertexArray();

const buffer =
    gl.createBuffer();


if (!vao || !buffer)
{
    error.style.display = "block";

    error.textContent =
        "WebGL buffer / VAO の作成に失敗しました.";

    throw new Error(
        "VAO or buffer creation failed."
    );
}


gl.bindVertexArray(
    vao
);


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);


/* =========================================================
   Attribute
========================================================= */

const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


if (positionLocation < 0)
{
    error.style.display = "block";

    error.textContent =
        "a_position が見つかりません。";

    throw new Error(
        "Attribute not found."
    );
}


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Resize
========================================================= */

function resizeCanvas()
{
    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        Math.floor(
            canvas.clientWidth * dpr
        );


    const height =
        Math.floor(
            canvas.clientHeight * dpr
        );


    if (
        canvas.width !== width ||
        canvas.height !== height
    )
    {
        canvas.width =
            width;

        canvas.height =
            height;
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Render
========================================================= */

function render()
{
    resizeCanvas();


    gl.clearColor(
        0.0,
        0.0,
        0.0,
        1.0
    );


    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    gl.useProgram(
        program
    );


    gl.bindVertexArray(
        vao
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    const errorCode =
        gl.getError();


    if (errorCode !== gl.NO_ERROR)
    {
        error.style.display = "block";

        error.textContent =
            "描画時のWebGL error:\n\n" +
            errorCode;
    }
}


/* =========================================================
   Context lost
========================================================= */

canvas.addEventListener(
    "webglcontextlost",
    e => {

        e.preventDefault();

        error.style.display = "block";

        error.textContent =
            "WebGL context が失われました。";
    }
);


canvas.addEventListener(
    "webglcontextrestored",
    () => {

        location.reload();

    }
);


/* =========================================================
   Information
========================================================= */

info.innerHTML =
    "WebGL2 Test<br>" +
    "Version: " +
    gl.getParameter(
        gl.VERSION
    ) +
    "<br>" +
    "Renderer: " +
    gl.getParameter(
        gl.RENDERER
    );


/* =========================================================
   Start
========================================================= */

window.addEventListener(
    "resize",
    render
);


render();

</script>

</body>
</html>
