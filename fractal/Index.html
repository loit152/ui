<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

#info {
    position: fixed;
    top: 14px;
    left: 14px;

    color: rgba(255,255,255,.75);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;
    line-height: 1.6;

    pointer-events: none;
    user-select: none;

    text-shadow:
        0 1px 4px rgba(0,0,0,.8);
}

#reset {
    position: fixed;
    right: 14px;
    bottom: 14px;

    padding: 8px 12px;

    color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.35);

    border: 1px solid rgba(255,255,255,.15);
    border-radius: 7px;

    font-size: 12px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

#reset:active {
    background: rgba(255,255,255,.15);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom <span id="zoom">1×</span></div>
    <div>Iterations <span id="iterations">80</span></div>
</div>

<button id="reset">Reset</button>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterations");


let width;
let height;


/* =========================
   Mandelbrot coordinates
========================= */

let centerX = -0.75;
let centerY = 0;

let zoom = 1;


/* =========================
   Rendering
========================= */

let renderVersion = 0;

let rendering = false;

let highQualityTimer = null;


/*
    step

    1 = 全ピクセル
    2 = 1ピクセルおき
    4 = 4ピクセルおき

    移動中は4程度にして高速化。
*/
function draw(step = 1) {

    const version =
        ++renderVersion;

    rendering = true;


    const image =
        ctx.createImageData(
            width,
            height
        );

    const data =
        image.data;


    const maxIteration =
        getIterations();


    /*
        複素平面上の表示範囲
    */

    const scale =
        4 / zoom;

    const aspect =
        width / height;

    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    const minX =
        centerX - rangeX / 2;

    const minY =
        centerY - rangeY / 2;


    /*
        step > 1 の場合、
        計算した色をブロック状に描画する。

        つまり移動中は

            ████
            ████
            ████
            ████

        のような粗い画像になる。
    */

    for (
        let py = 0;
        py < height;
        py += step
    ) {

        /*
            描画途中に新しい操作が来たら
            古い計算を中断する。
        */

        if (
            version !== renderVersion
        ) {
            return;
        }


        const cy =
            minY +
            py / height * rangeY;


        for (
            let px = 0;
            px < width;
            px += step
        ) {

            const cx =
                minX +
                px / width * rangeX;


            let x = 0;
            let y = 0;

            let iteration = 0;


            while (
                x * x +
                y * y <= 4 &&
                iteration < maxIteration
            ) {

                const xx =
                    x * x -
                    y * y +
                    cx;

                y =
                    2 * x * y +
                    cy;

                x = xx;

                iteration++;
            }


            /*
                色
            */

            let r = 0;
            let g = 0;
            let b = 0;


            if (
                iteration <
                maxIteration
            ) {

                /*
                    Smooth coloring
                */

                const logZn =
                    Math.log(
                        Math.log(
                            x * x +
                            y * y
                        )
                    ) / Math.log(2);


                const smooth =
                    iteration +
                    1 -
                    logZn;


                const t =
                    smooth /
                    maxIteration;


                const v =
                    Math.floor(
                        255 *
                        Math.pow(
                            Math.max(0, t),
                            0.35
                        )
                    );


                r = v;
                g = v;
                b = v;
            }


            /*
                step分だけ塗る
            */

            for (
                let yy = 0;
                yy < step &&
                py + yy < height;
                yy++
            ) {

                for (
                    let xx = 0;
                    xx < step &&
                    px + xx < width;
                    xx++
                ) {

                    const index =
                        (
                            (py + yy) *
                            width +
                            (px + xx)
                        ) * 4;


                    data[index] =
                        r;

                    data[index + 1] =
                        g;

                    data[index + 2] =
                        b;

                    data[index + 3] =
                        255;
                }
            }
        }
    }


    /*
        最新の描画だけ表示
    */

    if (
        version === renderVersion
    ) {

        ctx.putImageData(
            image,
            0,
            0
        );

        rendering = false;

        updateInfo();
    }
}


/* =========================
   Iterations
========================= */

function getIterations() {

    return Math.max(
        80,
        Math.floor(
            80 +
            Math.log2(zoom) * 20
        )
    );
}


/* =========================
   Info
========================= */

function updateInfo() {

    if (zoom < 1000) {

        zoomText.textContent =
            zoom.toFixed(1) + "×";

    } else {

        zoomText.textContent =
            zoom.toExponential(2) + "×";
    }


    iterationText.textContent =
        getIterations();
}


/* =========================
   Zoom
========================= */

function zoomAt(
    screenX,
    screenY,
    factor
) {

    const scale =
        4 / zoom;

    const aspect =
        width / height;

    const rangeX =
        scale;

    const rangeY =
        scale / aspect;


    /*
        ズーム前の
        複素平面上の座標
    */

    const worldX =
        centerX +
        (
            screenX / width -
            0.5
        ) * rangeX;


    const worldY =
        centerY +
        (
            screenY / height -
            0.5
        ) * rangeY;


    zoom *= factor;


    /*
        ズーム後も
        worldX / worldY を
        同じ画面位置に置く
    */

    const newScale =
        4 / zoom;

    const newRangeX =
        newScale;

    const newRangeY =
        newScale / aspect;


    centerX =
        worldX -
        (
            screenX / width -
            0.5
        ) * newRangeX;


    centerY =
        worldY -
        (
            screenY / height -
            0.5
        ) * newRangeY;


    /*
        まず粗く描く
    */

    draw(4);


    /*
        操作が止まったら
        高精細描画
    */

    scheduleHighQuality();
}


/* =========================
   高精細描画
========================= */

function scheduleHighQuality() {

    clearTimeout(
        highQualityTimer
    );


    highQualityTimer =
        setTimeout(() => {

            draw(1);

        }, 120);
}


/* =========================
   Mouse
========================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        clearTimeout(
            highQualityTimer
        );
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging) return;

        dragging = false;

        /*
            指を離した瞬間に
            高精細化
        */

        scheduleHighQuality();
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if (!dragging) return;


        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;


        const scale =
            4 / zoom;

        const aspect =
            width / height;


        centerX -=
            dx / width * scale;


        centerY -=
            dy /
            height *
            scale /
            aspect;


        lastX = e.clientX;
        lastY = e.clientY;


        /*
            移動中は粗く
        */

        draw(4);


        /*
            120ms操作がなければ
            高精細化
        */

        scheduleHighQuality();
    }
);


/* =========================
   Wheel
========================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        const factor =
            e.deltaY < 0
                ? 1.5
                : 1 / 1.5;


        zoomAt(
            e.clientX,
            e.clientY,
            factor
        );

    },
    {
        passive: false
    }
);


/* =========================
   Touch
========================= */

let previousDistance = null;


/*
    1本指
        → 移動

    2本指
        → ピンチズーム
*/


canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        if (
            e.touches.length === 2
        ) {

            previousDistance =
                getTouchDistance(
                    e.touches
                );
        }

        clearTimeout(
            highQualityTimer
        );

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        /*
            1本指移動
        */

        if (
            e.touches.length === 1
        ) {

            const x =
                e.touches[0].clientX;

            const y =
                e.touches[0].clientY;


            const dx =
                x - lastX;

            const dy =
                y - lastY;


            const scale =
                4 / zoom;

            const aspect =
                width / height;


            centerX -=
                dx / width * scale;


            centerY -=
                dy /
                height *
                scale /
                aspect;


            lastX = x;
            lastY = y;


            draw(4);

            scheduleHighQuality();
        }


        /*
            2本指ズーム
        */

        if (
            e.touches.length === 2
        ) {

            const distance =
                getTouchDistance(
                    e.touches
                );


            if (
                previousDistance !== null
            ) {

                const factor =
                    distance /
                    previousDistance;


                const x =
                    (
                        e.touches[0].clientX +
                        e.touches[1].clientX
                    ) / 2;


                const y =
                    (
                        e.touches[0].clientY +
                        e.touches[1].clientY
                    ) / 2;


                zoomAt(
                    x,
                    y,
                    factor
                );
            }


            previousDistance =
                distance;
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        if (
            e.touches.length < 2
        ) {

            previousDistance =
                null;
        }


        if (
            e.touches.length === 1
        ) {

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;
        }


        scheduleHighQuality();
    }
);


function getTouchDistance(touches) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


/* =========================
   Reset
========================= */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        () => {

            centerX = -0.75;
            centerY = 0;
            zoom = 1;

            draw(1);
        }
    );


/* =========================
   Resize
========================= */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;


    draw(1);
}


window.addEventListener(
    "resize",
    resize
);


resize();

</script>

</body>
</html>
