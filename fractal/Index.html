<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>High Precision Mandelbrot Explorer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    position: fixed;
    top: 14px;
    left: 16px;

    color: rgba(255,255,255,.75);

    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;

    pointer-events: none;
    user-select: none;
}

#controls {
    position: fixed;
    right: 16px;
    bottom: 16px;

    display: flex;
    gap: 8px;
    align-items: center;

    font-family: monospace;
}

#iterations {
    width: 80px;

    padding: 5px 7px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: white;

    outline: none;
}

#reset {
    padding: 6px 10px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;

    background: rgba(0,0,0,.65);
    color: rgba(255,255,255,.8);

    cursor: pointer;
}

#reset:hover {
    background: rgba(255,255,255,.1);
}

#progress {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    pointer-events: none;

    opacity: 0;

    transition: opacity .2s ease;
}

#progress.active {
    opacity: 1;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: rgba(255,255,255,.8);

    transition: width .08s linear;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
    <div>Zoom: <span id="zoom">1×</span></div>
    <div>Iterations: <span id="iterationText">500</span></div>
    <div>Precision: <span>double-single</span></div>
</div>

<div id="controls">

    <input
        id="iterations"
        type="number"
        min="1"
        max="100000"
        value="500"
        inputmode="numeric"
    >

    <button id="reset">
        Reset
    </button>

</div>

<div id="progress">
    <div id="progressBar"></div>
</div>


<script>
"use strict";


/* =========================================================
   WebGL
========================================================= */

const canvas =
    document.getElementById("canvas");

const gl =
    canvas.getContext("webgl2", {
        antialias: false,
        powerPreference: "high-performance"
    });

if (!gl) {
    alert("このブラウザはWebGL2に対応していません。");
    throw new Error("WebGL2 unavailable");
}


/* =========================================================
   UI
========================================================= */

const zoomText =
    document.getElementById("zoom");

const iterationText =
    document.getElementById("iterationText");

const iterationsInput =
    document.getElementById("iterations");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const resetButton =
    document.getElementById("reset");


/* =========================================================
   State
========================================================= */

/*
    重要:

    centerX / centerY を Number だけで保持しない。

    JavaScript Number も IEEE-754 double なので、
    最終的には約15〜16桁で限界になる。

    そこで座標を decimal BigInt で保持する。
*/

const CENTER_SCALE_DIGITS = 40;

const CENTER_SCALE =
    10n ** BigInt(CENTER_SCALE_DIGITS);


/*
    初期値 -0.75
*/

let centerXInt =
    -75n *
    10n ** BigInt(CENTER_SCALE_DIGITS - 2);

let centerYInt = 0n;


/*
    Zoomは指数で管理する。

        zoom = 2 ^ zoomPower

    とする。

    Numberの乗算を繰り返さないため、
    極端なズームでも比較的安定する。
*/

let zoomPower = 0;


/*
    実際のzoom値を返す。

    Math.pow自体はGPU座標計算には使わない。
    表示・パン量の計算用。
*/

function getZoom() {

    return Math.pow(2, zoomPower);
}


let maxIterations = 500;

let renderVersion = 0;

let qualityTimer = null;


/* =========================================================
   Quality
========================================================= */

const MOVING_ITERATION_RATE = 0.25;
const MEDIUM_ITERATION_RATE = 0.50;
const FINAL_ITERATION_RATE = 1.0;


/* =========================================================
   Vertex Shader
========================================================= */

const vertexShaderSource = `#version 300 es

in vec2 a_position;

void main() {

    gl_Position =
        vec4(a_position, 0.0, 1.0);
}
`;


/* =========================================================
   Fragment Shader
========================================================= */

const fragmentShaderSource = `#version 300 es

precision highp float;
precision highp int;

out vec4 outColor;


/*
    ========================================================
    Double-Single arithmetic
    ========================================================

    1つの数値を

        value = hi + lo

    の2つのfloatで表現する。

    WebGL2のfloatは32bitだが、
    この方式によって実質的に約48bit前後の
    有効精度を得られる。

    深いMandelbrot zoomでは非常に重要。
*/


struct DS {
    float hi;
    float lo;
};


/* ---------- DS constructors ---------- */

DS ds(float x) {

    DS r;

    r.hi = x;
    r.lo = 0.0;

    return r;
}


/* ---------- DS normalize ---------- */

DS dsNormalize(
    float hi,
    float lo
) {

    float s =
        hi + lo;

    float e =
        lo - (s - hi);

    DS r;

    r.hi = s;
    r.lo = e;

    return r;
}


/* ---------- DS addition ---------- */

DS dsAdd(
    DS a,
    DS b
) {

    float s =
        a.hi + b.hi;

    float v =
        s - a.hi;

    float e =
        (a.hi - (s - v)) +
        (b.hi - v) +
        a.lo +
        b.lo;

    return dsNormalize(
        s,
        e
    );
}


/* ---------- DS subtraction ---------- */

DS dsSub(
    DS a,
    DS b
) {

    float s =
        a.hi - b.hi;

    float v =
        s - a.hi;

    float e =
        (a.hi - (s - v)) -
        (b.hi + v) +
        a.lo -
        b.lo;

    return dsNormalize(
        s,
        e
    );
}


/* ---------- DS multiplication ---------- */

DS dsMul(
    DS a,
    DS b
) {

    /*
        Dekker-style split

        2^12 + 1
        はfloat32の仮数分割用。
    */

    const float SPLIT =
        4097.0;


    float c11 =
        a.hi * b.hi;


    float ca =
        SPLIT * a.hi;

    float ah =
        ca - (ca - a.hi);

    float al =
        a.hi - ah;


    float cb =
        SPLIT * b.hi;

    float bh =
        cb - (cb - b.hi);

    float bl =
        b.hi - bh;


    float c12 =
        ah * bh - c11;

    c12 +=
        ah * bl;

    c12 +=
        al * bh;

    c12 +=
        al * bl;


    c12 +=
        a.hi * b.lo;

    c12 +=
        a.lo * b.hi;


    return dsNormalize(
        c11,
        c12
    );
}


/* ---------- DS × float ---------- */

DS dsMulFloat(
    DS a,
    float b
) {

    float p =
        a.hi * b;

    float e =
        a.lo * b;


    return dsNormalize(
        p,
        e
    );
}


/* ---------- DS absolute ---------- */

float dsAbs(
    DS a
) {

    return abs(
        a.hi + a.lo
    );
}


/* ========================================================
   Uniforms
======================================================== */

uniform vec2 u_resolution;

uniform vec2 u_centerHi;
uniform vec2 u_centerLo;

uniform float u_zoomHi;
uniform float u_zoomLo;

uniform int u_iterations;


/* ========================================================
   Color
======================================================== */

vec3 colorize(
    float t
) {

    float r =
        0.5 +
        0.5 *
        cos(
            6.2831853 *
            (t + 0.00)
        );

    float g =
        0.5 +
        0.5 *
        cos(
            6.2831853 *
            (t + 0.33)
        );

    float b =
        0.5 +
        0.5 *
        cos(
            6.2831853 *
            (t + 0.66)
        );

    return vec3(
        r,
        g,
        b
    );
}


/* ========================================================
   Main
======================================================== */

void main() {

    vec2 pixel =
        gl_FragCoord.xy;


    float scale =
        min(
            u_resolution.x,
            u_resolution.y
        );


    /*
        pixel offset

        ここは画面内の相対値なので
        float32でも十分な精度がある。

        問題なのは巨大な中心座標との加算なので、
        そこだけDSにする。
    */

    vec2 pixelOffset =
        (
            pixel -
            0.5 * u_resolution
        ) / scale;


    /*
        zoomをDSとして作成
    */

    DS zoomDS =
        dsNormalize(
            u_zoomHi,
            u_zoomLo
        );


    /*
        1 / zoom

        深いズームでは非常に小さい値になる。

        ここでは pixelOffset はfloat、
        zoomの逆数はDSとして計算する。
    */

    float zoomValue =
        zoomDS.hi +
        zoomDS.lo;


    /*
        画面座標をfloatのまま
        centerへ足さない。

        pixelOffset / zoom を
        DS化してから加算する。
    */

    float invZoom =
        1.0 / zoomValue;


    DS dx =
        ds(
            pixelOffset.x *
            invZoom
        );

    DS dy =
        ds(
            pixelOffset.y *
            invZoom
        );


    /*
        center
    */

    DS cx =
        dsNormalize(
            u_centerHi.x,
            u_centerLo.x
        );

    DS cy =
        dsNormalize(
            u_centerHi.y,
            u_centerLo.y
        );


    /*
        c = center + offset / zoom
    */

    cx =
        dsAdd(
            cx,
            dx
        );

    cy =
        dsAdd(
            cy,
            dy
        );


    /*
        Mandelbrot z

        zもDS。
    */

    DS zx =
        ds(0.0);

    DS zy =
        ds(0.0);


    int escaped =
        0;

    float smoothIteration =
        0.0;


    for (
        int n = 0;
        n < 100000;
        n++
    ) {

        if (
            n >= u_iterations
        ) {
            break;
        }


        /*
            x²
        */

        DS xx =
            dsMul(
                zx,
                zx
            );


        /*
            y²
        */

        DS yy =
            dsMul(
                zy,
                zy
            );


        /*
            2xy
        */

        DS xy =
            dsMul(
                zx,
                zy
            );

        xy =
            dsMulFloat(
                xy,
                2.0
            );


        /*
            new z

            x' = x² - y² + cx
            y' = 2xy + cy
        */

        DS newX =
            dsAdd(
                dsSub(
                    xx,
                    yy
                ),
                cx
            );


        DS newY =
            dsAdd(
                xy,
                cy
            );


        zx =
            newX;

        zy =
            newY;


        /*
            |z|²
        */

        DS xx2 =
            dsMul(
                zx,
                zx
            );

        DS yy2 =
            dsMul(
                zy,
                zy
            );


        DS magnitude =
            dsAdd(
                xx2,
                yy2
            );


        float magnitudeSquared =
            magnitude.hi +
            magnitude.lo;


        if (
            magnitudeSquared > 256.0
        ) {

            /*
                Smooth coloring
            */

            float logZn =
                log(
                    magnitudeSquared
                ) * 0.5;


            float nu =
                log(
                    logZn /
                    log(2.0)
                ) /
                log(2.0);


            smoothIteration =
                float(n) +
                1.0 -
                nu;


            escaped =
                1;

            break;
        }
    }


    /*
        Interior
    */

    if (
        escaped == 0
    ) {

        outColor =
            vec4(
                0.0,
                0.0,
                0.0,
                1.0
            );

        return;
    }


    float t =
        smoothIteration /
        float(u_iterations);


    t =
        pow(
            clamp(
                t,
                0.0,
                1.0
            ),
            0.35
        );


    outColor =
        vec4(
            colorize(t),
            1.0
        );
}
`;


/* =========================================================
   Shader compilation
========================================================= */

function createShader(
    type,
    source
) {

    const shader =
        gl.createShader(type);


    gl.shaderSource(
        shader,
        source
    );

    gl.compileShader(
        shader
    );


    if (
        !gl.getShaderParameter(
            shader,
            gl.COMPILE_STATUS
        )
    ) {

        const error =
            gl.getShaderInfoLog(
                shader
            );

        gl.deleteShader(shader);

        throw new Error(error);
    }


    return shader;
}


function createProgram(
    vertexSource,
    fragmentSource
) {

    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexSource
        );


    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentSource
        );


    const program =
        gl.createProgram();


    gl.attachShader(
        program,
        vertexShader
    );

    gl.attachShader(
        program,
        fragmentShader
    );


    gl.linkProgram(
        program
    );


    if (
        !gl.getProgramParameter(
            program,
            gl.LINK_STATUS
        )
    ) {

        throw new Error(
            gl.getProgramInfoLog(
                program
            )
        );
    }


    gl.deleteShader(
        vertexShader
    );

    gl.deleteShader(
        fragmentShader
    );


    return program;
}


const program =
    createProgram(
        vertexShaderSource,
        fragmentShaderSource
    );


gl.useProgram(
    program
);


/* =========================================================
   Fullscreen triangle
========================================================= */

const vertices =
    new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
    ]);


const buffer =
    gl.createBuffer();


gl.bindBuffer(
    gl.ARRAY_BUFFER,
    buffer
);


gl.bufferData(
    gl.ARRAY_BUFFER,
    vertices,
    gl.STATIC_DRAW
);


const positionLocation =
    gl.getAttribLocation(
        program,
        "a_position"
    );


gl.enableVertexAttribArray(
    positionLocation
);


gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* =========================================================
   Uniform locations
========================================================= */

const resolutionLocation =
    gl.getUniformLocation(
        program,
        "u_resolution"
    );


const centerHiLocation =
    gl.getUniformLocation(
        program,
        "u_centerHi"
    );


const centerLoLocation =
    gl.getUniformLocation(
        program,
        "u_centerLo"
    );


const zoomHiLocation =
    gl.getUniformLocation(
        program,
        "u_zoomHi"
    );


const zoomLoLocation =
    gl.getUniformLocation(
        program,
        "u_zoomLo"
    );


const iterationsLocation =
    gl.getUniformLocation(
        program,
        "u_iterations"
    );


/* =========================================================
   BigInt -> double-single
========================================================= */

/*
    BigIntで持っている座標を

        hi + lo

    の2つのfloatへ変換する。

    BigInt全体をNumberに変換すると
    その時点で精度を失うため、
    上位・下位へ分割する。
*/

function bigintToDS(
    value
) {

    const scale =
        CENTER_SCALE;


    const integerPart =
        value / scale;


    const remainder =
        value % scale;


    const integerNumber =
        Number(integerPart);


    const fractionNumber =
        Number(remainder) /
        Number(scale);


    /*
        integerNumberをfloat32へ
        落とした際の誤差を
        low側へ回収する。
    */

    const hi =
        Math.fround(
            integerNumber
        );


    const integerError =
        integerNumber -
        hi;


    const lo =
        Math.fround(
            integerError +
            fractionNumber
        );


    return {
        hi,
        lo
    };
}


/*
    Numberのzoomを
    double-singleへ分解。
*/

function numberToDS(
    value
) {

    const hi =
        Math.fround(value);

    const lo =
        Math.fround(
            value - hi
        );

    return {
        hi,
        lo
    };
}


/* =========================================================
   Resize
========================================================= */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    const width =
        Math.floor(
            canvas.clientWidth *
            dpr
        );


    const height =
        Math.floor(
            canvas.clientHeight *
            dpr
        );


    if (
        canvas.width !== width ||
        canvas.height !== height
    ) {

        canvas.width =
            width;

        canvas.height =
            height;
    }


    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   Progress
========================================================= */

function setProgress(
    value
) {

    value =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );


    progressBar.style.width =
        `${value * 100}%`;


    progress.classList.add(
        "active"
    );
}


function finishProgress() {

    progressBar.style.width =
        "100%";


    setTimeout(() => {

        progress.classList.remove(
            "active"
        );

    }, 250);
}


/* =========================================================
   Render
========================================================= */

function render(
    iterationRate,
    progressValue
) {

    resizeCanvas();


    const iterations =
        Math.max(
            1,
            Math.floor(
                maxIterations *
                iterationRate
            )
        );


    const centerX =
        bigintToDS(
            centerXInt
        );


    const centerY =
        bigintToDS(
            centerYInt
        );


    const zoom =
        numberToDS(
            getZoom()
        );


    gl.useProgram(
        program
    );


    gl.uniform2f(
        resolutionLocation,
        canvas.width,
        canvas.height
    );


    gl.uniform2f(
        centerHiLocation,
        centerX.hi,
        centerY.hi
    );


    gl.uniform2f(
        centerLoLocation,
        centerX.lo,
        centerY.lo
    );


    gl.uniform2f(
        zoomHiLocation,
        zoom.hi,
        zoom.lo
    );


    /*
        zoomLoLocationは
        vec2ではなくshader上ではfloatなので、
        実際には以下のuniform設定は不要。

        zoomはuniform vec2ではなく
        float 2本として送る。
    */

    gl.uniform1f(
        zoomHiLocation,
        zoom.hi
    );

    gl.uniform1f(
        zoomLoLocation,
        zoom.lo
    );


    gl.uniform1i(
        iterationsLocation,
        iterations
    );


    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );


    setProgress(
        progressValue
    );
}


/* =========================================================
   Moving render
========================================================= */

function renderMoving() {

    renderVersion++;

    clearTimeout(
        qualityTimer
    );


    setProgress(0);


    render(
        MOVING_ITERATION_RATE,
        0.15
    );
}


/* =========================================================
   High quality
========================================================= */

function scheduleHighQuality() {

    const version =
        renderVersion;


    clearTimeout(
        qualityTimer
    );


    qualityTimer =
        setTimeout(() => {

            if (
                version !== renderVersion
            ) {
                return;
            }


            render(
                MEDIUM_ITERATION_RATE,
                0.5
            );


            if (
                version !== renderVersion
            ) {
                return;
            }


            setTimeout(() => {

                if (
                    version !== renderVersion
                ) {
                    return;
                }


                render(
                    FINAL_ITERATION_RATE,
                    1
                );


                if (
                    version === renderVersion
                ) {

                    finishProgress();
                }

            }, 50);

        }, 100);
}


/* =========================================================
   Final
========================================================= */

function renderFinal() {

    renderVersion++;

    clearTimeout(
        qualityTimer
    );


    setProgress(0);


    render(
        FINAL_ITERATION_RATE,
        1
    );


    finishProgress();
}


/* =========================================================
   High precision coordinate movement
========================================================= */

/*
    Numberの小さなdeltaをBigIntへ変換する。

    deltaは

        dx / scale / zoom

    なので、ズームが深くなるほど非常に小さくなる。

    BigIntの40桁固定小数点へ変換する。
*/

function numberToFixedBigInt(
    value
) {

    if (
        !Number.isFinite(value) ||
        value === 0
    ) {
        return 0n;
    }


    const sign =
        value < 0
            ? -1n
            : 1n;


    value =
        Math.abs(value);


    /*
        40桁固定小数へ。
    */

    const scaled =
        value *
        10 ** CENTER_SCALE_DIGITS;


    /*
        Number自体の精度限界を超える部分は
       ここでは表現できない。

        ただし通常のパン操作のdeltaは
        十分小さくても相対精度を保てる。
    */

    return (
        sign *
        BigInt(
            Math.round(
                scaled
            )
        )
    );
}


/*
    画面ピクセルから複素平面deltaを計算。

    zoom = 2^zoomPower

    として扱うことで、
    zoom自体を直接掛け続けることによる
   丸めを避ける。
*/

function screenDeltaToComplex(
    pixels
) {

    const scale =
        Math.min(
            canvas.clientWidth,
            canvas.clientHeight
        );


    /*
        2^-zoomPower

        zoomPowerが大きい場合、
        Numberでは小さすぎて0になる可能性がある。

        その場合はBigInt固定小数へ直接変換する。
    */

    const exponent =
        -zoomPower;


    if (exponent < -1020) {

        /*
            JavaScript Numberでは
            これ以上小さい値を扱えない。

            この領域では実質的に
            1px未満のパンになるため無視。
        */

        return 0n;
    }


    const scaleFactor =
        Math.pow(
            2,
            exponent
        );


    return numberToFixedBigInt(
        pixels *
        scaleFactor /
        scale
    );
}


/* =========================================================
   Zoom
========================================================= */

function zoomAt(
    screenX,
    screenY,
    powerDelta
) {

    const rect =
        canvas.getBoundingClientRect();


    const x =
        screenX -
        rect.left;


    const y =
        screenY -
        rect.top;


    const scale =
        Math.min(
            rect.width,
            rect.height
        );


    /*
        ズーム前のカーソル位置。

        delta = pixel / zoom
    */

    const oldZoomFactor =
        Math.pow(
            2,
            -zoomPower
        );


    const beforeX =
        (
            x -
            rect.width / 2
        ) /
        scale *
        oldZoomFactor;


    const beforeY =
        (
            rect.height / 2 -
            y
        ) /
        scale *
        oldZoomFactor;


    /*
        ズーム
    */

    zoomPower +=
        powerDelta;


    /*
        ズーム後の同じ画面位置
    */

    const newZoomFactor =
        Math.pow(
            2,
            -zoomPower
        );


    const afterX =
        (
            x -
            rect.width / 2
        ) /
        scale *
        newZoomFactor;


    const afterY =
        (
            rect.height / 2 -
            y
        ) /
        scale *
        newZoomFactor;


    /*
        center += before - after
    */

    centerXInt +=
        numberToFixedBigInt(
            beforeX -
            afterX
        );


    centerYInt +=
        numberToFixedBigInt(
            beforeY -
            afterY
        );


    updateInfo();

    renderMoving();

    scheduleHighQuality();
}


/* =========================================================
   Mouse
========================================================= */

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;


canvas.addEventListener(
    "mousedown",
    e => {

        dragging = true;

        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;


        renderVersion++;

        clearTimeout(
            qualityTimer
        );

        setProgress(0);
    }
);


window.addEventListener(
    "mousemove",
    e => {

        if (!dragging) {
            return;
        }


        const dx =
            e.clientX -
            lastMouseX;


        const dy =
            e.clientY -
            lastMouseY;


        /*
            右へドラッグ
                => Mandelbrotは左へ

            下へドラッグ
                => Mandelbrotは上へ
        */

        centerXInt -=
            screenDeltaToComplex(
                dx
            );


        centerYInt +=
            screenDeltaToComplex(
                dy
            );


        lastMouseX =
            e.clientX;

        lastMouseY =
            e.clientY;


        updateInfo();

        renderMoving();
    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (!dragging) {
            return;
        }


        dragging = false;

        scheduleHighQuality();
    }
);


/* =========================================================
   Wheel
========================================================= */

canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();


        /*
            以前の

                exp(-deltaY * 0.0015)

            の代わりに
            2の指数で管理する。

            1 wheel = 約1.5倍程度。
        */

        const powerDelta =
            -e.deltaY *
            0.0015 /
            Math.LN2;


        zoomAt(
            e.clientX,
            e.clientY,
            powerDelta
        );

    },
    {
        passive: false
    }
);


/* =========================================================
   Touch
========================================================= */

let touches =
    new Map();


let pinchStartDistance = 0;

let pinchStartZoomPower = 0;


function touchDistance(
    a,
    b
) {

    return Math.hypot(
        a.clientX -
        b.clientX,

        a.clientY -
        b.clientY
    );
}


canvas.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        ) {

            touches.set(
                touch.identifier,
                {
                    clientX:
                        touch.clientX,

                    clientY:
                        touch.clientY,

                    lastX:
                        touch.clientX,

                    lastY:
                        touch.clientY
                }
            );
        }


        renderVersion++;

        clearTimeout(
            qualityTimer
        );


        if (
            touches.size === 2
        ) {

            const [
                a,
                b
            ] =
                [...touches.values()];


            pinchStartDistance =
                touchDistance(
                    a,
                    b
                );


            pinchStartZoomPower =
                zoomPower;
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        ) {

            const old =
                touches.get(
                    touch.identifier
                );


            if (old) {

                old.clientX =
                    touch.clientX;

                old.clientY =
                    touch.clientY;
            }
        }


        if (
            touches.size === 1
        ) {

            const touch =
                [...touches.values()][0];


            const dx =
                touch.clientX -
                touch.lastX;


            const dy =
                touch.clientY -
                touch.lastY;


            centerXInt -=
                screenDeltaToComplex(
                    dx
                );


            centerYInt +=
                screenDeltaToComplex(
                    dy
                );


            touch.lastX =
                touch.clientX;

            touch.lastY =
                touch.clientY;


            updateInfo();

            renderMoving();
        }


        else if (
            touches.size === 2
        ) {

            const [
                a,
                b
            ] =
                [...touches.values()];


            const distance =
                touchDistance(
                    a,
                    b
                );


            if (
                pinchStartDistance > 0
            ) {

                /*
                    ピンチ比率から
                    log2 zoomを計算
                */

                const ratio =
                    distance /
                    pinchStartDistance;


                zoomPower =
                    pinchStartZoomPower +
                    Math.log2(
                        ratio
                    );


                updateInfo();

                renderMoving();
            }
        }

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    e => {

        e.preventDefault();


        for (
            const touch
            of e.changedTouches
        ) {

            touches.delete(
                touch.identifier
            );
        }


        if (
            touches.size === 0
        ) {

            scheduleHighQuality();
        }
    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchcancel",
    () => {

        touches.clear();

        scheduleHighQuality();
    }
);


/* =========================================================
   Iterations
========================================================= */

iterationsInput.addEventListener(
    "change",
    () => {

        let value =
            parseInt(
                iterationsInput.value,
                10
            );


        if (
            !Number.isFinite(value)
        ) {
            value = 500;
        }


        value =
            Math.max(
                1,
                Math.min(
                    100000,
                    value
                )
            );


        maxIterations =
            value;


        iterationsInput.value =
            value;


        iterationText.textContent =
            value;


        renderFinal();
    }
);


/* =========================================================
   Reset
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        centerXInt =
            -75n *
            10n **
            BigInt(
                CENTER_SCALE_DIGITS - 2
            );


        centerYInt =
            0n;


        zoomPower =
            0;


        updateInfo();

        renderFinal();
    }
);


/* =========================================================
   UI
========================================================= */

function updateInfo() {

    const zoom =
        getZoom();


    if (
        !Number.isFinite(zoom) ||
        zoom >= 1000000
    ) {

        zoomText.textContent =
            `2^${zoomPower.toFixed(2)}`;

    }
    else {

        zoomText.textContent =
            zoom.toFixed(
                zoom < 100
                    ? 2
                    : 0
            ) +
            "×";
    }


    iterationText.textContent =
        maxIterations;
}


/* =========================================================
   Resize
========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        renderFinal();
    }
);


/* =========================================================
   Start
========================================================= */

resizeCanvas();

updateInfo();

renderFinal();

</script>

</body>
</html>
